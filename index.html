<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbarians — Prototype</title>
<style>
  /* ---------------------------------------------
     DESIGN TOKENS
     Every color and font in this file is defined ONCE here and
     referenced everywhere else via var(--token-name). This is a
     CSS custom properties block (the :root selector targets the
     <html> element, making these variables available anywhere in
     the document). Change a value here and every element using it
     updates automatically — no more hunting down five copies of
     the same hex code.

     Full reference, naming rationale, and "when to add a new
     token" guidance: see /docs/tokens.md in the repo.
     --------------------------------------------- */
  :root {
    /* Backgrounds — darkest to lightest */
    --color-bg-page: #1b1b1b;         /* page background, dark selects/buttons text-on */
    --color-bg-panel: #262626;        /* character cards, candidate cards, resource bar */
    --color-bg-log-entry: #202020;    /* day log entries — slightly darker than panel */
    --color-bg-candidate-selected: #33301f; /* selected candidate card tint */

    /* Text */
    --color-text-primary: #e8e0d0;    /* main body text */
    --color-text-muted: #bdbdbd;      /* backstory text */
    --color-text-disabled: #999;      /* disabled button text */
    --color-text-footer: #666;        /* version footer */

    /* Accent — the game's signature bronze/gold, used for
       emphasis, primary buttons, and skill labels */
    --color-accent-gold: #8a6d3b;     /* primary buttons, selected border, on-card accents */
    --color-accent-gold-light: #c9a86a; /* skill labels, italic emphasis text, warnings */
    --color-accent-gold-muted: #8a7a54; /* secondary-skill text — dimmer than primary gold */

    /* Borders / dividers */
    --color-border-default: #555;     /* default card/input border */
    --color-border-subtle: #333;      /* footer divider */

    /* Status — hunger tags */
    --color-status-hungry-bg: #6b5a1f;
    --color-status-hungry-text: #e6d6a6;
    --color-status-starving-bg: #6b2f1f;
    --color-status-starving-text: #e6b6a6;
    --color-status-deceased: #6b1f1f; /* deceased card border */
    --color-status-deceased-text: #a05050; /* deceased character name */

    /* Status — game over banners */
    --color-victory-bg: #2f4a2f;
    --color-victory-text: #b6e6b6;
    --color-victory-border: #5a8a5a;
    --color-defeat-bg: #4a2f2f;
    --color-defeat-text: #e6b6b6;
    --color-defeat-border: #8a5a5a;

    /* Status — misc accents */
    --color-supplies-text: #7a9e7a;   /* "Brings: ..." line on candidate cards, greenish */

    /* Fonts */
    --font-body: Georgia, serif;      /* the only font family in use, tokenized so it's
                                          a one-line change if that ever needs to differ
                                          per-element (e.g. a future monospace debug view) */
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-body);
    max-width: 700px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 {
    border-bottom: 1px solid var(--color-border-default);
    padding-bottom: 8px;
  }
  .character {
    margin-bottom: 18px;
    padding: 10px;
    background: var(--color-bg-panel);
    border-left: 3px solid var(--color-accent-gold);
  }
  .character .name {
    font-weight: bold;
    font-size: 1.1em;
  }
  .character .skill {
    color: var(--color-accent-gold-light);
    font-style: italic;
  }
  .character .secondary-skill {
    color: var(--color-accent-gold-muted);

  }

  }

    color: var(--color-status-starving-text);
  }

    border-left-color: var(--color-status-deceased);
    opacity: 0.6;
  }
  .character.deceased .name {
    color: var(--color-status-deceased-text);
  }
  .character .task-row {
    margin-top: 8px;
  }
  select {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    border: 1px solid var(--color-border-default);
    padding: 8px;
    font-family: var(--font-body);
    font-size: 1em;
    max-width: 100%;
  }
  #startDayBtn {
    margin-top: 10px;

    border: none;
    font-family: var(--font-body);

  #assignmentStatus {

  }
  #resourceSummary {
    margin-bottom: 20px;
    padding: 10px;
    background: var(--color-bg-panel);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    font-size: 0.95em;
  }
  #resourceSummary span {
    color: var(--color-accent-gold-light);
  }
  .game-over {
    margin-bottom: 20px;

  .game-over.victory {
    background: var(--color-victory-bg);

  }

  }
  #resetBtn {
    margin-top: 10px;
    padding: 10px 16px;
    background: var(--color-accent-gold);
    color: var(--color-bg-page);
    border: none;
    font-family: var(--font-body);
    font-weight: bold;
    cursor: pointer;
  }
  #dayLog {
    margin-top: 20px;
  }
  .day-entry {
    margin-bottom: 14px;

  .day-entry .day-title {

  }
  .day-entry ul {

  }
  #selectionInstructions {

  }
  #candidatePool {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .candidate {
    width: 200px;
    padding: 10px;
    background: var(--color-bg-panel);
    border-left: 3px solid var(--color-border-default);
    cursor: pointer;
  }
  .candidate.selected {
    border-left-color: var(--color-accent-gold);
    background: var(--color-bg-candidate-selected);
  }
  .candidate .name {
    font-weight: bold;
  }
  .candidate .skill {
    color: var(--color-accent-gold-light);
    font-style: italic;
    font-size: 0.9em;
  }
  .candidate .secondary-skill {
    color: var(--color-accent-gold-muted);
    font-style: italic;
    font-size: 0.78em;
  }
  .candidate .backstory {
    margin-top: 4px;
    font-size: 0.85em;
    color: var(--color-text-muted);
  }
  .candidate .supplies {
    margin-top: 6px;
    font-size: 0.85em;
    color: var(--color-supplies-text);
  }
  #rerollBtn, #confirmVanguardBtn {
    margin-top: 14px;
    padding: 12px 18px;
    background: var(--color-accent-gold);
    color: var(--color-bg-page);
    border: none;
    font-family: var(--font-body);
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
  }
  #rerollBtn:disabled, #confirmVanguardBtn:disabled {
    background: var(--color-border-default);
    color: var(--color-text-disabled);
    cursor: not-allowed;
  }
  #rerollCount {
    margin-left: 10px;
    color: var(--color-accent-gold-light);
    font-style: italic;
  }
  /* Version tag — small, unobtrusive line directly under the game
     title. Nothing has shipped yet, so this stays a plain subtitle
     rather than a pinned page footer. */
  #versionTag {
    margin-top: -8px;
    margin-bottom: 24px;
    color: var(--color-text-footer);
    font-size: 0.75em;
    font-family: var(--font-body);
    text-align: center;
  }

  /* ---------------------------------------------
     MOBILE RESPONSIVENESS
     Narrow viewports: candidate cards go full-width and stack
     (instead of a multi-column flex-wrap grid that shrinks
     illegibly), buttons/selects get bigger tap targets, and
     side-by-side layout collapses to single column.
     --------------------------------------------- */
  @media (max-width: 600px) {
    body {
      margin: 16px auto;
      font-size: 1.05em;
    }
    h1 {
      font-size: 1.6em;
    }
    #candidatePool {
      flex-direction: column;
    }
    .candidate {
      width: 100%;
    }
    #resourceSummary {
      flex-direction: column;
      gap: 6px;
    }
    #rerollBtn {
      width: 100%;
      margin-right: 0;
    }
    #rerollCount {
      display: block;
      margin-left: 0;
      margin-top: 8px;
    }
    #confirmVanguardBtn {
      width: 100%;
    }
    select {
      width: 100%;
    }
    /* In-game roster (post-selection) — same full-width, bigger-tap-target
       treatment as the candidate screen. .character cards already stack
       (one per row, block-level div), so the main fix here is sizing
       within the card, not layout direction. */
    .character {
      padding: 12px;
    }
    .character .name {
      font-size: 1.15em;
    }
    .character .task-row select {
      width: 100%;
      margin-top: 6px;
    }
    .character .task-row label {
      display: block;
      margin-bottom: 2px;
    }
    .day-entry {
      padding: 12px;
    }
    .game-over {
      font-size: 1em;
    }
  }
</style>
