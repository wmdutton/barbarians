<!--
  Barbarians — Prototype
  Version: 0.5.0.0
  Author: Mason Dutton
  Last updated: 2026-07-26

  Full changelog is kept separately (not in this file); see
  barbarians-changelog.md, attached to the project.

  Single-file HTML/CSS/JS prototype. No build step, no dependencies —
  open directly in a browser or serve as a static site (e.g. GitHub Pages).
  This is Phase 1 (The Vanguard) only: character generation, vanguard
  selection, daily action assignment, and outrider raid mechanics.

  Comments in this file explain WHAT the code does. For WHY specific
  numbers/rules were chosen, see design-rationale.md (repo root).
  For the full game vision and locked decisions, see the project's
  design docs in /docs/. Token reference: /docs/tokens.md.
  Component reference: /docs/components.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbarians — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral+SC:wght@400;600;700&family=Spectral:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  /* ---------------------------------------------
     DESIGN TOKENS — LEGACY (game screen, dark theme)
     Original tokens kept intact for the game screen.
     New parchment tokens below cover the selection screen.
     Full reference: /docs/tokens.md in the repo.
     --------------------------------------------- */
  :root {
    /* Backgrounds — darkest to lightest */
    --color-bg-page: #1b1b1b;
    --color-bg-panel: #262626;
    --color-bg-log-entry: #202020;
    --color-bg-candidate-selected: #33301f;

    /* Text */
    --color-text-primary: #e8e0d0;
    --color-text-muted: #bdbdbd;
    --color-text-disabled: #999;
    --color-text-footer: #666;

    /* Accent — bronze/gold */
    --color-accent-gold: #8a6d3b;
    --color-accent-gold-light: #c9a86a;
    --color-accent-gold-muted: #8a7a54;

    /* Borders / dividers */
    --color-border-default: #555;
    --color-border-subtle: #333;

    /* Status — hunger tags */
    --color-status-hungry-bg: #6b5a1f;
    --color-status-hungry-text: #e6d6a6;
    --color-status-starving-bg: #6b2f1f;
    --color-status-starving-text: #e6b6a6;
    --color-status-deceased: #6b1f1f;
    --color-status-deceased-text: #a05050;

    /* Status — game over banners */
    --color-victory-bg: #2f4a2f;
    --color-victory-text: #b6e6b6;
    --color-victory-border: #5a8a5a;
    --color-defeat-bg: #4a2f2f;
    --color-defeat-text: #e6b6b6;
    --color-defeat-border: #8a5a5a;

    /* Status — misc accents */
    --color-supplies-text: #7a9e7a;

    /* Fonts — legacy game screen */
    --font-body: Georgia, serif;

    /* -----------------------------------------
       DESIGN TOKENS — PARCHMENT SYSTEM
       Selection screen and future parchment surfaces.
       Source of truth: /docs/tokens.md
       ----------------------------------------- */

    /* Parchment surfaces */
    --color-parchment:        #eee5d2;
    --color-parchment-mid:    #d8ccb4;
    --color-parchment-deep:   #c8b89a;

    /* Card surfaces */
    --color-card-bg:          #f5ede0;
    --color-card-portrait-bg: #d8ccb4;

    /* Ink — text on parchment */
    --color-ink-primary:      #2a1f10;
    --color-ink-secondary:    #3a2f1e;
    --color-ink-role:         #7a5c2e;
    --color-ink-ornament:     #b8a07a;
    --color-ink-muted:        #9a8060;

    /* Accent — selected / danger */
    --color-selected:         #8b3a2f;
    --color-selected-glow:    rgba(139,58,47,0.2);

    /* Status */
    --color-supplies-parchment: #5a7a4a;

    /* Typography */
    --font-display:   'Spectral SC', Georgia, serif;
    --font-body-new:  'Spectral', Georgia, serif;
    --font-numeric:   'Trebuchet MS', Arial, sans-serif;

    /* Type sizes */
    --text-xs:   8px;
    --text-sm:   9px;
    --text-base: 9.5px;
    --text-md:   11px;
    --text-lg:   13px;
    --text-xl:   16px;

    /* Leading */
    --leading-tight: 1.2;
    --leading-base:  1.65;

    /* Tracking */
    --tracking-wide:   0.1em;
    --tracking-wider:  0.14em;
    --tracking-widest: 0.2em;

    /* Card geometry */
    --card-radius:          10px;
    --card-border-well:     1px solid #c8b89a;
    --card-border-selected: 1px solid #8b3a2f;
    --card-shadow-selected: 0 0 0 2px rgba(139,58,47,0.2);
    --card-padding:         12px;

    /* Portrait zones — selection screen */
    --portrait-height-full: 170px;
    --portrait-fade-height: 80px;

    /* Layout gaps */
    --gap-xs: 4px;
    --gap-sm: 8px;
    --gap-md: 12px;
    --gap-lg: 16px;

    /* Component shorthands */
    --divider-ink: linear-gradient(to right, transparent, rgba(200,184,154,0.7), transparent);
    --portrait-fade: linear-gradient(to bottom, rgba(238,229,210,0) 0%, rgba(238,229,210,0.6) 50%, #eee5d2 88%);

    /* Transitions */
    --transition-card: 150ms ease;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-body);
    max-width: 700px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 {
    border-bottom: 1px solid var(--color-border-default);
    padding-bottom: 8px;
  }
  .character {
    margin-bottom: 18px;
    padding: 10px;
    background: var(--color-bg-panel);
    border-left: 3px solid var(--color-accent-gold);
  }
  .character .name {
    font-weight: bold;
    font-size: 1.1em;
  }
  .character .skill {
    color: var(--color-accent-gold-light);
    font-style: italic;
  }
  .character .secondary-skill {
    color: var(--color-accent-gold-muted);
    font-style: italic;
    font-size: 0.8em;
  }
  .character .backstory {
    margin-top: 4px;
    color: var(--color-text-muted);
  }
  .hunger-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    font-size: 0.8em;
    font-weight: bold;
    text-transform: uppercase;
    border-radius: 3px;
  }
  .hunger-tag.hungry {
    background: var(--color-status-hungry-bg);
    color: var(--color-status-hungry-text);
  }
  .hunger-tag.starving {
    background: var(--color-status-starving-bg);
    color: var(--color-status-starving-text);
  }
  .character.deceased {
    border-left-color: var(--color-status-deceased);
    opacity: 0.6;
  }
  .character.deceased .name {
    color: var(--color-status-deceased-text);
  }
  .character .task-row {
    margin-top: 8px;
  }
  select {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    border: 1px solid var(--color-border-default);
    padding: 8px;
    font-family: var(--font-body);
    font-size: 1em;
    max-width: 100%;
  }
  #startDayBtn {
    margin-top: 10px;
    padding: 12px 18px;
    background: var(--color-accent-gold);
    color: var(--color-bg-page);
    border: none;
    font-family: var(--font-body);
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
    width: 100%;
  }
  #startDayBtn:disabled {
    background: var(--color-border-default);
    color: var(--color-text-disabled);
    cursor: not-allowed;
  }
  #assignmentStatus {
    margin-top: 6px;
    color: var(--color-accent-gold-light);
    font-style: italic;
  }
  #resourceSummary {
    margin-bottom: 20px;
    padding: 10px;
    background: var(--color-bg-panel);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    font-size: 0.95em;
  }
  #resourceSummary span {
    color: var(--color-accent-gold-light);
  }
  .game-over {
    margin-bottom: 20px;
    padding: 14px;
    font-weight: bold;
    font-size: 1.1em;
    text-align: center;
  }
  .game-over.victory {
    background: var(--color-victory-bg);
    color: var(--color-victory-text);
    border: 1px solid var(--color-victory-border);
  }
  .game-over.defeat {
    background: var(--color-defeat-bg);
    color: var(--color-defeat-text);
    border: 1px solid var(--color-defeat-border);
  }
  #resetBtn {
    margin-top: 10px;
    padding: 10px 16px;
    background: var(--color-accent-gold);
    color: var(--color-bg-page);
    border: none;
    font-family: var(--font-body);
    font-weight: bold;
    cursor: pointer;
  }
  #dayLog {
    margin-top: 20px;
  }
  .day-entry {
    margin-bottom: 14px;
    padding: 10px;
    background: var(--color-bg-log-entry);
    border-left: 3px solid var(--color-border-default);
  }
  .day-entry .day-title {
    font-weight: bold;
    margin-bottom: 6px;
    color: var(--color-accent-gold-light);
  }
  .day-entry ul {
    margin: 0;
    padding-left: 20px;
  }
  /* ---------------------------------------------
     SELECTION SCREEN — parchment skin
     Component spec: /docs/components.md §1
     --------------------------------------------- */

  /* Page shell for the selection screen — parchment background,
     centered, readable at desktop and mobile widths. */
  #selectionScreen {
    background: var(--color-parchment);
    min-height: 100vh;
    padding: 0 16px 48px;
    box-sizing: border-box;
    font-family: var(--font-display);
    position: relative;
  }

  /* Version tag — pinned top-right, out of the way */
  #selectionScreen .sel-version {
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: var(--font-display);
    font-size: 7px;
    color: var(--color-ink-ornament);
    letter-spacing: var(--tracking-wide);
    opacity: 0.6;
    margin: 0;
  }

  /* ---- Header block ---- */
  .sel-header {
    text-align: center;
    padding: 28px 16px 16px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* Main title */
  #selectionScreen .sel-title {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 700;
    color: var(--color-ink-primary);
    letter-spacing: 0.06em;
    margin: 0 0 16px;
    line-height: 1;
  }

  /* Ornamental rule under the title */
  .sel-rule {
    height: 1px;
    background: var(--divider-ink);
    border: none;
    margin: 0 auto 10px;
    max-width: 220px;
  }

  /* Instruction line */
  #selectionInstructions {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-lg);
    color: var(--color-ink-muted);
    text-align: center;
    margin: 0;
  }

  /* 2-column card grid. Gaps collapse on narrow screens (see mobile). */
  #candidatePool {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gap-md);
    max-width: 680px;
    margin: 0 auto;
  }

  /* ---- Candidate card ---- */
  .candidate {
    background: var(--color-card-bg);
    border: var(--card-border-well);
    border-radius: var(--card-radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--transition-card), box-shadow var(--transition-card);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .candidate.selected {
    border: var(--card-border-selected);
    box-shadow: var(--card-shadow-selected);
  }

  /* Selected indicator dot — top-right corner, filled circle */
  .candidate.selected::after {
    content: '';
    position: absolute;
    top: 10px;
    right: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-selected);
  }

  /* ---- Portrait zone ---- */
  /* Full-figure portrait at top of selection card.
     Falls back to the inline SVG silhouette if no image src is set. */
  .candidate-portrait-zone {
    position: relative;
    height: var(--portrait-height-full);
    background: var(--color-card-portrait-bg);
    overflow: hidden;
    flex-shrink: 0;
  }
  .candidate-portrait-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  /* Silhouette placeholder — shown when no portrait image exists.
     Inline SVG centered in the portrait zone. */
  .candidate-portrait-zone .portrait-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .candidate-portrait-zone .portrait-placeholder svg {
    width: 72px;
    height: 72px;
    opacity: 0.28;
  }
  /* Gradient fade — overlays the bottom of the portrait into the card body */
  .candidate-portrait-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--portrait-fade-height);
    background: var(--portrait-fade);
    pointer-events: none;
  }

  /* ---- Card body ---- */
  .candidate-body {
    padding: var(--card-padding);
    display: flex;
    flex-direction: column;
    gap: var(--gap-xs);
    flex: 1;
  }

  /* Name */
  .candidate .cand-name {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--color-ink-primary);
    letter-spacing: var(--tracking-wide);
    margin: 0;
    line-height: var(--leading-tight);
  }

  /* Role label */
  .candidate .cand-role {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    font-weight: 400;
    color: var(--color-ink-role);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    margin: 0;
  }

  /* Ink rule divider */
  .cand-divider {
    height: 1px;
    background: var(--divider-ink);
    border: none;
    margin: 4px 0;
  }

  /* Flavor / backstory text */
  .candidate .cand-flavor {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-base);
    color: var(--color-ink-secondary);
    line-height: var(--leading-base);
    margin: 0;
  }

  /* Tier hint line (Practiced / Poor) */
  .candidate .cand-hints {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-sm);
    color: var(--color-ink-muted);
    line-height: var(--leading-base);
    margin: 0;
  }

  /* Supplies line */
  .candidate .cand-supplies {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-supplies-parchment);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    margin: 0;
  }

  /* ---- Selection screen action row ---- */
  .sel-actions {
    max-width: 680px;
    margin: 10px auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap-md);
    flex-wrap: wrap;
  }

  /* Reroll and confirm buttons share structure; confirm is primary. */
  .sel-btn {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 150ms ease;
  }
  .sel-btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }
  .sel-btn-secondary {
    background: transparent;
    border: 1.5px solid var(--color-parchment-deep);
    color: var(--color-ink-muted);
  }
  .sel-btn-primary {
    background: transparent;
    border: 1.5px solid var(--color-selected);
    color: var(--color-selected);
  }
  .sel-btn-primary:not(:disabled):hover {
    background: rgba(139,58,47,0.06);
  }
  .sel-btn-secondary:not(:disabled):hover {
    background: rgba(200,184,154,0.18);
  }


  /* Version tag — legacy element, shown only on the game screen.
     The selection screen renders its own title/version inside #selectionScreen. */
  #versionTag {
    margin-top: -8px;
    margin-bottom: 24px;
    color: var(--color-text-footer);
    font-size: 0.75em;
    font-family: var(--font-body);
    text-align: center;
  }
  /* Hide the legacy page-level h1 and version tag while selection is visible —
     the selection screen has its own title block inside it. */
  body:has(#selectionScreen:not([style*="display: none"])) > h1,
  body:has(#selectionScreen:not([style*="display: none"])) > #versionTag {
    display: none;
  }

  /* ---------------------------------------------
     MOBILE RESPONSIVENESS
     Narrow viewports: candidate cards go full-width and stack
     (instead of a multi-column flex-wrap grid that shrinks
     illegibly), buttons/selects get bigger tap targets, and
     side-by-side layout collapses to single column.
     --------------------------------------------- */
  @media (max-width: 600px) {
    body {
      margin: 16px auto;
      font-size: 1.05em;
    }
    h1 {
      font-size: 1.6em;
    }

    /* Selection screen — single column on narrow viewports */
    #candidatePool {
      grid-template-columns: 1fr;
    }
    .sel-actions {
      flex-direction: column;
      align-items: center;
    }
    .sel-btn {
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    /* Game screen */
    #resourceSummary {
      flex-direction: column;
      gap: 6px;
    }
    select {
      width: 100%;
    }
    .character {
      padding: 12px;
    }
    .character .name {
      font-size: 1.15em;
    }
    .character .task-row select {
      width: 100%;
      margin-top: 6px;
    }
    .character .task-row label {
      display: block;
      margin-bottom: 2px;
    }
    .day-entry {
      padding: 12px;
    }
    .game-over {
      font-size: 1em;
    }
  }
</style>
</head>
<body>

<h1>Barbarians</h1>
<div id="versionTag">v0.5.0.0</div>

<div id="selectionScreen">
  <p class="sel-version">v0.5.0.0</p>
  <div class="sel-header">
    <p class="sel-title">Barbarians</p>
    <hr class="sel-rule">
    <p id="selectionInstructions"></p>
  </div>
  <div class="sel-actions">
    <button id="rerollBtn" class="sel-btn sel-btn-secondary">Reroll Characters</button>
    <button id="confirmVanguardBtn" class="sel-btn sel-btn-primary" disabled>Confirm Vanguard</button>
  </div>
  <div id="candidatePool"></div>
</div>

<div id="gameScreen" style="display: none;">
  <div id="resourceSummary"></div>
  <div id="gameOverBanner" style="display: none;"></div>
  <div id="roster"></div>
  <button id="startDayBtn" disabled>Start Day</button>
  <div id="assignmentStatus"></div>
  <div id="dayLog"></div>
</div>

<script>

// Rolls the starting tree count near the camp (8 to 10).
function rollStartingTrees() {
  return 8 + Math.floor(Math.random() * 3); // 8 to 10
}

// Rolls which day the next outrider wave arrives (1-3 days out
// from fromDay). See design-rationale.md for balance reasoning.
function rollNextWaveDay(fromDay) {
  const gap = 1 + Math.floor(Math.random() * 3); // 1 to 3 days out
  return fromDay + gap;
}

// ---------------------------------------------
// GAME STATE
// This object is the single source of truth.
// Every system reads from and writes to this.
// ---------------------------------------------
const gameState = {

  day: 1,

  resources: {
    rations: 0,     // set by whichever Cooks the player picks — see applyStartingSupplies()
    rawFood: 0,     // hunted meat — needs a Master Cook before it's safe/wise to eat
    forageFood: 0,  // foraged food — edible directly, no cooking needed, but spoils fast
    forageFoodAge: 0, // days since the current forage food stock was gathered — spoils at 2
    wood: 0,        // set by whichever Carpenters the player picks
    weapons: 0     // set by whichever Soldiers the player picks
  },

  // Fortification track — six stages, man-day costs per the design doc.
  // stageIndex points into FORTIFICATION_STAGES below; daysRemaining is
  // how many man-days are left to pay off the CURRENT stage only (not
  // the whole track). Rampart/Watchtower are intentionally out of easy
  // reach in a normal Phase 1 run — don't rebalance that away.
  //
  // hasAnnouncedStart: whether buildPalisadeFlavor has already said
  // "work has only just begun" for the CURRENT stage. Prevents that
  // line from repeating every single day a stage sits above the 66%
  // remaining threshold — it should fire once, the first day work
  // starts on a stage, then fall through to standard "coming along"
  // phrasing for the rest of that band. Reset to false whenever
  // stageIndex advances (see resolveBuildPalisade).
  fortification: {
    stageIndex: 0,
    daysRemaining: 3, // Bailey Grounds costs 3 — see FORTIFICATION_STAGES
    hasAnnouncedStart: false
  },

  characters: [], // filled in by generateSettlers()

  environment: {
    treesRemainingNearby: rollStartingTrees(), // randomized, see rollStartingTrees()
    safeForagingRange: "normal", // "extended" if player later approves risk
    groundQuality: "rocky" // slows the farmer
  },

  log: [
    // one entry per day, e.g.:
    // { day: 1, entries: ["Thomas felled two trees near camp.", "Rations held steady."] }
  ],

  pendingDecision: null,
  // when a decision is surfaced, something like:
  // { id: "rangeTrees", prompt: "...", options: ["rangeFurther", "buildSmaller"] }

  gameOver: false,
  outcome: null, // "victory" (palisade complete) or "defeat" (wiped out / starved) once gameOver is true

  nextWaveDay: rollNextWaveDay(1), // rerolled after each wave — see rollNextWaveDay
  nextWaveWindow: 3, // max days out a Scout warning can estimate
  scoutWarning: null // set by resolveScoutForEnemies: { estimatedDays, estimatedCount, accurate }

};


// ---------------------------------------------
// DATA POOLS
// Names, skills, and backstory fragments used
// to generate settlers. Kept separate from the
// generation logic so they're easy to expand later.
// ---------------------------------------------

// Names for the vanguard roster (male-only — see design-rationale.md).
const NAME_POOL = [
  "Thomas", "Aelfric", "Godwin", "Osric", "Wulfstan",
  "Alwyn", "Cedric", "Baldric", "Leofric", "Eadric",
  "Roger", "Walter", "Hubert", "Warin", "Gervase"
];

// One sentence of specific backstory per skill.
// Each skill has a few options so repeats don't feel identical.
const BACKSTORY_POOL = {
  Carpenter: [
    "a Suffolk carpenter, second son of a tradesman who has never been this far from home.",
    "trained under a York guild master, still carries his late father's chisel.",
    "left an apprenticeship unfinished when the roads north grew too dangerous to travel."
  ],
  Veneur: [
    "grew up poaching the king's deer and never once got caught.",
    "spent more nights sleeping under trees than under a roof, and prefers it that way.",
    "learned to track from a father who was better with animals than with people."
  ],
  "Master Cook": [
    "ran a tavern kitchen for a decade before the harvest failures closed it.",
    "was taught to stretch a meal for twelve on rations meant for six.",
    "still has burn scars from a fire that took a family's bakery, not this one."
  ],
  "Man-at-Arms": [
    "survived a border skirmish that killed most of his unit.",
    "was a household guard for a lord who no longer has a household.",
    "has killed before and does not talk about it unless asked twice."
  ],
  Gatherer: [

  Hewer: [
