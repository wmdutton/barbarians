const EARTHWORK_SEVERITY_ODDS = {
  primary:   { partial: 0.12, lost: 0.03 },  // Fossier Seasoned
  secondary: { partial: 0.22, lost: 0.07 },  // Fossier Practiced
  base:      { partial: 0.30, lost: 0.12 },  // no Fossier
  poor:      { partial: 0.45, lost: 0.22 }   // actively bad at groundwork — real drag
};

const EARTHWORK_MINOR_FLAVOR = [
  "fought rocky soil most of the day but still got the work moved forward",
  "kept the pace steady despite the mud, and the line advanced",
  "put in a long, unremarkable day at the ditch — solid progress for it"
];
const EARTHWORK_PARTIAL_FLAVOR = [
  "the ground turned stubborn halfway through — {name}'s work slowed to a crawl, but some progress held",
  "a root tangle ate half the day before {name} could work around it",
  "{name} lost the morning to standing water in the cut, and only the afternoon's work counted for much"
];
const EARTHWORK_LOST_FLAVOR = [
  "the wall gave out before it could be shored — a full day's work, undone",
  "they struck rock a foot down and had to abandon the day's cut entirely",
  "a sudden downpour turned the day's clearing back to mud and root-tangle overnight"
];

function resolveEarthworkDay(character, tier, stage) {
  const odds = EARTHWORK_SEVERITY_ODDS[tier];
  const roll = Math.random();
  const verb = stage.name === "Bailey Grounds" ? "clearing" : "ditch";

  if (roll < odds.lost) {
    const line = EARTHWORK_LOST_FLAVOR[Math.floor(Math.random() * EARTHWORK_LOST_FLAVOR.length)];
    return { manDays: 0, line: `${character.name} — ${line}.` };
  }
  if (roll < odds.lost + odds.partial) {
    const template = EARTHWORK_PARTIAL_FLAVOR[Math.floor(Math.random() * EARTHWORK_PARTIAL_FLAVOR.length)];
    return { manDays: 0.5, line: template.replace(/{name}/g, character.name).replace(/^./, c => c.toUpperCase()) + "." };
  }
  const line = EARTHWORK_MINOR_FLAVOR[Math.floor(Math.random() * EARTHWORK_MINOR_FLAVOR.length)];
  return { manDays: 1, line: `${character.name} ${line} at the ${verb}.` };
}

// for success/failure on its own. Timber stages (Carpenter, high-
// skill weight) keep the existing man-days-per-tier shape: 1 / 0.75 /
// 0.5 man-days per day, tuned so a single Seasoned worker takes
// roughly the stage's full listed cost in days, not a fraction of it.
//
// Earthwork stages (Fossier, no-skill weight) use a DIFFERENT shape —
// see resolveEarthworkDay below — because "no-skill" per the locked
// weight model means competent-by-default, not a yield gap. Fossier's
// bonus is delay-avoidance, not extra man-days per day.
function resolveBuildPalisade(character) {
  const tier = getSkillTier(character, "Build Palisade");
  const fort = gameState.fortification;
  const stage = FORTIFICATION_STAGES[fort.stageIndex];

  // Track is already fully complete — nothing left to build.
  if (!stage) {
    return `${character.name} looked over the finished works but found nothing left to add.`;
  }

  // Wood cost is per-stage (see FORTIFICATION_STAGES) — earthwork
  // stages (Bailey Grounds, Motte Ditch) cost none, so this check is
  // a no-op there and never blocks digging for lack of timber.
  const woodCost = stage.woodCost;
  if (gameState.resources.wood < woodCost) {
    return `${character.name} had no wood left to work with and made no progress on the ${stage.name.toLowerCase()}.`;
  }

  gameState.resources.wood -= woodCost;

  const isEarthworkStage = stage.skill === "Fossier";
  let manDaysContributed;
  let earlyReturnLine = null;

  if (isEarthworkStage) {
    const result = resolveEarthworkDay(character, tier, stage);
    manDaysContributed = result.manDays;
    earlyReturnLine = result.line;
  } else {
    // Quick placeholder failure roll for timber stages — see
    // FORTIFICATION_FAILURE_CHANCE. On a failure, wood is still spent
    // (the attempt was made) but no man-days are contributed this
    // trip. Not stage-progress-destructive — just a lost day. To be
    // refined in a design chat (per-stage odds, whether failure
    // should ever claw back existing progress).
    if (Math.random() < FORTIFICATION_FAILURE_CHANCE) {
      const lines = stage.failureFlavor;
      return `${character.name} — ${lines[Math.floor(Math.random() * lines.length)]}.`;
    }
    const manDaysByTier = { primary: 1, secondary: 0.75, base: 0.5, poor: 0.25 };
    manDaysContributed = manDaysByTier[tier];
  }

  // Earthwork's Lost-day outcome contributes 0 man-days and needs its
  // own flavor line returned directly — it isn't a stage completion
  // and shouldn't fall through to the standard "work continues" text.
  // Minor/Partial (manDays > 0) still need to check for stage
  // completion below, same as any other day of progress.
  if (isEarthworkStage && manDaysContributed === 0) {
    return earlyReturnLine;
  }

  fort.daysRemaining -= manDaysContributed;

  // Stage complete — advance to the next one and carry over any
  // leftover man-days contributed this trip (e.g. a Seasoned worker
  // who finishes a stage with effort to spare starts the next stage
  // ahead, rather than that labor being wasted).
  let stageJustCompleted = null;
  if (fort.daysRemaining <= 0) {
    stageJustCompleted = stage;
    const overflow = -fort.daysRemaining; // how much past zero we went
    fort.stageIndex += 1;
    const nextStage = FORTIFICATION_STAGES[fort.stageIndex];
    fort.daysRemaining = nextStage ? nextStage.cost - overflow : 0;
    if (nextStage && fort.daysRemaining < 0) fort.daysRemaining = 0;
    fort.hasAnnouncedStart = false; // new stage — "just begun" can fire once more

    // If the new stage costs wood (i.e. we just crossed from earthwork into
    // a timber stage), charge it now. The wood check at the top of this
    // function only saw the old stage's woodCost (0), so this transition
    // day would otherwise be a free first day on the palisade.
    if (nextStage && nextStage.woodCost > 0) {
      if (gameState.resources.wood < nextStage.woodCost) {
        // No timber to start the new stage — freeze progress at stage entry.
        fort.daysRemaining = nextStage.cost;
        return `${character.name} finished the groundwork: ${stageJustCompleted.doneLabel}. There was no timber ready to begin the ${nextStage.name.toLowerCase()}.`;
      }
      gameState.resources.wood -= nextStage.woodCost;
    }
  }

  if (stageJustCompleted) {
    const nextStage = FORTIFICATION_STAGES[fort.stageIndex];
    const nextLine = nextStage
      ? ` Work can now begin on the ${nextStage.name.toLowerCase()}.`
      : ` There is nothing left to build — the works are complete.`;
    return `${character.name} finished the work: ${stageJustCompleted.doneLabel}.${nextLine}`;
  }

  if (isEarthworkStage) return earlyReturnLine;

  return buildPalisadeFlavor(character, tier, stage, fort);
}

// Flavor text for a day of Build Palisade work that didn't complete a
// stage. Communicates remaining effort through character voice, never
// a number or percentage — per the locked "no progress bars, ever"
// principle. Buckets remaining man-days into rough qualitative bands
// per stage so text stays true regardless of how big the stage's total
// cost is.
//
// Updated 2026-07-21: takes the fort state object (not just
// daysRemaining) so it can read/set hasAnnouncedStart. "Work has only
// just begun" now fires once per stage — the first day worked while
// still above the 66% threshold — then falls through to the standard
// "coming along" phrasing for the rest of that band, instead of
// repeating every day the stage sits above 66% remaining.
function buildPalisadeFlavor(character, tier, stage, fort) {
  const daysRemaining = fort.daysRemaining;
  const fractionLeft = daysRemaining / stage.cost;

  let stageDescriptor;
  if (fractionLeft > 0.66) {
    if (!fort.hasAnnouncedStart) {
      stageDescriptor = `the ${stage.name.toLowerCase()} work has only just begun`;
      fort.hasAnnouncedStart = true;
    } else {
      stageDescriptor = `the ${stage.name.toLowerCase()} work continues`;
    }
  } else if (fractionLeft > 0.33) {
    stageDescriptor = `the ${stage.name.toLowerCase()} work is coming along, but there's a fair way to go`;
  } else {
    stageDescriptor = `the ${stage.name.toLowerCase()} work is nearly finished`;
  }

  // Only called for timber stages now — earthwork stages resolve
  // entirely through resolveEarthworkDay and return before reaching
  // here (see resolveBuildPalisade). No branch needed for earthwork.
  if (tier === "primary") {
    return `${character.name} squared the timbers and set them true, working steadily — ${stageDescriptor}.`;
  }
  if (tier === "secondary") {
    return `${character.name} made decent progress, though the line isn't as clean as a trained hand would leave it — ${stageDescriptor}.`;
  }
  return `${character.name} wrestled the logs into place, gaps and all, slow and uneven — ${stageDescriptor}.`;
}

// Updated 2026-07-21: game description now scales WITH the actual
// yield instead of being picked independently — previously `catch_`
// was rolled from the full list regardless of `rawYield`, so a
// "young boar" (should be a big haul) could show up next to "2
// portions" while "a brace of pheasant" (should be small) could show
// up next to "6 portions" — animal size and stated yield contradicted
// each other. GAME_BY_YIELD below buckets the catch description to
// match the actual number rolled.
//
// Also drops the redundant portion-count restatement — Hunt no
// longer says "N portions" in its own line, since Master Cook's output
// the same day already states the ration count derived from that raw
// food (see resolveCook). Saying the number twice in one day's log,
// once as "portions" and again as "rations," read as the game
// repeating itself rather than describing two different things.
// Hunt now just describes the catch; Master Cook is where the number lives.
const GAME_BY_YIELD = [
  { max: 1, options: ["a hare", "a handful of squirrels"] },
  { max: 3, options: ["a brace of pheasant", "a couple of rabbits"] },
  { max: 5, options: ["a young boar", "a good-sized doe"] },
  { max: Infinity, options: ["a full-grown stag", "a big boar, well fed"] }
];

function describeCatch(rawYield) {
  const bucket = GAME_BY_YIELD.find(b => rawYield <= b.max);
  const options = bucket.options;
  return options[Math.floor(Math.random() * options.length)];
}

// Hunt: High-skill weight (Veneur). Untrained hunting is genuinely
// unreliable — base tier whiffs often, reflecting real difficulty
// rather than a modest penalty. See design-rationale.md.
function resolveHunt(character) {
  const tier = getSkillTier(character, "Stalk beasts");
  const ranges = {
    primary:   [3, 7],
    secondary: [1, 4],
    base:      [0, 2],
    poor:      [0, 1]   // more likely to spook game than catch it
  };
  const [min, max] = rangeForTier(tier, ranges);

  const rawYield = rollYield(min, max);
  gameState.resources.rawFood += rawYield;

  if (rawYield === 0) {
    return `${character.name} tracked game for hours without a clean shot — nothing came of it.`;
  }

  // qualityTier is computed after the zero-check above, since
  // yieldQualityTier's "nothing" case is already handled by the
  // early return — flavor below only ever needs poor/average/great.
  const qualityTier = yieldQualityTier(rawYield, min, max);
  const catch_ = describeCatch(rawYield);

  const flavor = {
    poor: `${character.name} took ${catch_}, little else worth the effort.`,
    average: `${character.name} brought down ${catch_}.`,
    great: `${character.name} took ${catch_} — a strong day's hunting.`
  };
  return flavor[qualityTier] || `${character.name} brought down ${catch_}.`;
}

// Cook task: Low-skill, conversion-based weight (Master Cook). Per
// the locked Cook Conversion Table, the rate is a ROLLED RANGE per
// tier, not a fixed multiplier — a flat number is something a player
// would optimize around, which breaks "skill shifts odds, never
// guarantees outcomes." A Master Cook is usually good and can have a
// genuinely great day; a Base-tier cook is usually mediocre and can
// have a genuinely wasteful one. Converts raw food into rations and
// forage food into rations at 2:1; does both in the same day if
// available. See design-rationale.md.
const COOK_CONVERSION_RANGE = {
  primary:   [1.3, 1.8],  // Master Cook — usually good, occasionally excellent
  secondary: [0.9, 1.1],  // reliable, roughly break-even
  base:      [0.4, 0.6],  // inconsistent, meaningfully wasteful
  poor:      [0.1, 0.3]   // badly inept — food is largely ruined
};

function rollConversionRate(tier) {
  const [min, max] = COOK_CONVERSION_RANGE[tier];
  return min + Math.random() * (max - min);
}

function resolveCook(character) {
  const tier = getSkillTier(character, "Cook provisions");
  const conversionRate = rollConversionRate(tier);

  const rawFoodAvailable = gameState.resources.rawFood;
  const forageFoodAvailable = gameState.resources.forageFood;

  if (rawFoodAvailable === 0 && forageFoodAvailable === 0) {
    return `${character.name} had nothing to cook and stood idle at the fire.`;
  }

  let rationsProduced = 0;
  const notes = [];

  if (rawFoodAvailable > 0) {
    const fromRaw = Math.floor(rawFoodAvailable * conversionRate);
    rationsProduced += fromRaw;
    gameState.resources.rawFood = 0;
    notes.push(`${fromRaw} from the day's meat`);
  }

  if (forageFoodAvailable > 0) {
    const fromForage = Math.floor(forageFoodAvailable / 2);
    rationsProduced += fromForage;
    gameState.resources.forageFood -= fromForage * 2; // leftover odd unit stays, still edible raw
    gameState.resources.forageFoodAge = 0; // whatever's left just got handled/reset
    if (fromForage > 0) notes.push(`${fromForage} preserved from foraged stores`);
  }

  gameState.resources.rations += rationsProduced;

  const detail = notes.join(" and ");
  if (tier === "primary") {
    return `${character.name} worked the fire all day — ${rationsProduced} rations set aside (${detail}).`;
  }
  if (tier === "secondary") {
    return `${character.name} kept the fire going and did a fair job of it — ${rationsProduced} rations set aside (${detail}).`;
  }
  if (tier === "poor") {
    return `${character.name} made a poor hand of the cooking — most of it burned or went wrong, only ${rationsProduced} rations salvaged (${detail}).`;
  }
  return `${character.name} tended the fire, though some of it scorched or went to waste — ${rationsProduced} rations set aside (${detail}).`;
}

// Perimeter Watch: no resource output — tracks position for
// the scout wave mechanic (see resolveScoutWave) and now also
// grants a real skill tier (Man-at-Arms is primary here — see
// SECONDARY_PRIMARY_TASK_SKILLS). Tier doesn't change day-to-day
// text much since nothing happens without a raid, but a Man-at-Arms
// watcher reads as more competent even on a quiet day.
function resolvePerimeterWatch(character) {
  character.position = "perimeter";
  const tier = getSkillTier(character, "Keep ward");
  if (tier === "primary") {
    return `${character.name} kept a soldier's watch at the perimeter, eyes on the treeline. No trouble today.`;
  }
  if (tier === "poor") {
    return `${character.name} stood watch but spent half of it half-asleep at his post. No trouble today — fortunately.`;
  }
  return `${character.name} stood watch at the perimeter. No trouble today.`;
}

// Forage: High-skill weight (Gatherer). Also has a chance of turning
// up more nearby trees, independent of tier — even an untrained
// forager can stumble onto a stand of trees; that's luck, not skill.
// Base tier's yield is deliberately weak and whiff-prone without a
// Gatherer present — per the locked weight model, Forage should not
// be reliable without one. See design-rationale.md.
function resolveForage(character) {
  const tier = getSkillTier(character, "Gather mast");
  const roll = Math.random();
  const treeFindChance = 0.25;

  if (roll < treeFindChance) {
    const foundTrees = 3 + Math.floor(Math.random() * 4); // 3-6 more trees
    gameState.environment.treesRemainingNearby += foundTrees;
    return `${character.name} ranged out foraging and stumbled onto a stand of ${foundTrees} more trees worth working.`;
  }

  const ranges = {
    primary:   [3, 6],
    secondary: [1, 3],
    base:      [0, 1],
    poor:      [0, 0]   // almost certainly comes back empty
  };
  const [min, max] = rangeForTier(tier, ranges);
  const foundFood = rollYield(min, max);
  const qualityTier = yieldQualityTier(foundFood, min, max);

  if (foundFood > 0) {
    gameState.resources.forageFood += foundFood;
    gameState.resources.forageFoodAge = 0; // fresh food resets the spoilage clock
  }

  const forageItems = ["wild garlic and roots", "berries and mushrooms", "nuts and dandelion greens", "elderberries and watercress"];
  const item = forageItems[Math.floor(Math.random() * forageItems.length)];

  // Simples — medicinal herbs found alongside forage. 20% chance per trip,
  // yield 1–2. Independent of food yield — a poor foraging day can still
  // turn up useful simples. Gatherer tier slightly improves the chance.
  const simplesChance = (tier === "primary") ? 0.30 : (tier === "secondary") ? 0.22 : 0.15;
  let simplesNote = "";
  if (Math.random() < simplesChance) {
    const found = rollRange(1, 2);
    gameState.resources.simples += found;
    simplesNote = ` Also cut ${found === 1 ? "a bundle" : "some bundles"} of simples from the undergrowth.`;
  }

  const flavor = {
    nothing: `${character.name} searched the undergrowth all day and came back empty-handed.${simplesNote}`,
    poor: `${character.name} found a handful of ${item} — ${foundFood} portions.${simplesNote}`,
    average: `${character.name} brought back ${item}, ${foundFood} portions in all.${simplesNote}`,
    great: `${character.name} found ${item} in real abundance — ${foundFood} portions.${simplesNote}`
  };
  return flavor[qualityTier];
}

// ---------------------------------------------
// SCOUT / SPY OUT RESOLUTION (H2 — Threat-aware)
// Two independent rolls per scout: Detection and Intelligence.
// Detection: did the Welsh see them? Governed by Spy out tier.
//   Outrider: never detected.
//   Detected scouts spike Threat AND force next raid to Ambush —
//   but only if the scout also saw the Welsh (he only knows he was
//   seen if he saw them too).
// Intelligence: what did the scout observe? d20 field-reality roll
//   modified by tier. Band: Nothing / Cold / Warm / Direct.
// Runs once per day for all scouts together.
// ---------------------------------------------

// Intelligence band labels — used in journal voice lines.
const INTEL_BANDS = ["nothing", "cold", "warm", "direct"];

// Roll the raw field-reality d20 and return a band index (0–3).
function rollFieldReality() {
  const d20 = rollRange(1, 20);
  if (d20 <= 8)  return 0; // Nothing
  if (d20 <= 14) return 1; // Cold trail
  if (d20 <= 18) return 2; // Warm trail
  return 3;                 // Direct observation
}

// Apply skill multiplier — shifts band up or down.
// Never turns Nothing into something; never exceeds Direct.
function applyIntelMultiplier(rawBand, tier) {
  if (rawBand === 0) return 0; // Nothing stays Nothing regardless
  if (tier === "Seasoned")  return Math.min(3, rawBand + 1); // Outrider: reads one band higher
  if (tier === "Practiced") return rawBand;                  // accurate most of the time
  if (tier === "Base")      return rawBand;                  // exact read
  return Math.max(1, rawBand - 1);                           // Poor: reads one band lower (min Cold)
}

// Detection roll: did the Welsh notice this scout?
// Returns { detected, threatAdd }.
// Outrider: never detected. Others governed by Spy out tier.
function rollDetection(tier) {
  if (tier === "Seasoned") return { detected: false, threatAdd: 0 }; // Outrider — never seen
  if (tier === "Practiced") {
    const add = rollRange(0, 1);
    return { detected: add > 0, threatAdd: add };
  }
  if (tier === "Base") {
    const add = rollRange(3, 5);
    return { detected: true, threatAdd: add };
  }
  // Poor
  const add = rollRange(5, 8);
  return { detected: true, threatAdd: add };
}

// Journal voice per intelligence band.
function intelJournalLine(character, band) {
  const n = character.name;
  if (band === 0) return `${n} came back before dark. Nothing out there he could say for certain.`;
  if (band === 1) return `${n} found an old fire, days dead. Someone has been through this ground.`;
  if (band === 2) return `${n} found a fresh camp, half a day's march off. They are not far.`;
  // Direct — Outrider adds timing estimate
  if (character.skill === "Outrider") {
    // Outrider produces a day-range estimate from Threat gap
    const gap = THREAT_RAID_THRESHOLD - gameState.threat;
    const maxDaily = 3 + 3 + 3 + 2; // worst-case single day (passive max + Hunt max + Forage max + timber)
    const minDaily = 2;              // passive only, quiet day
    const floorDays = Math.max(1, Math.floor(gap / maxDaily));
    const ceilDays  = Math.max(floorDays, Math.ceil(gap / minDaily));
    const timing = floorDays === ceilDays
      ? `${floorDays} day${floorDays === 1 ? "" : "s"} at the least`
      : `${floorDays} to ${ceilDays} days`;
    return `${n} saw them — moving light, no baggage. ${timing} out, less if the men keep making noise.`;
  }
  return `${n} saw them. Moving light, no baggage.`;
}

// Resolves Spy out for all scouts assigned this day.
// Accumulates detection Threat spikes and sets scoutDetected flag
// if applicable. Updates gameState.scoutWarning with best intel found.
function resolveScoutForEnemiesForDay(scoutingCharacters) {
  if (scoutingCharacters.length === 0) return [];

  const entries = [];
  let bestBand = -1; // track the best intel result across all scouts this day

  scoutingCharacters.forEach(character => {
    const spyTier = getSkillTier(character, "Spy out");

    // Detection roll
    const detection = rollDetection(spyTier);
    if (detection.detected) {
      gameState.threat += detection.threatAdd;
    }

    // Intelligence roll
    const rawBand = rollFieldReality();
    const perceivedBand = applyIntelMultiplier(rawBand, spyTier);

    // Scout only reports being seen if he also saw the Welsh (warm+).
    // A Poor scout who got burned but came back with Nothing doesn't
    // know he was compromised — the Ambush arrives without warning.
    if (detection.detected && perceivedBand >= 2) {
      gameState.scoutDetected = true;
      entries.push(`${character.name} came back unsettled — he saw them, and he is not certain they did not see him.`);
    }

    // Journal line for what the scout observed
    entries.push(intelJournalLine(character, perceivedBand));

    if (perceivedBand > bestBand) bestBand = perceivedBand;
  });

  // Store scout warning for status bar display (warm+ intel only)
  if (bestBand >= 2) {
    gameState.scoutWarning = { band: bestBand };
  }

  return entries;
}

// Tend wounds — consequential action. The only current action where failure
// has a consequence beyond "less output": Poor tier carries a worsening risk,
// potentially escalating a Hurt character to Sorely Hurt. This is a deliberate
// player decision: accept the risk of an unskilled attempt, or leave the
// injured man untended another day. Gatherer = primary tier (best outcomes).
// Any character can attempt — consistent with "badly but not blocked."
//
// Targeting: tends the most severely injured character first (Sorely Hurt
// before Hurt). Only one target per tender per day.
function resolveTendWounds(character) {
  // Find the most in-need living character (not this character)
  const target = gameState.characters
    .filter(c => c.alive && c.id !== character.id && c.injuryState !== null)
    .sort((a, b) => {
      // Sort: sorelyHurt first, then hurt
      const severity = { sorelyHurt: 0, hurt: 1 };
      return severity[a.injuryState] - severity[b.injuryState];
    })[0];

  if (!target) {
    return `${character.name} set aside the day for tending but found no one in need of it.`;
  }

  const tier = getSkillTier(character, "Tend wounds");

  // Poor tier: chance of worsening rather than helping.
  // Roll for adverse outcome first — it overrides everything else.
  if (tier === "poor") {
    if (Math.random() < 0.28) {
      if (target.injuryState === "hurt") {
        target.injuryState = "sorelyHurt";
        target.daysSinceTending = 0; // tending attempt resets the death clock even on a bad outcome
        target.tendingDaysAccumulated = 0;
        return `${character.name} did what he could for ${target.name}, but made a poor hand of it — more harm than help, and the wound is worse for it.`;
      }
      // Already Sorely Hurt and poor attempt — no escalation (can't get worse), just no progress
      return `${character.name} set about tending ${target.name}'s wound but the attempt went badly — the work was undone before it began.`;
    }
  }

  // Successful tending — accumulate days toward recovery step-down
  target.daysSinceTending = 0; // reset death clock on any tending attempt
  target.tendingDaysAccumulated += 1;

  const progressNeeded = 2; // 2 days of tending to step down one tier

  if (target.tendingDaysAccumulated >= progressNeeded) {
    target.tendingDaysAccumulated = 0;
    const wasState = target.injuryState;
    target.injuryState = wasState === "sorelyHurt" ? "hurt" : null;

    if (wasState === "sorelyHurt") {
      if (tier === "primary") {
        return `${character.name} worked over ${target.name}'s wound with steady hands — by nightfall the worst of it had eased. He is still hurt, but he is on his feet.`;
      }
      return `${character.name} did what he could for ${target.name}. The wound is bad, but he'll walk again now.`;
    }
    // hurt → well
    if (tier === "primary") {
      return `${character.name} cleaned and bound ${target.name}'s wound properly — it has closed clean. He should be fit for work tomorrow.`;
    }
    return `${character.name} bound up ${target.name}'s wound and it seems to have held. He looks better for it.`;
  }

  // Progress made, not yet enough to step down
  if (tier === "primary") {
    return `${character.name} dressed ${target.name}'s wound with care — the swelling has come down some, but he will need another day of it.`;
  }
  if (tier === "secondary") {
    return `${character.name} saw to ${target.name}'s wound as best he could. Another day of the same should see him through.`;
  }
  return `${character.name} did what he could for ${target.name}'s wound. It will need more attention before it mends.`;
}

// Routes a character to the correct resolver based on their task.
// Note: "Spy out" is deliberately NOT routed through here —
// it's resolved once per day for all scouts at once, from runDay(),
// since the Veneur+Man-at-Arms combo needs to see the full day's assignments.
function resolveCharacterAction(character) {
  switch (character.currentAction) {
    case "Build Palisade":  return resolveBuildPalisade(character);
    case "Stalk beasts":    return resolveHunt(character);
    case "Cook provisions": return resolveCook(character);
    case "Keep ward":       return resolvePerimeterWatch(character);
    case "Fell timber":     return resolveWoodcutting(character);
    case "Gather mast":     return resolveForage(character);
    case "Tend wounds":     return resolveTendWounds(character);
    case "Spy out":         return null; // handled separately, see resolveScoutForEnemiesForDay
    default: return `${character.name} had no task and did nothing today.`;
  }
}

// Forage food spoils if it sits unused for 2 days. Age resets to 0
// whenever fresh forage food is gathered or cooked into rations
// (see resolveForage and resolveCook). Runs once per day, before
// consumption, so spoiled food is never "eaten" first.
function applyForageSpoilage() {
  if (gameState.resources.forageFood === 0) return null;

  gameState.resources.forageFoodAge += 1;

  if (gameState.resources.forageFoodAge >= 2) {
    const lost = gameState.resources.forageFood;
    gameState.resources.forageFood = 0;
    gameState.resources.forageFoodAge = 0;
    return `The foraged food store went bad before it could be used — ${lost} portions lost to spoilage.`;
  }

  return null;
}

// Feeds settlers in order of longest-without-food first. Draws from
// forageFood before rations. Unfed settlers advance one hunger stage.
function applyDailyConsumption() {
  const eatingOrder = gameState.characters
    .filter(c => c.alive)
    .sort((a, b) => b.daysWithoutFood - a.daysWithoutFood);

  let fed = 0;
  let wentHungry = 0;

  eatingOrder.forEach(character => {
    if (gameState.resources.forageFood > 0) {
      gameState.resources.forageFood -= 1;
      character.daysWithoutFood = 0;
      fed += 1;
    } else if (gameState.resources.rations > 0) {
      gameState.resources.rations -= 1;
      character.daysWithoutFood = 0;
      fed += 1;
    } else {
      character.daysWithoutFood += 1;
      wentHungry += 1;
    }
  });

  if (wentHungry === 0) {
    return `Everyone ate today.`;
  }
  return `Food ran short — ${wentHungry} of the vanguard went without food today.`;
}

// 3 consecutive days without food is fatal. 1-2 days show as
// "hungry"/"starving" tags on the character card (see hungerStage).
function checkStarvation() {
  const notes = [];

  gameState.characters
    .filter(c => c.alive && c.daysWithoutFood >= 3)
    .forEach(character => {
      character.alive = false;
      notes.push(`${character.name} did not wake this morning. Three days without food was more than he could bear.`);
    });

  return notes;
}

// Returns a hunger stage label for display, or null if the
// character is fine and nothing needs to be shown.
function hungerStage(character) {
  if (character.daysWithoutFood >= 2) return "starving";
  if (character.daysWithoutFood >= 1) return "hungry";
  return null;
}

// ---------------------------------------------
// SCOUT WAVE
// A scheduled combat event (see nextWaveDay). Resolution depends
// on watch status and palisade progress. Kept separate from the
// daily task resolvers — an event, not a task outcome.
// ---------------------------------------------

// Returns true if ANY living character was assigned Perimeter Watch
// today, regardless of skill. Despite the old name, this was never
// Man-at-Arms-specific — kept as watchPresent() for clarity now that
// Man-at-Arms gets a real bonus ON TOP of this (see soldierOnWatch()
// below). Watch-by-anyone still grants the baseline protections
// (outdoor-worker warning, small fight-back bonus); Man-at-Arms-on-Watch
// grants the bigger fight-back number specifically.
function watchPresent() {
  return gameState.characters.some(
    c => c.alive && c.currentAction === "Keep ward"
  );
}

// Returns true only if the watcher is Man-at-Arms-primary-tier —
// distinct from watchPresent() above.
function soldierOnWatch() {
  return gameState.characters.some(
    c => c.alive && c.currentAction === "Keep ward"
      && getSkillTier(c, "Keep ward") === "primary"
  );
}

// Rolls how many outriders show up (3 to 5).
function rollOutriderCount() {
  return 3 + Math.floor(Math.random() * 3); // 3 to 5
}

// Returns how many outriders the vanguard drove off.
// Each living armed character can engage one outrider.
// Man-at-Arms on Watch adds +3; anyone else on Watch adds +1.
// Ambush penalty (−3) is applied by the caller, not here.
function resolveFightBack(outriderCount, anyWatcher, soldierWatching) {
  const armedCount = gameState.characters.filter(c => c.alive && c.weapon).length;
  if (armedCount === 0) return 0;

  const watchBonus = soldierWatching ? 3 : (anyWatcher ? 1 : 0);
  const driven = Math.min(outriderCount, armedCount + watchBonus);
  return driven;
}

// Base hit chance for a character, before palisade mitigation
// (see palisadeMitigation). Highest for the watcher; scales down
// as more outriders are driven off.
//
// Updated 2026-07-21: now takes soldierWatching, so a Man-at-Arms's
// mechanical edge shows up in personal risk too, not just in
// resolveFightBack's group-level driven-off count. Two spots use it:
//   - The watcher's own risk: a Man-at-Arms standing watch is still the
//     one facing outriders directly (same exposure), but his training
//     means he's meaningfully less likely to actually be hit than an
//     untrained watcher standing the same post.
//   - A warned outdoor worker's risk: called back by a Man-at-Arms's
//     watch specifically is a sharper warning (he reads the land/
//     movement better — same skill that makes his Scout read tighter)
//     than being called back by a non-Man-at-Arms watcher.
function baseHitChance(character, watcherPresent, outridersRemaining, originalCount, soldierWatching) {
  const onWatch = character.currentAction === "Keep ward";
  const pressureRatio = outridersRemaining / originalCount; // fewer attackers left = less danger

  let chance;
  if (onWatch) {
    chance = soldierWatching ? 0.35 : 0.5; // trained watcher, same exposure, better odds
  } else if (watcherPresent) {
    chance = soldierWatching ? 0.03 : 0.05; // warned-by-soldier reads sharper than warned-by-anyone
  } else {
    chance = 0.25;
  }

  return chance * pressureRatio;
}

// How far along the Fortification track the camp is, as a 0-1 fraction
// of total man-days paid off out of the full 50. This is an internal
// number only — never shown to the player (see renderResources) — used
// purely to drive raid mitigation math, same role the old flat percent
// played. NOTE: combat/raid mitigation is otherwise out of scope for
// this session; this function is kept working as-is, just re-pointed
// at the new staged track instead of the old flat percent.
function fortificationProgressFraction() {
  const TOTAL_MAN_DAYS = FORTIFICATION_STAGES.reduce((sum, s) => sum + s.cost, 0); // 50
  const fort = gameState.fortification;

  let daysPaid = 0;
  for (let i = 0; i < fort.stageIndex; i++) {
    daysPaid += FORTIFICATION_STAGES[i].cost;
  }
  const currentStage = FORTIFICATION_STAGES[fort.stageIndex];
  if (currentStage) {
    daysPaid += currentStage.cost - fort.daysRemaining;
  } else {
    daysPaid = TOTAL_MAN_DAYS; // track fully complete
  }

  return Math.min(1, daysPaid / TOTAL_MAN_DAYS);
}

// Palisade progress reduces hit chance (up to 50% at full wall).
function palisadeMitigation(baseChance) {
  const reduction = fortificationProgressFraction() * 0.5; // up to 50% reduction at full wall
  return Math.max(0, baseChance - (baseChance * reduction));
}

// If the camp is vulnerable (no watcher, low palisade), outriders
// loot resources on the way out, in priority order (see lootOrder).
// ALWAYS returns a line now, every raid — theft (or its absence) was
// previously silent whenever the camp wasn't "vulnerable" or had
// nothing left to take, which made it impossible for the player to
// tell "nothing was stolen" from "I just didn't notice the line."
// Weapons can now ONLY be lost this way (see resolveFightBack) — this
// function carries real weight it didn't before.
function resolveResourceRisk(anyWatcher) {
  const campVulnerable = !anyWatcher && fortificationProgressFraction() < 0.30;

  if (!campVulnerable) {
    return "The camp's stores went untouched — nothing was taken in the raid.";
  }

  const lootBudget = 2 + Math.floor(Math.random() * 3); // 2-4 units taken total
  let remaining = lootBudget;
  const takenNotes = [];

  const lootOrder = [
    { key: "rations",    label: "rations" },
    { key: "forageFood", label: "portions of foraged food" },
    { key: "rawFood",    label: "portions of raw food" }
  ];

  lootOrder.forEach(resource => {
    if (remaining <= 0) return;
    const available = gameState.resources[resource.key];
    const taken = Math.min(available, remaining);
    if (taken > 0) {
      gameState.resources[resource.key] -= taken;
      remaining -= taken;
      takenNotes.push(`${taken} ${resource.label}`);
    }
  });

  if (takenNotes.length === 0) {
    return "Outriders rifled through the camp but found nothing left worth taking.";
  }
  return `In the chaos, outriders made off with ${takenNotes.join(", ")}.`;
}

// Tasks that take a character outside the camp's immediate footprint.
// A manned Watch (anyone, not just Man-at-Arms) warns these characters to
// fall back before a raid lands — they don't get the "caught in the
// open with nothing to defend himself" auto-kill, and roll at the
// unwatched-but-in-camp hit chance instead of full open-ground risk.
// Perimeter Watch itself is not in this list — the watcher is the one
// person who's already braced, not someone who needs warning.
const OUTDOOR_ACTIONS = ["Stalk beasts", "Gather mast", "Spy out", "Fell timber"];

// Resolves the scout wave: outriders arrive, the vanguard fights
// back if armed, casualties and resource losses are applied, and
// the whole encounter is logged like a report reaching the player.
// Warned vs. Ambush is determined by gameState.raidIsAmbush, set
// in runDay() before this is called.
function resolveScoutWave() {
  const entries = [];
  const isAmbush = gameState.raidIsAmbush;
  const anyWatcher = watchPresent();
  const soldierWatching = soldierOnWatch();
  const outriderCount = rollOutriderCount();

  // Opening line differs by raid type.
  if (isAmbush) {
    entries.push(`They were upon the camp before anyone raised the alarm — ${outriderCount} outriders, out of the dusk without warning.`);
  } else {
    entries.push(`${outriderCount} outriders were spotted moving through the treeline as the sun dropped.`);
    if (soldierWatching) {
      entries.push("The soldier on watch caught sight of them early and had the camp braced before they closed the distance.");
    } else {
      entries.push("The watch caught sight of them early, giving the camp a chance to brace.");
    }
  }

  // Ambush penalty: −3 applied to driven count (the vanguard can't
  // coordinate their response when caught unprepared). Floored at 0.
  const driven = Math.max(0, resolveFightBack(outriderCount, anyWatcher, soldierWatching) - (isAmbush ? 3 : 0));
  const outridersRemaining = Math.max(0, outriderCount - driven);
  const allDrivenOff = driven >= outriderCount;

  if (allDrivenOff) {
    entries.push(`The vanguard fought back and drove off all ${driven} of them — the raid was repelled outright.`);
  } else if (driven > 0) {
    entries.push(`The vanguard fought back and drove off ${driven} of them.`);
  }

  let warnedAnyone = false;

  gameState.characters
    .filter(c => c.alive)
    .forEach(character => {
      const isOutdoors = OUTDOOR_ACTIONS.includes(character.currentAction);
      // Warned: outside camp, but Watch called them back before the raid
      // landed. Only possible in a Warned raid — Ambush means no one had
      // time to raise the alarm, so outdoor workers are caught regardless
      // of whether Watch was manned.
      const warned = isOutdoors && anyWatcher && !isAmbush;
      // Caught fully in the open: outside AND either no watcher OR Ambush.
      const caughtInOpen = isOutdoors && !warned;

      if (warned) warnedAnyone = true;

      // Per-character weapon check — each man carries his own weapon.
      // weapon property set at generation ("sword+saex" or "spear+saex").
      // Unarmed only if weapon was somehow stripped (future mechanic).
      const unarmed = !character.weapon;

      if (caughtInOpen && unarmed) {
        character.alive = false;
        entries.push(`${character.name} was caught in the open with nothing to defend himself — he did not survive.`);
        return;
      }

      const totalChance = palisadeMitigation(
        baseHitChance(character, anyWatcher, outridersRemaining, outriderCount, soldierWatching)
      );
      const roll = Math.random();

      if (roll < totalChance) {
        // Split the hit zone into injury vs. death.
        // Man-at-Arms (mail hauberk) has a reduced death share — mail absorbs
        // more of the blow. Everyone else has equal injury/death split at this stage
        // (full raid screen severity ladder will replace this with the locked design).
        //
        // Probability bands within the hit zone (0 → totalChance):
        //   0.0 → 0.4 * total  = Hurt
        //   0.4 → 0.6 * total  = Sorely Hurt
        //   0.6 → 1.0 * total  = Death
        // Man-at-Arms shifts death band start from 0.6 → 0.75 (mail absorbs).
        const isSoldier = character.skill === "Man-at-Arms";
        const hurtCeiling      = totalChance * 0.40;
        const sorelyHurtCeiling = totalChance * (isSoldier ? 0.65 : 0.60);

        if (roll < hurtCeiling) {
          // Hurt — already hurt characters escalate to Sorely Hurt
          if (character.injuryState === "sorelyHurt") {
            // Can't get worse mid-raid than Sorely Hurt; no change
            entries.push(`${character.name} took another blow to the wound but somehow kept his feet.`);
          } else if (character.injuryState === "hurt") {
            character.injuryState = "sorelyHurt";
            character.daysSinceTending = 0;
            character.tendingDaysAccumulated = 0;
            entries.push(`${character.name} was already hurt and could not turn the blow in time — the wound is badly worsened.`);
          } else {
            character.injuryState = "hurt";
            entries.push(
              caughtInOpen
                ? `${character.name} was caught at the field's edge and took a wound — he made it back, but he is hurt.`
                : `${character.name} took a blow in the fighting — not fatal, but the wound will slow him.`
            );
          }
        } else if (roll < sorelyHurtCeiling) {
          // Sorely Hurt
          if (character.injuryState === "sorelyHurt") {
            entries.push(`${character.name} took another blow to the wound but somehow kept his feet.`);
          } else {
            character.injuryState = "sorelyHurt";
            character.daysSinceTending = 0;
            character.tendingDaysAccumulated = 0;
            entries.push(
              caughtInOpen
                ? `${character.name} was badly wounded in the open — he will not be fit for work until he is tended.`
                : `${character.name} went down hard in the fighting. He is sorely hurt and will need tending before he can work again.`
            );
          }
        } else {
          // Death
          character.alive = false;
          entries.push(
            caughtInOpen
              ? `${character.name} was caught in the open and did not survive the night.`
              : `${character.name} didn't make it back in time and was caught at the edge of camp.`
          );
        }
      }
    });

  if (warnedAnyone) {
    entries.push("The call to fall back reached the fields and treeline in time — those out working the land made it back inside the camp before the worst of it.");
  }

  // Loot outcome always reports, positive or negative, and always
  // sits right here — same slot every wave — so the player can find
  // it without hunting through casualty text. See resolveResourceRisk.
  entries.push(resolveResourceRisk(anyWatcher));

  const survivors = gameState.characters.filter(c => c.alive).length;
  entries.push(`When morning came, ${survivors} of the vanguard remained.`);

  return entries;
}
// ---------------------------------------------
// INJURY PROCESSING
// Runs once per day before action resolution.
// Order: simples auto-apply → Hurt+Starving cross-check → Sorely Hurt death clock.
// ---------------------------------------------

// Auto-applies simples to injured characters (Hurt first, then Sorely Hurt).
// Simples are the only healing resource that requires no action cost.
// Hurt + 1 simple → Well. Sorely Hurt uses simples as a substitute for
// Tend wounds action (2 simples = same as 1 day of tending, toward the
// same 2-day recovery). Returns journal lines describing any use.
function applySimples() {
  const lines = [];
  const hurt = gameState.characters.filter(c => c.alive && c.injuryState === "hurt");
  const sorelyHurt = gameState.characters.filter(c => c.alive && c.injuryState === "sorelyHurt");

  // Priority: Hurt first (cheapest to fix, immediate result)
  hurt.forEach(character => {
    if (gameState.resources.simples <= 0) return;
    gameState.resources.simples -= 1;
    character.injuryState = null;
    lines.push(`The simples worked — ${character.name}'s wound has closed overnight. He is fit again.`);
  });

  // Then Sorely Hurt: each application counts as one tending day
  sorelyHurt.forEach(character => {
    if (gameState.resources.simples <= 0) return;
    gameState.resources.simples -= 1;
    character.daysSinceTending = 0; // resets death clock
    character.tendingDaysAccumulated += 1;
    if (character.tendingDaysAccumulated >= 2) {
      character.tendingDaysAccumulated = 0;
      character.injuryState = "hurt";
      lines.push(`The poultice of simples drew the poison from ${character.name}'s wound. He is still hurt, but the worst has passed.`);
    } else {
      lines.push(`${character.name}'s wound was dressed with simples. It will need another application before he can work.`);
    }
  });

  return lines;
}

// Checks Hurt characters who are also Starving — cross-condition escalation.
// Runs after consumption so daysWithoutFood is current for this day.
function checkInjuryHungerCross() {
  const lines = [];
  gameState.characters
    .filter(c => c.alive && c.injuryState === "hurt" && c.daysWithoutFood >= 1)
    .forEach(character => {
      character.injuryState = "sorelyHurt";
      character.daysSinceTending = 0;
      character.tendingDaysAccumulated = 0;
      lines.push(`${character.name} went without food while already hurt — the wound has worsened. He is sorely hurt now and cannot work.`);
    });
  return lines;
}

// Sorely Hurt death clock: 3 days without any tending → death.
// daysSinceTending increments each day a Sorely Hurt character receives
// neither Tend wounds nor simples. Reset to 0 by either.
// Also kills Sorely Hurt + Starving immediately.
function checkSorelyHurtDeath() {
  const lines = [];
  gameState.characters
    .filter(c => c.alive && c.injuryState === "sorelyHurt")
    .forEach(character => {
      // Sorely Hurt + Starving → death immediately
      if (character.daysWithoutFood >= 1) {
        character.alive = false;
        lines.push(`${character.name} was sorely hurt and had no food — his body could not hold on. He did not wake this morning.`);
        return;
      }
      character.daysSinceTending += 1;
      if (character.daysSinceTending >= 3) {
        character.alive = false;
        lines.push(`${character.name}'s wound went untended too long. Three days without care — he did not survive it.`);
      }
    });
  return lines;
}

// Hurt characters who were not assigned an action today rest and recover.
// This runs at END of day, after action resolution, so we know who worked.
// "No work + no simples consumed" = rest recovery (injuryState set to null).
// Simples bypass is already handled in applySimples at day start —
// a character healed by simples won't be Hurt by the time we reach here.
function checkHurtRestRecovery() {
  const lines = [];
  gameState.characters
    .filter(c => c.alive && c.injuryState === "hurt" && !c.currentAction)
    .forEach(character => {
      character.injuryState = null;
      lines.push(`${character.name} rested the day and the wound has closed. He should be fit for work tomorrow.`);
    });
  return lines;
}

// Hurt characters who DID work today: 30% chance of escalation to Sorely Hurt.
// Journal voice is woven into the action resolver's output (the character notes
// the wound mid-task). This function handles the mechanical escalation only
// and produces a follow-up line if it fires.
function checkHurtWorkEscalation() {
  const lines = [];
  gameState.characters
    .filter(c => c.alive && c.injuryState === "hurt" && c.currentAction && c.currentAction !== "Tend wounds")
    .forEach(character => {
      if (Math.random() < 0.30) {
        character.injuryState = "sorelyHurt";
        character.daysSinceTending = 0;
        character.tendingDaysAccumulated = 0;
        lines.push(`${character.name} pushed through the work despite the wound, but the exertion has worsened it — he is sorely hurt now and cannot work tomorrow without tending.`);
      }
    });
  return lines;
}

// Runs one full day: tasks resolve (Scout handled separately as a
// group), then consumption/starvation, then a wave if scheduled,
// then win/loss conditions.
function runDay() {
  const entries = [];

  // Reset per-day flags before any resolution runs.
  gameState.scoutDetected = false;

  // Apply simples at day start — before actions, so healed characters
  // can be assigned freely this day. Death clock for Sorely Hurt increments
  // later (after consumption confirms whether starvation cross fires).
  entries.push(...applySimples());

  const scoutingCharacters = gameState.characters.filter(
    c => c.alive && c.currentAction === "Spy out"
  );

  gameState.characters
    .filter(c => c.alive && c.currentAction !== "Spy out")
    .forEach(character => {
      const line = resolveCharacterAction(character);
      if (line) entries.push(line);
    });

  entries.push(...resolveScoutForEnemiesForDay(scoutingCharacters));

  const spoilageNote = applyForageSpoilage();
  if (spoilageNote) entries.push(spoilageNote);

  entries.push(applyDailyConsumption());

  const starvationNotes = checkStarvation();
  entries.push(...starvationNotes);

  // Injury cross-checks run after consumption so daysWithoutFood is current.
  entries.push(...checkInjuryHungerCross());   // Hurt + Starving → Sorely Hurt
  entries.push(...checkSorelyHurtDeath());      // Sorely Hurt death clock + Starving cross
  entries.push(...checkHurtWorkEscalation());   // Hurt characters who worked: 30% escalation
  entries.push(...checkHurtRestRecovery());     // Hurt characters who rested: auto-recover

  // Accumulate Threat from today's actions (passive + per-action adds).
  // Must run after all actions resolve so assignments are final.
  accumulateThreat();

  // Determine raid type before resolveScoutWave runs.
  // Ambush if: no Watch manned, OR a scout was detected today.
  // scoutDetected is cleared each day before action resolution
  // (reset happens at top of runDay — see above). Watch check uses
  // watchPresent() which reads currentAction, so assignments are final.
  const watchManned = watchPresent();
  gameState.raidIsAmbush = !watchManned || gameState.scoutDetected;

  if (gameState.threat >= THREAT_RAID_THRESHOLD) {
    entries.push(...resolveScoutWave());
    resetThreatAfterRaid();
    gameState.scoutWarning = null;
    gameState.scoutDetected = false;
  }

  gameState.log.push({ day: gameState.day, entries: entries });

  checkGameOver(entries);

  gameState.day += 1;
}

// Checks whether the game has ended. Two conditions:
//   Defeat — all characters dead (combat or starvation).
//   Victory — the caravan arrives on caravanArrivalDay with at least one survivor.
//
// Fortification completion is NOT a win condition. If the works are
// finished before the caravan arrives, a journal entry marks the moment
// and play continues. The caravan ending is the end of Chapter 1.
function checkGameOver(entries) {
  const survivors = gameState.characters.filter(c => c.alive).length;

  if (survivors === 0) {
    gameState.gameOver = true;
    gameState.outcome = "defeat";
    entries.push("The vanguard is no more. There is no one left to hold this ground.");
    return;
  }

  // Mid-run beat: fortification fully complete before caravan arrives.
  // Fires once — gameState.fortificationComplete guards against repeats.
  if (
    !gameState.fortificationComplete &&
    gameState.fortification.stageIndex >= FORTIFICATION_STAGES.length
  ) {
    gameState.fortificationComplete = true;
    entries.push(
      "The watchtower was raised before midday. The men stood and looked at what they had made — ditch, bank, stakes, bridgeway, ramparts — and said nothing for a time. There was still the waiting."
    );
  }

  // Win condition: caravan arrives.
  if (gameState.day >= gameState.caravanArrivalDay) {
    gameState.gameOver = true;
    gameState.outcome = "victory";
    const fortNote = gameState.fortificationComplete
      ? "The works stood ready."
      : "The works were not yet finished — but the camp had held.";
    entries.push(
      `On the ${ordinal(gameState.caravanArrivalDay)} day, dust rose on the road to the south. The caravan had come. ${fortNote}`
    );
  }
}

// Returns an ordinal string for a number: 1 → "1st", 25 → "25th", etc.
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// One-line status for the resource summary bar. No numbers, no percent
// — a qualitative read on which stage is current and roughly how far
// into it the camp is, same banding logic as buildPalisadeFlavor().
function fortificationStatusLine() {
  const fort = gameState.fortification;
  const stage = FORTIFICATION_STAGES[fort.stageIndex];

  if (!stage) return "complete — the works stand finished";

  const fractionLeft = fort.daysRemaining / stage.cost;
  let progressWord;
  if (fractionLeft >= 1) {
    progressWord = "not yet begun";
  } else if (fractionLeft > 0.66) {
    progressWord = "just started";
  } else if (fractionLeft > 0.33) {
    progressWord = "underway";
  } else {
    progressWord = "nearly finished";
  }

  return `${stage.name} (${progressWord})`;
}

// Updates the Status Bar (day counter + threat word) and Resource Strip.
// Resource strip is a stub — icon art is pending; displays text counts
// with the parchment palette until the icon generation pass lands.
// Read-only — never modifies gameState.
function renderResources() {
  const r = gameState.resources;
  const e = gameState.environment;

  // Status bar
  document.querySelector("#statusBar .sb-day").textContent = `Day ${gameState.day}`;

  // Threat mood phrase — hidden number, visible signal.
  // Ambient phrase appears once Threat crosses ~60% of threshold.
  // Scout intel (warm+) appends a short field note.
  // No number ever shown; no "raid imminent" label.
  const threatEl = document.querySelector("#statusBar .sb-threat");
  const threatRatio = gameState.threat / THREAT_RAID_THRESHOLD;
  let threatText = "";
  if (threatRatio >= 0.6) {
    threatText = "The men are uneasy.";
  }
  if (gameState.scoutWarning) {
    const band = gameState.scoutWarning.band;
    const intelNote = band >= 3 ? " They have been seen." : " Someone has been through this ground.";
    threatText = (threatText || "The men are uneasy.") + intelNote;
  }
  threatEl.textContent = threatText;

  // Resource strip — text stub (icon art pending)
  // Simples only shown when > 0 to avoid cluttering an already-full strip
  const resources = [
    { label: "Rations",    count: r.rations },
    { label: "Raw food",   count: r.rawFood },
    { label: "Forage",     count: r.forageFood },
    { label: "Wood",       count: r.wood },
    { label: "Trees",      count: e.treesRemainingNearby },
    ...(r.simples > 0 ? [{ label: "Simples", count: r.simples }] : [])
  ];
  document.getElementById("resourceStrip").innerHTML = resources
    .map(res => `<div class="res-item"><span class="res-count">${res.count}</span> ${res.label}</div>`)
    .join("");

  // Site card stage name line
  const stage = FORTIFICATION_STAGES[gameState.fortification.stageIndex];
  const artLabel = document.querySelector(".site-art-label");
  const stageLine = document.getElementById("siteStageNameLine");
  if (artLabel) artLabel.textContent = stage ? stage.name : "Complete";
  if (stageLine) stageLine.textContent = stage ? fortificationStatusLine() : "";
}

// Opens the Journal Screen after a day resolves, showing that day's log.
// Fades in over the game screen. Tapping anywhere dismisses it.
// The entries array is joined into a single paragraph per the component spec.
// Character names are highlighted in the journal-names color.
function showJournalScreen(dayRecord) {
  const screen = document.getElementById("journalScreen");
  const dayNames = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
                    "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen",
                    "Eighteen","Nineteen","Twenty"];
  const dayWord = dayNames[dayRecord.day - 1] || `${dayRecord.day}`;

  document.getElementById("journalDayHeader").textContent = `Day ${dayWord}`;

  // Join entries into a flowing paragraph. Highlight known character names
  // by wrapping them in a .journal-name span.
  const allNames = gameState.characters.map(c => c.name);
  let text = dayRecord.entries.join(" ");
  allNames.forEach(name => {
    // Replace whole-word occurrences only (word boundary), case-sensitive
    const re = new RegExp(`\\b${name}\\b`, "g");
    text = text.replace(re, `<span class="journal-name">${name}</span>`);
  });
  document.getElementById("journalEntryText").innerHTML = text;

  // Show + fade in
  screen.style.display = "block";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => screen.classList.add("visible"));
  });
}

// Closes the Journal Screen with a fade and returns to game screen.
function closeJournalScreen() {
  const screen = document.getElementById("journalScreen");
  screen.classList.remove("visible");
  screen.addEventListener("transitionend", () => {
    screen.style.display = "none";
  }, { once: true });
}


// Called when the player clicks Start Day. Runs the simulation,
// shows the Journal screen for that day, then refreshes the game screen.
// Actions persist across days — players change them only when they want to.
function startDay() {
  runDay();

  // Capture the day record that just landed (last entry in the log)
  const dayRecord = gameState.log[gameState.log.length - 1];

  renderResources();
  renderRoster();
  updateStartDayAvailability();
  renderGameOverIfNeeded();

  // Show journal for this day — player taps to return to game screen
  showJournalScreen(dayRecord);
}

// Shows a clear victory/defeat banner once the game has ended,
// and disables further play so the log stands as the final record.
function renderGameOverIfNeeded() {
  if (!gameState.gameOver) return;

  const banner = document.getElementById("gameOverBanner");
  const outcomeText = gameState.outcome === "victory"
    ? "THE CARAVAN HAS ARRIVED — The vanguard held until they came."
    : "DEFEAT — The vanguard has fallen.";
  const bannerClass = gameState.outcome === "victory" ? "game-over victory" : "game-over defeat";

  banner.innerHTML = `${outcomeText}<br><button id="resetBtn">Start a New Vanguard</button>`;
  banner.className = bannerClass;
  banner.style.display = "block";

  document.getElementById("resetBtn").addEventListener("click", () => location.reload());
  document.getElementById("startDayBtn").disabled = true;
}


// ---------------------------------------------
// START
// The game now begins on the selection screen. The actual
// game (resources, roster, day loop) only initializes once
// the player confirms their 5 chosen men in confirmVanguard().
// ---------------------------------------------
candidatePool = generateCandidatePool(CANDIDATE_POOL_SIZE);
renderCandidatePool();

document.getElementById("rerollBtn").addEventListener("click", rerollCandidates);
document.getElementById("confirmVanguardBtn").addEventListener("click", confirmVanguard);
document.getElementById("startDayBtn").addEventListener("click", startDay);

// Close tray on tap outside — but allow taps on action slots to
// context-switch without first closing. Any click that doesn't land
// inside the tray or on an action slot closes the tray.
document.addEventListener("click", e => {
  if (!document.getElementById("actionTray").classList.contains("open")) return;
  if (e.target.closest("#actionTray")) return;
  if (e.target.closest(".action-slot")) return;
  closeActionTray();
});

// Journal screen — tap anywhere to dismiss and return to game
document.getElementById("journalScreen").addEventListener("click", () => {
  closeJournalScreen();
});

</script>
