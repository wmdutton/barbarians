// Unmake table keyed by quarry category
const UNMAKE_TABLES = { small: TABLES.UNMAKE_SMALL, medium: TABLES.UNMAKE_MEDIUM, large: TABLES.UNMAKE_LARGE, prize: TABLES.UNMAKE_PRIZE };

// Named animals for log text (period-accurate, Welsh Marches 1067–1081)
// Categories recalibrated to realistic dressed-weight portions (~150–200g each):
//   small  = 2–4 portions  (birds, squirrel, young hare)
//   medium = 5–9 portions  (adult hare, mallard)
//   large  = 15–25 portions (roe deer, fallow deer, red deer hind)
//   prize  = 30–50 portions (red deer hart, wild boar — driven hunt event, level 6 only)
// Caps in UNMAKE tables reflect max recoverable at perfect skill — not inflated.
const ANIMAL_NAMES = {
  small:  ['a grey partridge','a woodcock','a snipe','a wood pigeon','a young hare','a squirrel'],
  medium: ['an adult hare','a mallard'],
  large:  ['a roe deer','a fallow deer','a red deer hind'],
  prize:  ['a red deer hart','a wild boar'],
};
function animalName(category) {
  const pool = ANIMAL_NAMES[category];
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ─────────────────────────────────────────────
   FAILURE EVENT CHECK
   Fires before table lookup. If triggered, output = 0.
   Represents bad luck independent of skill.
───────────────────────────────────────────── */
const FAILURE_RATES = {
  daily:        [0.20, 0.15, 0.10, 0.06, 0.04, 0.03], // Hunt, Cook, Gather — index = level-1
  construction: [0.15, 0.10, 0.08, 0.05, 0.03, 0.02], // Labor, Carpentry, Earthworks
};

function rollFailureEvent(level, type) {
  return Math.random() < FAILURE_RATES[type][level - 1];
}

/* ─────────────────────────────────────────────
   ACTION RESOLUTION
   d6 table lookup: roll (1–6) = row, skill level (1–6) = column.
   Failure event check fires first — if triggered, output = 0.
───────────────────────────────────────────── */
const ACTION_RESOLVERS = {
  // ── STALK BEASTS ─────────────────────────────────────────────────────────
  // Produces quarry (dead animal, hide-on). Not rawFood directly.
  // rawFood comes from Unmake kill the following day.
  'Stalk beasts': (char, gs) => {
    const level = getSkillLevel(char, 'Hunt');
    if (level === 0) return { roll: 0, gained: null, category: null, resource: 'quarry', label: 'nothing' };
    if (rollFailureEvent(level, 'daily')) {
      return { roll: 0, gained: null, category: null, resource: 'quarry', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const category = TABLES.HUNT[roll][level - 1];
    if (category !== 'nothing') {
      const killName = animalName(category);
      gs.quarry.push({ category, dayKilled: gs.day, name: killName });
      gs.seenResources.add('quarry');
      return { roll, gained: 1, category, killName, resource: 'quarry', label: category };
    }
    return { roll, gained: 0, category: 'nothing', killName: null, resource: 'quarry', label: 'nothing' };
  },

  // ── UNMAKE KILL ───────────────────────────────────────────────────────────
  // Consumes oldest quarry, produces green meat (rawFood).
  'Unmake kill': (char, gs) => {
    const level = getSkillLevel(char, 'Hunt');
    if (level === 0 || gs.quarry.length === 0) {
      return { roll: 0, gained: 0, resource: 'rawFood', label: 'nothing to unmake' };
    }
    if (rollFailureEvent(level, 'daily')) {
      return { roll: 0, gained: 0, resource: 'rawFood', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const q = gs.quarry.shift(); // consume oldest
    const table = UNMAKE_TABLES[q.category];
    const gained = table[roll][level - 1];
    if (gained > 0) {
      gs.resources.rawFood += gained;
      gs.rawFoodLog.push({ day: gs.day, amount: gained });
      gs.seenResources.add('rawFood');
    }
    return { roll, gained, category: q.category, quarryName: q.name, resource: 'rawFood', label: 'green meat' };
  },

  // ── GATHER MAST ───────────────────────────────────────────────────────────
  // Gatherer role at level 4+ has a chance to produce Simples as byproduct.
  'Gather mast': (char, gs) => {
    const level = getSkillLevel(char, 'Gather');
    if (level === 0) return { roll: 0, gained: 0, resource: 'forageFood', label: 'nothing' };
    if (rollFailureEvent(level, 'daily')) {
      return { roll: 0, gained: 0, resource: 'forageFood', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const gained = TABLES.GATHER[roll][level - 1];
    if (gained > 0) {
      gs.resources.forageFood += gained;
      gs.forageFoodLog.push({ day: gs.day, amount: gained });
      gs.seenResources.add('forageFood');
    }
    // Simples byproduct — Gatherer role, level 4+ only
    let simplesGained = 0;
    if (gained > 0 && char.role === 'Gatherer' && level >= 4) {
      const simplesProb = [0, 0, 0, 0.30, 0.50, 0.70][level - 1] || 0;
      if (Math.random() < simplesProb) {
        simplesGained = 1;
        gs.resources.simples = (gs.resources.simples || 0) + 1;
        gs.simplesLog.push({ day: gs.day, amount: 1 });
        gs.seenResources.add('simples');
      }
    }
    return { roll, gained, simplesGained, resource: 'forageFood', label: 'forage' };
  },

  // ── FELL TIMBER ──────────────────────────────────────────────────────────
  'Fell timber': (char, gs) => {
    const level = getSkillLevel(char, 'Forestry');
    if (level === 0) return { roll: 0, gained: 0, resource: 'timber', label: 'nothing' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: 'timber', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const gained = TABLES.FELL[roll][level - 1];
    if (gained > 0) { gs.resources.timber += gained; gs.seenResources.add('timber'); }
    return { roll, gained, resource: 'timber', label: 'timber' };
  },

  // ── BUCK TIMBER ──────────────────────────────────────────────────────────
  'Buck timber': (char, gs) => {
    const level = getSkillLevel(char, 'Forestry');
    if (level === 0) return { roll: 0, gained: 0, resource: 'logs', label: 'nothing' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: 'logs', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const raw = TABLES.BUCK[roll][level - 1];
    const taken = Math.min(gs.resources.timber, raw);
    if (taken > 0) {
      gs.resources.timber -= taken;
      gs.resources.logs += taken * 3;
      gs.seenResources.add('logs');
    }
    return { roll, gained: taken * 3, resource: 'logs', label: 'logs' };
  },

  // ── RIVE PALLS ───────────────────────────────────────────────────────────
  'Rive palls': (char, gs) => {
    const level = getSkillLevel(char, 'Forestry');
    if (level === 0) return { roll: 0, gained: 0, resource: 'palls', label: 'nothing' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: 'palls', label: 'nothing', failed: true };
    }
    const roll = rollCharacterDie();
    const raw = TABLES.RIVE[roll][level - 1];
    const logsUsed = Math.min(gs.resources.logs, raw);
    if (logsUsed > 0) {
      gs.resources.logs -= logsUsed;
      gs.resources.palls += logsUsed * 2;
      gs.seenResources.add('palls');
    }
    return { roll, gained: logsUsed * 2, resource: 'palls', label: 'palls' };
  },

  // ── CLEAR GROUND ─────────────────────────────────────────────────────────
  'Clear Ground': (char, gs) => {
    const level = getSkillLevel(char, 'Labor');
    if (level === 0) return { roll: 0, gained: 0, resource: null, label: 'ground progress' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: null, label: 'ground progress', failed: true };
    }
    const roll = rollCharacterDie();
    const contributed = TABLES.LABOR[roll][level - 1];
    gs.buildings.groundProgress = (gs.buildings.groundProgress || 0) + contributed;
    if (gs.buildings.groundProgress >= 3) gs.buildings.groundCleared = true;
    return { roll, gained: contributed, resource: null, label: 'ground progress' };
  },

  // ── BUILD HEARTH ─────────────────────────────────────────────────────────
  'Build Hearth': (char, gs) => {
    const level = getSkillLevel(char, 'Carpentry');
    if (level === 0) return { roll: 0, gained: 0, resource: null, label: 'hearth progress' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: null, label: 'hearth progress', failed: true };
    }
    const roll = rollCharacterDie();
    const contributed = TABLES.CARPENTRY[roll][level - 1];
    gs.buildings.hearthProgress = (gs.buildings.hearthProgress || 0) + contributed;
    if (gs.buildings.hearthProgress >= 3) gs.buildings.hearth = true;
    return { roll, gained: contributed, resource: null, label: 'hearth progress' };
  },

  // ── KEEP WARD ────────────────────────────────────────────────────────────
  // No table — watch outcome is handled by combat system (not yet built).
  'Keep ward': (char, gs) => {
    return { roll: 0, gained: 0, resource: null, label: 'watch' };
  },

  // ── DIG FOSSE ────────────────────────────────────────────────────────────
  'Dig fosse': (char, gs) => {
    const level = getSkillLevel(char, 'Labor');
    if (level === 0) return { roll: 0, gained: 0, resource: null, label: 'fosse progress' };
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: null, label: 'fosse progress', failed: true };
    }
    const roll = rollCharacterDie();
    const contributed = TABLES.LABOR[roll][level - 1];
    gs.buildings.fosseProgress = (gs.buildings.fosseProgress || 0) + contributed;
    if (gs.buildings.fosseProgress >= 6) gs.buildings.fosseComplete = true;
    return { roll, gained: contributed, resource: null, label: 'fosse progress' };
  },

  // ── SET PALLS ────────────────────────────────────────────────────────────
  'Set Palls': (char, gs) => {
    const level = getSkillLevel(char, 'Labor');
    if (level === 0 || gs.resources.palls === 0) {
      return { roll: 0, gained: 0, resource: null, label: 'palisade progress' };
    }
    if (rollFailureEvent(level, 'construction')) {
      return { roll: 0, gained: 0, resource: null, label: 'palisade progress', failed: true };
    }
    const roll = rollCharacterDie();
    const contributed = TABLES.LABOR[roll][level - 1];
    if (contributed > 0 && gs.resources.palls > 0) {
      gs.resources.palls--;
      gs.buildings.palisadeProgress = (gs.buildings.palisadeProgress || 0) + contributed;
      if (gs.buildings.palisadeProgress >= 8) gs.buildings.palisade = true;
    }
    return { roll, gained: contributed, resource: null, label: 'palisade progress' };
  },
};

/* ─────────────────────────────────────────────
   LOG TEXT — converts a resolution result into a plain sentence.
───────────────────────────────────────────── */
function logLine(name, actionId, result) {
  const g = result.gained;

  switch (actionId) {
    case 'Stalk beasts':
      if (result.failed) return `${name} came back empty-handed — bad luck in the wood.`;
      if (!result.killName) return `${name} came back empty-handed from the hunt.`;
      return `${name} brought in ${result.killName}.`;

    case 'Unmake kill': {
      if (result.failed) return `${name} fumbled the unmake — the work came to nothing.`;
      const qn = result.quarryName || (result.category ? `the ${result.category} game` : 'the kill');
      if (g === 0) return `${name} unmade ${qn} but recovered nothing worth keeping.`;
      return `${name} unmade ${qn} — ${g} portion${g !== 1 ? 's' : ''} of green meat.`;
    }

    case 'Gather mast':
      if (result.failed) return `${name} came back with nothing worth keeping.`;
      if (g === 0) return `${name} found nothing worth taking from the ground.`;
      return result.simplesGained
        ? `${name} gathered ${g} foraged good${g !== 1 ? 's' : ''} and came back with simples as well.`
        : `${name} gathered ${g} foraged good${g !== 1 ? 's' : ''} from the ground.`;

    case 'Cook provisions':
      if (g === 0) return `${name} could cook nothing — no food in camp.`;
      return `${name} made ${g} ration${g !== 1 ? 's' : ''} from what was there.`;

    case 'Fell timber':
      if (result.failed) return `${name} spent the day in the trees and the work came to nothing.`;
      if (g === 0) return `${name} spent the day in the trees and came back with nothing useful.`;
      return `${name} felled ${g} timber from the wood.`;

    case 'Buck timber':
      if (result.failed) return `${name} worked the timber but the day came to nothing.`;
      if (g === 0) return `${name} worked the timber but made nothing usable.`;
      return `${name} bucked ${g} log${g !== 1 ? 's' : ''} from the timber.`;

    case 'Rive palls':
      if (result.failed) return `${name} worked the logs but the day came to nothing.`;
      if (g === 0) return `${name} could not rive — no logs to work.`;
      return `${name} rived and sharpened ${g} pall${g !== 1 ? 's' : ''} from the logs.`;

    case 'Clear Ground':
      if (result.failed) return `${name} worked the ground but the effort came to nothing — the ground gave way.`;
      if (g === 0) return `${name} worked the ground but made little progress.`;
      return gameState.buildings.groundCleared
        ? `${name} finished clearing the ground. The site is ready.`
        : `${name} put in work clearing ground.`;

    case 'Build Hearth':
      if (result.failed) return `${name} worked on the hearth but the day came to nothing.`;
      return gameState.buildings.hearth
        ? `${name} finished the hearth. A fire can be kept now.`
        : `${name} worked on the hearth.`;

    case 'Keep ward':
      return `${name} kept watch through the day. Nothing came.`;

    case 'Dig fosse':
      if (result.failed) return `${name} dug at the fosse but the ground gave way — nothing held.`;
      return gameState.buildings.fosseComplete
        ? `${name} finished the fosse. The ditch line is cut.`
        : `${name} dug at the fosse line.`;

    case 'Set Palls':
      if (result.failed) return `${name} worked the palisade but the day came to nothing.`;
      return gameState.buildings.palisade
        ? `${name} set the last of the palls. The palisade stands.`
        : `${name} set palls along the stake line.`;

    case 'Design Fosse Event':
      return `${name} walked the perimeter and marked where the ditch line should run.`;

    case 'Design Palisade Event':
      return `${name} surveyed the fosse and laid out the stake positions for the palisade.`;

    default:
      return `${name} spent the day on ${actionId.toLowerCase()}.`;
  }
}

/* ─────────────────────────────────────────────
   START DAY
───────────────────────────────────────────── */
// Modal dismiss
document.getElementById('modalDismiss').addEventListener('click', () => {
  document.getElementById('unassignedModal').style.display = 'none';
});
document.getElementById('unassignedModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.style.display = 'none';
});

document.getElementById('startDayBtn').addEventListener('click', () => {
  const unassigned = gameState.characters.filter(c => !c.currentAction).length;
  if (unassigned > 0) {
    document.getElementById('unassignedModal').style.display = 'flex';
    return;
  }
  gameState.day++;
  const dayText = `Day ${gameState.day}`;

  document.getElementById('journalDayLabel').textContent = dayText;

  const before = { ...gameState.resources };
  const gs = gameState;

  // ── Phase 1: resource-producing actions ─────────────────────────────────
  // Run Hunt, Forage, Fell timber first so resources are available to Cook.
  const RESOURCE_ACTIONS = new Set(['Stalk beasts', 'Unmake kill', 'Gather mast', 'Fell timber', 'Buck timber', 'Rive palls']);
  const COOK_ACTION      = 'Cook provisions';
  const EVENT_ACTIONS    = new Set(['Design Fosse Event', 'Design Palisade Event']);

  const alive = gs.characters.filter(c => !c.dead);
  const log = { income: [], cook: [], site: [], spoil: [] };  // ordered buckets

  alive.forEach(char => {
    const actionId = char.currentAction;
    if (!actionId || !RESOURCE_ACTIONS.has(actionId)) return;
    const resolver = ACTION_RESOLVERS[actionId];
    if (!resolver) return;
    const result = resolver(char, gs);
    log.income.push({ name: char.name, action: actionId, result });
  });

  // ── Phase 2: Cook ────────────────────────────────────────────────────────
  // Each cook rolls d6 → rate table lookup → rations = floor(rawFood × rate), capped.
  // Multiple cooks pool caps. rawFood processed at rolled rate; forageFood at 1.5:1 floor.
  const cookChars = gs.characters.filter(c => c.currentAction === COOK_ACTION);
  if (cookChars.length > 0) {
    const cookRolls = cookChars.map(c => {
      const level = getSkillLevel(c, 'Cook');
      if (level === 0 || rollFailureEvent(level, 'daily')) {
        return { char: c, roll: 0, rate: 0, cap: 0 };
      }
      const roll = rollCharacterDie();
      const rate = TABLES.COOK[roll][level - 1];
      const cap = gs.buildings.hearth
        ? TABLES.COOK_HEARTH_CAPS[level - 1]
        : TABLES.COOK_PRE_HEARTH_CAP;
      return { char: c, roll, rate, cap };
    });
    const totalCap = cookRolls.reduce((sum, r) => sum + r.cap, 0);
    // Weighted average rate (by cap share) for rawFood conversion
    const avgRate = totalCap > 0
      ? cookRolls.reduce((sum, r) => sum + r.rate * r.cap, 0) / totalCap
      : 0;

    let rationsMade = 0;
    let inputUsed = 0;

    // rawFood first — apply rolled rate, then cap
    if (avgRate > 0 && gs.resources.rawFood > 0) {
      const fromRaw = Math.min(gs.resources.rawFood, totalCap);
      const fromRawRations = Math.min(Math.floor(fromRaw * avgRate), totalCap);
      if (fromRaw > 0) {
        gs.resources.rawFood -= fromRaw;
        gs.rawFoodLog = gs.rawFoodLog.map(e => ({ ...e, amount: Math.max(0, e.amount - fromRaw) })).filter(e => e.amount > 0);
        rationsMade += fromRawRations;
        inputUsed += fromRaw;
      }
    }

    // forageFood next (1.5:1 floor), remaining cap
    const remainCap = totalCap - inputUsed;
    const fromForage = Math.min(gs.resources.forageFood, remainCap);
    if (fromForage > 0) {
      gs.resources.forageFood -= fromForage;
      gs.forageFoodLog = gs.forageFoodLog.map(e => ({ ...e, amount: Math.max(0, e.amount - fromForage) })).filter(e => e.amount > 0);
      rationsMade += Math.floor(fromForage * 1.5);
    }

    gs.resources.rations += rationsMade;

    // Log each cook proportionally by cap share
    let remaining = rationsMade;
    cookRolls.forEach((r, i) => {
      const share = i === cookRolls.length - 1
        ? remaining
        : (totalCap > 0 ? Math.round(rationsMade * r.cap / totalCap) : 0);
      remaining -= share;
      log.cook.push({ name: r.char.name, action: COOK_ACTION, result: { roll: r.roll, gained: share } });
    });
  }

  // ── Phase 3: spoilage sweep ──────────────────────────────────────────────
  // Quarry: spoils after 1 day (must be unmade same day or next)
  const rottenQuarry = gs.quarry.filter(q => gs.day - q.dayKilled >= 1);
  gs.quarry = gs.quarry.filter(q => gs.day - q.dayKilled < 1);
  const quarrySpoiled = rottenQuarry.length;

  // Green meat (rawFood): spoils after 3 days
  let rawSpoiled = 0;
  gs.rawFoodLog = gs.rawFoodLog.filter(entry => {
    if (entry.day < gs.day - 2) {  // day killed + 3 days = day-3 threshold
      const amt = Math.min(entry.amount, gs.resources.rawFood);
      gs.resources.rawFood = Math.max(0, gs.resources.rawFood - amt);
      rawSpoiled += amt;
      return false;
    }
    return true;
  });

  // Forage food: spoils after 2 days
  let forageSpoiled = 0;
  gs.forageFoodLog = gs.forageFoodLog.filter(entry => {
    if (entry.day < gs.day - 2) {
      const amt = Math.min(entry.amount, gs.resources.forageFood);
      gs.resources.forageFood = Math.max(0, gs.resources.forageFood - amt);
      forageSpoiled += amt;
      return false;
    }
    return true;
  });

  // Simples: spoils after 3 days
  let simplesSpoiled = 0;
  if (!gs.simplesLog) gs.simplesLog = [];
  gs.simplesLog = gs.simplesLog.filter(entry => {
    if (entry.day < gs.day - 2) {
      const amt = Math.min(entry.amount, gs.resources.simples || 0);
      gs.resources.simples = Math.max(0, (gs.resources.simples || 0) - amt);
      simplesSpoiled += amt;
      return false;
    }
    return true;
  });

  // ── Phase 4: feed characters — forage first, then rations ───────────────
  const sorted = [...alive].sort((a, b) => b.daysSinceEating - a.daysSinceEating);
  const fedNames = new Set();
  let forageConsumedByFeed = 0;

  for (const char of sorted) {
    if (gs.resources.forageFood > 0) {
      gs.resources.forageFood--;
      forageConsumedByFeed++;
      char.daysSinceEating = 0;
      fedNames.add(char.name);
    } else if (gs.resources.rations > 0) {
      gs.resources.rations--;
      char.daysSinceEating = 0;
      fedNames.add(char.name);
    }
  }

  // Sync forageFoodLog with what the feed phase consumed
  if (forageConsumedByFeed > 0) {
    let remaining = forageConsumedByFeed;
    gs.forageFoodLog = gs.forageFoodLog.map(e => {
      if (remaining <= 0) return e;
      const used = Math.min(e.amount, remaining);
      remaining -= used;
      return { ...e, amount: e.amount - used };
    }).filter(e => e.amount > 0);
  }

  // ── Phase 5: hunger states and deaths ───────────────────────────────────
  const deaths = [];
  const deathSet = new Set();
  for (const char of alive) {
    if (!fedNames.has(char.name)) {
      char.daysSinceEating = (char.daysSinceEating || 0) + 1;
      if (char.daysSinceEating >= 3) {
        char.dead = true;
        char.hungerState = 'dead';
        deaths.push(char.name);
        deathSet.add(char.name);
      } else if (char.daysSinceEating === 2) {
        char.hungerState = 'starving';
      } else {
        char.hungerState = 'hungry';
      }
    } else {
      char.hungerState = null;
    }
  }

  gs.characters = gs.characters.filter(c => !c.dead);

  // ── Phase 6: site and event actions ─────────────────────────────────────
  alive.filter(c => !deathSet.has(c.name)).forEach(char => {
    const actionId = char.currentAction;
    if (!actionId) return;
    if (RESOURCE_ACTIONS.has(actionId) || actionId === COOK_ACTION) return; // already handled

    if (EVENT_ACTIONS.has(actionId)) {
      if (actionId === 'Design Fosse Event')    gs.events.fosseDesigned    = true;
      if (actionId === 'Design Palisade Event') gs.events.palisadeDesigned = true;
      log.site.push({ name: char.name, action: actionId, result: { gained: 0 } });
      return;
    }

    const resolver = ACTION_RESOLVERS[actionId];
    if (!resolver) return;
    const result = resolver(char, gs);
    log.site.push({ name: char.name, action: actionId, result });
  });

  // Deltas
  const deltas = {};
  Object.keys(gs.resources).forEach(k => {
    const d = gs.resources[k] - before[k];
    if (d !== 0) deltas[k] = d;
  });

  // Persist actions into next day unless the task is now complete or inputs are gone
  gs.characters.forEach(c => {
    const id = c.currentAction;
    if (!id) return;
    const def = getActionDef(id);
    // Clear if: no def, requires() gate closed, or inputs no longer available
    if (!def || (def.requires && !def.requires(gs)) || !def.inputReady(gs)) {
      c.currentAction = null;
    }
  });

  // Update seenActions — new gates may have opened this day
  updateSeenActions();
  // Update startDay button state after potential action clearing
  updateStartDay();

  // Render day log — ordered: income → cook → site → spoilage → deaths
  const logEl = document.getElementById('dayLog');
  const block = document.createElement('div');
  block.className = 'log-day-block';
  const header = document.createElement('div');
  header.className = 'log-day-header';
  header.textContent = `Day ${gameState.day}`;
  block.appendChild(header);

  function addEntry(text, cssClass) {
    const e = document.createElement('div');
    e.className = 'log-entry' + (cssClass ? ' ' + cssClass : '');
    e.textContent = text;
    block.appendChild(e);
  }

  // Group site actions by action id (multiple characters on same task → one line)
  // Resource/cook actions stay separate (individual hauls are meaningful info)
  function groupedLines(entries, groupSiteActions) {
    if (!groupSiteActions) return entries.map(e => ({ ...e, names: [e.name] }));
    const groups = {};
    entries.forEach(e => {
      if (!groups[e.action]) groups[e.action] = { ...e, names: [e.name], result: { ...e.result } };
      else {
        groups[e.action].names.push(e.name);
        groups[e.action].result.gained = (groups[e.action].result.gained || 0) + (e.result.gained || 0);
      }
    });
    return Object.values(groups);
  }

  // Format a combined name list: "Ralph and Brictric" / "Ralph, Brictric, and Odo"
  function nameList(names) {
    if (names.length === 1) return names[0];
    if (names.length === 2) return `${names[0]} and ${names[1]}`;
    return `${names.slice(0,-1).join(', ')}, and ${names[names.length-1]}`;
  }

  // Classify: zero-result resource actions get oxblood
  function entryClass(action, result) {
    const isResourceAction = ['Stalk beasts','Gather mast','Fell timber','Buck timber','Rive palls','Cook provisions'].includes(action);
    if (isResourceAction && result.gained === 0) return 'log-fail';
    return '';
  }

  // Site — grouped by action (first — what the men built/worked)
  groupedLines(log.site, true).forEach(({ names, action, result }) => {
    const label = nameList(names);
    addEntry(logLine(label, action, result), '');
  });

  // Income — individual lines (what was gathered/hunted)
  log.income.forEach(({ name, action, result }) => {
    addEntry(logLine(name, action, result), entryClass(action, result));
  });

  // Cook — individual (only one cook)
  log.cook.forEach(({ name, action, result }) => {
    addEntry(logLine(name, action, result), entryClass(action, result));
  });

  // Spoilage — oxblood
  if (quarrySpoiled > 0) {
    addEntry(`${quarrySpoiled === 1 ? 'A kill' : `${quarrySpoiled} kills`} left too long — the hide could not be unmade in time. Wasted.`, 'log-spoil');
  }
  if (rawSpoiled > 0) {
    addEntry(`${rawSpoiled} portion${rawSpoiled === 1 ? '' : 's'} of green meat gone off — wasted.`, 'log-spoil');
  }
  if (forageSpoiled > 0) {
    addEntry(`${forageSpoiled} foraged good${forageSpoiled === 1 ? '' : 's'} ${forageSpoiled === 1 ? 'has' : 'have'} rotted — lost.`, 'log-spoil');
  }
  if (simplesSpoiled > 0) {
    addEntry(`${simplesSpoiled} simples wilted unused — lost.`, 'log-spoil');
  }

  // Deaths
  deaths.forEach(name => addEntry(`${name} has died of starvation.`, 'log-spoil'));

  logEl.prepend(block);

  renderSiteCard(deltas);
  renderRoster();

  // Auto-switch to Journal tab so player reads the day log
  switchTab('tabJournal');
});

/* ─────────────────────────────────────────────
   BOOT
───────────────────────────────────────────── */
renderSelection();
</script>
