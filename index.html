<body>

<h1>Barbarians</h1>
<div id="versionTag">v0.3.0.0 — prototype, unreleased</div>

<div id="selectionScreen">
  <p id="selectionInstructions"></p>
  <div id="candidatePool"></div>
  <button id="rerollBtn">Reroll Remaining Candidates</button>
  <span id="rerollCount"></span>
  <br><br>
  <button id="confirmVanguardBtn" disabled>Confirm Vanguard</button>
</div>

<div id="gameScreen" style="display: none;">
  <div id="resourceSummary"></div>
  <div id="gameOverBanner" style="display: none;"></div>
  <div id="roster"></div>
  <button id="startDayBtn" disabled>Start Day</button>
  <div id="assignmentStatus"></div>
  <div id="dayLog"></div>
</div>

<script>

// Rolls the starting tree count near the camp (8 to 10).
function rollStartingTrees() {
  return 8 + Math.floor(Math.random() * 3); // 8 to 10
}

// Rolls which day the next outrider wave arrives (1-3 days out
// from fromDay). See design-rationale.md for balance reasoning.
function rollNextWaveDay(fromDay) {
  const gap = 1 + Math.floor(Math.random() * 3); // 1 to 3 days out
  return fromDay + gap;
}

// ---------------------------------------------
// GAME STATE
// This object is the single source of truth.
// Every system reads from and writes to this.
// ---------------------------------------------
const gameState = {

  day: 1,

  resources: {
    rations: 0,     // set by whichever Cooks the player picks — see applyStartingSupplies()
    rawFood: 0,     // hunted meat — needs a Master Cook before it's safe/wise to eat
    forageFood: 0,  // foraged food — edible directly, no cooking needed, but spoils fast
    forageFoodAge: 0, // days since the current forage food stock was gathered — spoils at 2
    wood: 0,        // set by whichever Carpenters the player picks
    weapons: 0     // set by whichever Soldiers the player picks
  },

  // Fortification track — six stages, man-day costs per the design doc.
  // stageIndex points into FORTIFICATION_STAGES below; daysRemaining is
  // how many man-days are left to pay off the CURRENT stage only (not
  // the whole track). Rampart/Watchtower are intentionally out of easy
  // reach in a normal Phase 1 run — don't rebalance that away.
  //
  // hasAnnouncedStart: whether buildPalisadeFlavor has already said
  // "work has only just begun" for the CURRENT stage. Prevents that
  // line from repeating every single day a stage sits above the 66%
  // remaining threshold — it should fire once, the first day work
  // starts on a stage, then fall through to standard "coming along"
  // phrasing for the rest of that band. Reset to false whenever
  // stageIndex advances (see resolveBuildPalisade).
  fortification: {
    stageIndex: 0,
    daysRemaining: 3, // Bailey Grounds costs 3 — see FORTIFICATION_STAGES
    hasAnnouncedStart: false
  },

  characters: [], // filled in by generateSettlers()

  environment: {
    treesRemainingNearby: rollStartingTrees(), // randomized, see rollStartingTrees()
    safeForagingRange: "normal", // "extended" if player later approves risk
    groundQuality: "rocky" // slows the farmer
  },

  log: [
    // one entry per day, e.g.:
    // { day: 1, entries: ["Thomas felled two trees near camp.", "Rations held steady."] }
  ],

  pendingDecision: null,
  // when a decision is surfaced, something like:
  // { id: "rangeTrees", prompt: "...", options: ["rangeFurther", "buildSmaller"] }

  gameOver: false,
  outcome: null, // "victory" (palisade complete) or "defeat" (wiped out / starved) once gameOver is true

  nextWaveDay: rollNextWaveDay(1), // rerolled after each wave — see rollNextWaveDay
  nextWaveWindow: 3, // max days out a Scout warning can estimate
  scoutWarning: null // set by resolveScoutForEnemies: { estimatedDays, estimatedCount, accurate }

};


// ---------------------------------------------
// DATA POOLS
// Names, skills, and backstory fragments used
// to generate settlers. Kept separate from the
// generation logic so they're easy to expand later.
// ---------------------------------------------

// Names for the vanguard roster (male-only — see design-rationale.md).
const NAME_POOL = [
  "Thomas", "Aelfric", "Godwin", "Osric", "Wulfstan",
  "Alwyn", "Cedric", "Baldric", "Leofric", "Eadric",
  "Roger", "Walter", "Hubert", "Warin", "Gervase"
];

// One sentence of specific backstory per skill.
// Each skill has a few options so repeats don't feel identical.
const BACKSTORY_POOL = {
  Carpenter: [
    "a Suffolk carpenter, second son of a tradesman who has never been this far from home.",
    "trained under a York guild master, still carries his late father's chisel.",
    "left an apprenticeship unfinished when the roads north grew too dangerous to travel."
  ],
  Veneur: [
    "grew up poaching the king's deer and never once got caught.",
    "spent more nights sleeping under trees than under a roof, and prefers it that way.",
    "learned to track from a father who was better with animals than with people."
  ],
  "Master Cook": [
    "ran a tavern kitchen for a decade before the harvest failures closed it.",
    "was taught to stretch a meal for twelve on rations meant for six.",
    "still has burn scars from a fire that took a family's bakery, not this one."
  ],
  "Man-at-Arms": [
    "survived a border skirmish that killed most of his unit.",
    "was a household guard for a lord who no longer has a household.",
    "has killed before and does not talk about it unless asked twice."
  ],
  Gatherer: [
    "learned which roots won't kill you from a grandmother who buried three husbands and outlived them all.",
    "spent a hungry childhood combing hedgerows and never lost the habit.",
    "can name every plant in a treeline by moonlight alone."
  ],
  Hewer: [
    "has swung an axe since he was tall enough to lift one.",
    "worked a charcoal camp deep in the Weald before the lord's men came through.",
    "reads a tree's grain the way a priest reads scripture."
  ],
  Fossier: [
    "dug drainage ditches for three different manors and never once complained about the mud.",
    "has calluses a Carpenter would envy and no patience for fine work.",
    "believes there is no ground that can't be moved with enough time and a strong back."
  ],
  Farmer: [
    "worked land that belonged to three different lords in one lifetime.",
    "knows soil the way some people know scripture.",
    "buried two children before turning twenty and rarely speaks of either."
  ]
};

// Active vanguard skill pool — 7 live roles per the locked
// Skill-Weight Model (barbarians-design-doc-characters-20260721.md).
// Outrider and Woodward are tabled (blocked on Threat and the
// Founding Sequence respectively — see design doc). Farmer exists
// in BACKSTORY_POOL but is intentionally excluded here.
// Laborer is retired outright, not renamed — see design-rationale.md
// (Laborer section) for why the generalist-fallback role was cut.
const ALL_SKILLS = ["Carpenter", "Veneur", "Master Cook", "Man-at-Arms", "Gatherer", "Hewer", "Fossier"];

// The tasks a settler can be assigned to for the day.
// No task is skill-gated — any settler can attempt any task.
// Skill only affects how well they do it (see resolve* functions).
const TASK_POOL = ["Woodcutting", "Build Palisade", "Hunt", "Cook", "Perimeter Watch", "Forage", "Scout"];

// Player-facing label for a task in the assignment dropdown. Every
// task shows its own name verbatim EXCEPT "Build Palisade" — that
// internal task id stays fixed (it's what resolveDayForCharacter,
// SKILL_FOR_TASK, etc. all key off of), but the label shown to the
// player reflects whichever Fortification stage is currently active,
// so the dropdown reads "Dig Motte Ditch" while that stage is live,
// then "Raise Palisade Stakes" once it advances, etc.
const FORTIFICATION_TASK_VERB = {
  "Bailey Grounds": "Clear Bailey Grounds",
  "Motte Ditch": "Dig Motte Ditch",
  "Palisade Stakes": "Raise Palisade Stakes",
  "Bridgeway": "Set Bridgeway",
  "Ramparts": "Build Ramparts",
  "Watchtower": "Erect Watchtower"
};

function taskDisplayLabel(task) {
  if (task !== "Build Palisade") return task;
  const stage = FORTIFICATION_STAGES[gameState.fortification.stageIndex];
  return stage ? FORTIFICATION_TASK_VERB[stage.name] : "Fortification (complete)";
}

// Fortification track — locked man-day costs from the design doc.
// Each stage's `cost` is how many man-days it takes to clear on its
// own (not cumulative). Total across all six is 50 man-days.
// `name` is a single noun, shown as the current stage/task label.
// `doneLabel` is the flavor phrase used once that stage is behind you.
// `skill` is which skill counts as Seasoned/"primary" for THIS stage
// specifically — earthwork stages (Bailey Grounds, Motte Ditch) favor
// Fossier; timber stages favor Carpenter. Earthwork is a no-skill task
// per the locked weight model (see resolveBuildPalisade) — Fossier's
// bonus is a delay-avoidance perk, not a yield bonus like Carpenter's.
// `woodCost` is the wood spent per day of work on this stage. Earthwork
// stages need none — you don't need timber to clear ground or dig a
// ditch. Wood only enters the track once actual construction starts,
// at Palisade Stakes.
// `failureFlavor` is a small pool of flavor lines used on the rare day
// a stage's work is lost to bad luck (see FORTIFICATION_FAILURE_CHANCE
// and resolveBuildPalisade). Quick placeholder set — to be refined in
// a design chat; do not treat these numbers/lines as locked.
const FORTIFICATION_STAGES = [
  {
    name: "Bailey Grounds", cost: 3, skill: "Fossier", woodCost: 0,
    doneLabel: "the bailey grounds are cleared",
    failureFlavor: [
      "the ground turned out stonier than it looked — the clearing work was lost to it",
      "a sudden downpour turned the cleared patch back to mud and root-tangle overnight"
    ]
  },
  {
    name: "Motte Ditch", cost: 6, skill: "Fossier", woodCost: 0,
    doneLabel: "the motte ditch is dug",
    failureFlavor: [
      "the ditch wall collapsed back in on itself before it could be shored up",
      "they struck rock a foot down and had to abandon the day's cut entirely"
    ]
  },
  {
    name: "Palisade Stakes", cost: 8, skill: "Carpenter", woodCost: 3,
    doneLabel: "the palisade stakes are raised",
    failureFlavor: [
      "the timber split wrong under the axe — a day's stakes, ruined",
      "the ground here won't hold a stake true; the line had to be pulled and restarted"
    ]
  },
  {
    name: "Bridgeway", cost: 6, skill: "Carpenter", woodCost: 3,
    doneLabel: "the bridgeway is set",
    failureFlavor: [
      "the crossbeam cracked under its own weight before it was even seated",
      "the footing gave way in the wet ground and the half-built span had to be torn out"
    ]
  },
  {
    name: "Ramparts", cost: 12, skill: "Carpenter", woodCost: 3,
    doneLabel: "the ramparts stand",
    failureFlavor: [
      "a section of packed earth slumped overnight, undoing days of building",
      "green timber warped in the heat and had to be pulled and replaced"
    ]
  },
  {
    name: "Watchtower", cost: 15, skill: "Carpenter", woodCost: 3,
    doneLabel: "the watchtower is raised",
    failureFlavor: [
      "a support beam proved rotten at the core and the frame had to come back down",
      "high winds took the half-built frame apart before it could be braced"
    ]
  }
];

// Flat per-attempt chance that a day of Fortification labor is lost
// entirely to bad luck (rot, weather, bad ground) instead of
// contributing man-days. Quick placeholder — same chance at every
// stage/tier for now. To be refined (per-stage odds, skill mitigation,
// etc.) in a design chat; not a locked number.
const FORTIFICATION_FAILURE_CHANCE = 0.1;


// ---------------------------------------------
// CHARACTER GENERATION
// ---------------------------------------------

// Picks 5 unique names from the pool so no two settlers share a name.
function pickUniqueNames(count) {
  const shuffled = [...NAME_POOL].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Skills are rolled independently per settler — overlaps
// and gaps are allowed on purpose. A settlement with two
// Master Cooks and no Man-at-Arms is a valid (and interesting) outcome.
function rollSkill() {
  const index = Math.floor(Math.random() * ALL_SKILLS.length);
  return ALL_SKILLS[index];
}

// Rolls a Secondary skill, guaranteed different from the given
// Primary skill. Every character has exactly one Primary and one
// Secondary skill, fully random pairing — they don't need to relate
// narratively (e.g. a Master Cook can roll Man-at-Arms as Secondary).
// With Laborer retired, no role needs special-casing out of this pool.
function rollSecondarySkill(primarySkill) {
  const options = ALL_SKILLS.filter(skill => skill !== primarySkill);
  const index = Math.floor(Math.random() * options.length);
  return options[index];
}

// Picks one backstory sentence matching the given skill.
function pickBackstory(skill) {
  const options = BACKSTORY_POOL[skill];
  const index = Math.floor(Math.random() * options.length);
  return options[index];
}

// Rolls the starting supplies a candidate brings with them, tied to
// their skill. See design-rationale.md for why this is per-candidate.
// Gatherer/Hewer/Fossier get modest ranges of their own now that
// Laborer (the old two-resource generalist) is retired.
function rollStartingSupplies(skill) {
  const supplyRanges = {
    "Master Cook": { rations: [3, 6] },
    Veneur: { rawFood: [2, 5] },
    Carpenter: { wood: [2, 5] },
    "Man-at-Arms": { weapons: [1, 3] },
    Gatherer: { forageFood: [2, 4] },
    Hewer: { wood: [1, 3] },
    Fossier: { rations: [1, 3] }
  };

  const ranges = supplyRanges[skill] || {};
  const supplies = {};
  for (const resource in ranges) {
    const [min, max] = ranges[resource];
    supplies[resource] = min + Math.floor(Math.random() * (max - min + 1));
  }
  return supplies;
}

// Builds one settler object. Every settler has a Primary skill
// (labeled on the card, drives the best yield tier) and a Secondary
// skill (shown smaller/unlabeled underneath, drives a moderate tier
// on whichever task it matches). See design-rationale.md.
function createSettler(name) {
  const skill = rollSkill();
  const secondarySkill = rollSecondarySkill(skill);
  return {
    id: name.toLowerCase(),
    name: name,
    skill: skill,                      // Primary skill
    secondarySkill: secondarySkill,    // Secondary skill
    backstory: pickBackstory(skill),
    alive: true,
    currentTask: null,  // assigned once the day simulation exists
    position: "campsite", // everyone starts safe, at the campsite
    suppliesBrought: rollStartingSupplies(skill), // what this candidate adds if chosen
    daysWithoutFood: 0,  // 0 = fine, 1 = hungry, 2 = starving, 3 = dead
    armed: true // placeholder — see design-rationale.md
  };
}

// Builds the full starting roster of five settlers
// and returns it as an array, ready to drop into gameState.characters.
function generateSettlers() {
  const names = pickUniqueNames(5);
  return names.map(createSettler);
}


// ---------------------------------------------
// VANGUARD SELECTION
// Before the day loop starts, the player is shown a pool of
// candidate men and picks exactly 5 to form the vanguard.
// A limited number of rerolls lets the player regenerate
// whichever candidates they haven't already picked.
// ---------------------------------------------

const CANDIDATE_POOL_SIZE = 8;
const MAX_REROLLS = 3;

let candidatePool = [];   // the current list of choosable men
let selectedIds = [];     // ids of candidates the player has picked
let rerollsRemaining = MAX_REROLLS;

// Builds a fresh pool of candidate men. Uses the same
// createSettler building block as the old direct-generation path.
function generateCandidatePool(count) {
  const names = pickUniqueNames(count);
  return names.map(createSettler);
}

// Renders the candidate pool as clickable cards.
// Turns a candidate's suppliesBrought object into a short readable
// line for their card, e.g. "Brings: 4 rations"
function formatSupplies(supplies) {
  const labels = {
    rations: "rations",
    rawFood: "raw food",
    forageFood: "forage food",
    wood: "wood",
    weapons: "weapons"
  };
  const parts = Object.keys(supplies).map(key => `${supplies[key]} ${labels[key]}`);
  return `Brings: ${parts.join(", ")}`;
}

function renderCandidatePool() {
  const container = document.getElementById("candidatePool");
  container.innerHTML = "";

  candidatePool.forEach(candidate => {
    const isSelected = selectedIds.includes(candidate.id);
    const card = document.createElement("div");
    card.className = isSelected ? "candidate selected" : "candidate";
    const secondaryLine = `<div class="secondary-skill">${candidate.secondarySkill}</div>`;
    card.innerHTML = `
      <div class="name">${candidate.name}</div>
      <div class="skill">${candidate.skill}</div>
      ${secondaryLine}
      <div class="backstory">${candidate.name}, ${candidate.backstory}</div>
      <div class="supplies">${formatSupplies(candidate.suppliesBrought)}</div>
    `;
    card.addEventListener("click", () => toggleCandidateSelection(candidate.id));
    container.appendChild(card);
  });

  document.getElementById("selectionInstructions").textContent =
    `Choose 5 men for the vanguard. Selected: ${selectedIds.length} / 5.`;

  document.getElementById("rerollCount").textContent =
    `Rerolls remaining: ${rerollsRemaining}`;

  document.getElementById("rerollBtn").disabled = rerollsRemaining === 0;
  document.getElementById("confirmVanguardBtn").disabled = selectedIds.length !== 5;
}

// Adds or removes a candidate from the selection when clicked.
// Selection is capped at 5 — clicking a 6th candidate does nothing
// until the player deselects one first.
function toggleCandidateSelection(candidateId) {
  if (selectedIds.includes(candidateId)) {
    selectedIds = selectedIds.filter(id => id !== candidateId);
  } else if (selectedIds.length < 5) {
    selectedIds.push(candidateId);
  }
  renderCandidatePool();
}

// Rerolls only the candidates the player has NOT selected —
// picked men stay locked in. Costs one of the limited rerolls.
function rerollCandidates() {
  if (rerollsRemaining === 0) return;

  const keptCandidates = candidatePool.filter(c => selectedIds.includes(c.id));
  const rerollCount = CANDIDATE_POOL_SIZE - keptCandidates.length;

  const usedNames = keptCandidates.map(c => c.name);
  const freshCandidates = generateFreshCandidates(rerollCount, usedNames);

  candidatePool = [...keptCandidates, ...freshCandidates];
  rerollsRemaining -= 1;

  renderCandidatePool();
}

// Generates new candidates while avoiding name collisions
// with names already in play (the kept candidates).
function generateFreshCandidates(count, excludeNames) {
  const availableNames = NAME_POOL.filter(n => !excludeNames.includes(n));
  const shuffled = [...availableNames].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(createSettler);
}

// Called when the player confirms their 5 chosen men.
// Moves the selected candidates into gameState, adds up what they
// brought with them into the starting resource pool, and starts the game.
function confirmVanguard() {
  const chosen = candidatePool.filter(c => selectedIds.includes(c.id));
  gameState.characters = chosen;

  applyStartingSupplies(chosen);

  document.getElementById("selectionScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  renderResources();
  renderRoster();
  updateStartDayAvailability();
}

// Sums up what the chosen vanguard brought with them and adds it
// to the starting resource pool. Replaces the old fixed starting
// amounts — what you bring now depends entirely on who you picked.
function applyStartingSupplies(chosenCharacters) {
  chosenCharacters.forEach(character => {
    const supplies = character.suppliesBrought;
    for (const resource in supplies) {
      gameState.resources[resource] += supplies[resource];
    }
  });
}


// ---------------------------------------------
// DISPLAY
// Rendering is kept separate from simulation logic.
// This function only reads gameState — it never changes it
// (task changes happen in handleTaskChange, triggered by the dropdown).
// ---------------------------------------------
function renderRoster() {
  const container = document.getElementById("roster");
  container.innerHTML = "";

  gameState.characters.forEach(character => {
    const card = document.createElement("div");
    card.className = character.alive ? "character" : "character deceased";

    if (character.alive) {
      const stage = hungerStage(character);
      const hungerTag = stage ? `<div class="hunger-tag ${stage}">${stage}</div>` : "";
      const secondaryLine = `<div class="secondary-skill">${character.secondarySkill}</div>`;

      card.innerHTML = `
        <div class="name">${character.name}</div>
        <div class="skill">${character.skill}</div>
        ${secondaryLine}
        ${hungerTag}
        <div class="backstory">${character.name}, ${character.backstory}</div>
        <div class="task-row">
          <label>Task: </label>
          <select data-character-id="${character.id}">
            <option value="">-- assign a task --</option>
            ${TASK_POOL.map(task =>
              `<option value="${task}">${taskDisplayLabel(task)}</option>`
            ).join("")}
          </select>
        </div>
      `;
    } else {
      card.innerHTML = `
        <div class="name">${character.name} — dead</div>
        <div class="backstory">${character.name}, ${character.backstory}</div>
      `;
    }

    container.appendChild(card);
  });

  // Wire up dropdowns only for characters still alive.
  container.querySelectorAll("select").forEach(dropdown => {
    dropdown.addEventListener("change", handleTaskChange);
  });
}

// Called whenever a player picks a task from a dropdown.
// Updates the matching character's currentTask in gameState,
// then checks whether every settler now has an assignment.
// Fires when a task dropdown changes for a given settler. Updates
// that settler's assignment in gameState, then re-checks whether
// the Start Day button should be enabled.
function handleTaskChange(event) {
  const characterId = event.target.getAttribute("data-character-id");
  const chosenTask = event.target.value;

  const character = gameState.characters.find(c => c.id === characterId);
  character.currentTask = chosenTask || null;

  updateStartDayAvailability();
}

// Enables the Start Day button only once every living vanguard
// member has a task assigned. Shows a status message either way.
function updateStartDayAvailability() {
  const button = document.getElementById("startDayBtn");
  const status = document.getElementById("assignmentStatus");

  const unassignedCount = gameState.characters.filter(
    c => c.alive && !c.currentTask
  ).length;

  if (unassignedCount === 0) {
    button.disabled = false;
    status.textContent = "All of the vanguard is assigned. Ready to start the day.";
  } else {
    button.disabled = true;
    status.textContent = `${unassignedCount} of the vanguard still need${unassignedCount === 1 ? "s" : ""} a task.`;
  }
}

// ---------------------------------------------
// DAY SIMULATION
// Each function here resolves ONE task for ONE character
// and returns a log line describing what happened.
// None of these touch the DOM — display reads gameState after.
// ---------------------------------------------

// Maps each skill-gated task to the skill that's considered a
// match for it. Used by getSkillTier() to figure out whether a
// character's Primary or Secondary skill applies to a given task.
// Per the locked Role→task table (barbarians-design-doc-characters-
// 20260721.md): Woodcutting→Hewer, Forage→Gatherer, Hunt/Scout stay
// with Veneur (Scout's Veneur+Man-at-Arms combo is untouched by 1b —
// Outrider is tabled, blocked on Threat). Build Palisade's skill is
// resolved per-stage instead (see FORTIFICATION_STAGES), so it has
// no flat entry here.
const SKILL_FOR_TASK = {
  "Woodcutting": "Hewer",
  "Hunt": "Veneur",
  "Cook": "Master Cook",
  "Forage": "Gatherer",
  "Scout": "Veneur"     // unchanged — Outrider is tabled, see design doc
};

// Tasks where a SECOND skill also counts as "primary", alongside
// whatever SKILL_FOR_TASK says (or, for Perimeter Watch, as the
// only primary skill — Watch has no SKILL_FOR_TASK entry at all).
// Man-at-Arms reads terrain and threat the way a Veneur reads game —
// different training, same practical result on these two tasks.
const SECONDARY_PRIMARY_TASK_SKILLS = {
  "Perimeter Watch": "Man-at-Arms",
  "Scout": "Man-at-Arms"
};

// ---------------------------------------------
// SKILL TIER RESOLUTION
//
// Every skill-gated task has three possible tiers: "primary" (best),
// "secondary" (moderate — this character's Secondary skill happens
// to match), and "base" (no match at all — the character has no
// training relevant to this task).
//
// As of 1b, WHAT each tier actually means mechanically is no longer
// flat across every task — it depends on the task's skill weight
// (see barbarians-design-doc-characters-20260721.md, Task Skill-
// Weight Model). getSkillTier() only answers "which of the three
// tiers applies" — each resolver (resolveHunt, resolveCook, etc.)
// decides how big a gap that tier implies for its own task. This is
// the load-bearing change in 1b: previously every task read the same
// tier into the same shape of numeric gap; now Hunt's "base" tier
// and Cook's "base" tier can (and do) mean very different things.
//
// Resolution order (first match wins):
//   1. Primary skill matches this task -> "primary" tier.
//   2. Secondary skill matches this task -> "secondary" tier.
//   3. No match -> "base" tier.
// ---------------------------------------------
function getSkillTier(character, task) {
  // Build Palisade is a special case: which skill counts as "primary"
  // changes depending on which Fortification stage is currently
  // active (earthwork stages favor Fossier, timber stages favor
  // Carpenter) — see FORTIFICATION_STAGES' `skill` field. Every other
  // task uses the flat SKILL_FOR_TASK lookup below.
  const matchingSkill = task === "Build Palisade"
    ? currentFortificationSkill()
    : SKILL_FOR_TASK[task];
  const altPrimarySkill = SECONDARY_PRIMARY_TASK_SKILLS[task] || null;

  if (!matchingSkill && !altPrimarySkill) return "base"; // task has no skill mapping at all

  if (matchingSkill && character.skill === matchingSkill) return "primary";
  if (altPrimarySkill && character.skill === altPrimarySkill) return "primary";
  if (matchingSkill && character.secondarySkill === matchingSkill) return "secondary";
  return "base";
}

// Which skill is "primary" for whichever Fortification stage is
// currently active. Returns null once the whole track is complete
// (no stage left to match against).
function currentFortificationSkill() {
  const stage = FORTIFICATION_STAGES[gameState.fortification.stageIndex];
  return stage ? stage.skill : null;
}

// ---------------------------------------------
// YIELD ROLLING
// Shared helpers for tasks that produce a resource in a range
// rather than a fixed amount. See design-rationale.md.
// ---------------------------------------------

// Rolls a yield within [min, max] inclusive.
function rollYield(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

// Picks a flavor-text quality tier based on where the roll landed
// in its possible range, so the player gets a sense of "that went
// badly" or "that went great" rather than just a number.
function yieldQualityTier(amount, min, max) {
  if (amount === 0) return "nothing";
  const range = max - min || 1;
  const position = (amount - min) / range; // 0 to 1
  if (position < 0.34) return "poor";
  if (position < 0.7) return "average";
  return "great";
}

// Picks the [min, max] yield range for a character on a given task,
// based on their skill tier (primary/secondary/base). Each task
// resolver defines its own three ranges and calls this to select
// the right one — keeps the three-tier logic in one place instead
// of repeated per task.
function rangeForTier(tier, ranges) {
  return ranges[tier];
}


// Woodcutting: High-skill weight (Hewer). A Hewer reliably gets good
// wood from a tree; anyone else genuinely struggles to fell and work
// one cleanly — base tier's range is wide and low, reflecting real
// untrained difficulty, not a modest penalty. See design-rationale.md.
function resolveWoodcutting(character) {
  const tier = getSkillTier(character, "Woodcutting");
  const ranges = {
    primary: [4, 7],
    secondary: [2, 4],
    base: [0, 2]
  };
  const [min, max] = rangeForTier(tier, ranges);

  if (gameState.environment.treesRemainingNearby === 0) {
    return `${character.name} searched nearby but found no trees left standing — the camp will need to scout further afield.`;
  }

  const logs = rollYield(min, max);
  const qualityTier = yieldQualityTier(logs, min, max);
  gameState.environment.treesRemainingNearby -= 1;
  gameState.resources.wood += logs;

  const flavor = {
    nothing: `${character.name} felled a tree but the wood was rotten through — nothing usable came of it.`,
    poor: `${character.name} felled a tree and managed only ${logs} rough logs from it.`,
    average: `${character.name} felled a tree and worked it into ${logs} logs.`,
    great: `${character.name} felled a tree and made unusually good use of it — ${logs} solid logs.`
  };
  return flavor[qualityTier];
}

// Build Palisade: man-day accounting against the Fortification track's
// locked stage costs (see FORTIFICATION_STAGES). Skill tier changes how
// many man-days a character contributes in a day — it does not roll
// Earthwork stages (Bailey Grounds, Motte Ditch): no-skill weight per
// the locked model — "anyone can dig a ditch." A Fossier's presence
// doesn't raise yield the way a Carpenter's does on timber stages; it
// lowers the odds and severity of a rough day. Three-outcome severity
// band per day of work, rather than one flat pass/fail roll:
//   - Minor: full man-day contributed, flavor only.
//   - Partial: half man-day contributed — real but reduced progress.
//   - Lost day: 0 man-days — the day is a genuine loss (wood, if any,
//     was already spent by the caller before this runs).
// Fossier (primary) sits mostly in Minor, rarely Partial, almost
// never Lost. No Fossier (base) sees meaningfully more Partial/Lost,
// but Lost stays the rare tail — a tax, never a blocker, per the
// locked "no-skill tasks are competent-by-default" principle.
const EARTHWORK_SEVERITY_ODDS = {
  primary:   { partial: 0.12, lost: 0.03 },  // Fossier
  secondary: { partial: 0.22, lost: 0.07 },  // Fossier as Secondary
  base:      { partial: 0.30, lost: 0.12 }   // no Fossier at all
};

const EARTHWORK_MINOR_FLAVOR = [
  "fought rocky soil most of the day but still got the work moved forward",
  "kept the pace steady despite the mud, and the line advanced",
  "put in a long, unremarkable day at the ditch — solid progress for it"
];
const EARTHWORK_PARTIAL_FLAVOR = [
  "the ground turned stubborn halfway through — {name}'s work slowed to a crawl, but some progress held",
  "a root tangle ate half the day before {name} could work around it",
  "{name} lost the morning to standing water in the cut, and only the afternoon's work counted for much"
];
const EARTHWORK_LOST_FLAVOR = [
  "the wall gave out before it could be shored — a full day's work, undone",
  "they struck rock a foot down and had to abandon the day's cut entirely",
  "a sudden downpour turned the day's clearing back to mud and root-tangle overnight"
];

function resolveEarthworkDay(character, tier, stage) {
  const odds = EARTHWORK_SEVERITY_ODDS[tier];
  const roll = Math.random();
  const verb = stage.name === "Bailey Grounds" ? "clearing" : "ditch";

  if (roll < odds.lost) {
    const line = EARTHWORK_LOST_FLAVOR[Math.floor(Math.random() * EARTHWORK_LOST_FLAVOR.length)];
    return { manDays: 0, line: `${character.name} — ${line}.` };
  }
  if (roll < odds.lost + odds.partial) {
    const template = EARTHWORK_PARTIAL_FLAVOR[Math.floor(Math.random() * EARTHWORK_PARTIAL_FLAVOR.length)];
    return { manDays: 0.5, line: template.replace(/{name}/g, character.name).replace(/^./, c => c.toUpperCase()) + "." };
  }
  const line = EARTHWORK_MINOR_FLAVOR[Math.floor(Math.random() * EARTHWORK_MINOR_FLAVOR.length)];
  return { manDays: 1, line: `${character.name} ${line} at the ${verb}.` };
}

// for success/failure on its own. Timber stages (Carpenter, high-
// skill weight) keep the existing man-days-per-tier shape: 1 / 0.75 /
// 0.5 man-days per day, tuned so a single Seasoned worker takes
// roughly the stage's full listed cost in days, not a fraction of it.
//
// Earthwork stages (Fossier, no-skill weight) use a DIFFERENT shape —
// see resolveEarthworkDay below — because "no-skill" per the locked
// weight model means competent-by-default, not a yield gap. Fossier's
// bonus is delay-avoidance, not extra man-days per day.
function resolveBuildPalisade(character) {
  const tier = getSkillTier(character, "Build Palisade");
  const fort = gameState.fortification;
  const stage = FORTIFICATION_STAGES[fort.stageIndex];

  // Track is already fully complete — nothing left to build.
  if (!stage) {
    return `${character.name} looked over the finished works but found nothing left to add.`;
  }

  // Wood cost is per-stage (see FORTIFICATION_STAGES) — earthwork
  // stages (Bailey Grounds, Motte Ditch) cost none, so this check is
  // a no-op there and never blocks digging for lack of timber.
  const woodCost = stage.woodCost;
  if (gameState.resources.wood < woodCost) {
    return `${character.name} had no wood left to work with and made no progress on the ${stage.name.toLowerCase()}.`;
  }

  gameState.resources.wood -= woodCost;

  const isEarthworkStage = stage.skill === "Fossier";
  let manDaysContributed;
  let earlyReturnLine = null;

  if (isEarthworkStage) {
    const result = resolveEarthworkDay(character, tier, stage);
    manDaysContributed = result.manDays;
    earlyReturnLine = result.line;
  } else {
    // Quick placeholder failure roll for timber stages — see
    // FORTIFICATION_FAILURE_CHANCE. On a failure, wood is still spent
    // (the attempt was made) but no man-days are contributed this
    // trip. Not stage-progress-destructive — just a lost day. To be
    // refined in a design chat (per-stage odds, whether failure
    // should ever claw back existing progress).
    if (Math.random() < FORTIFICATION_FAILURE_CHANCE) {
      const lines = stage.failureFlavor;
      return `${character.name} — ${lines[Math.floor(Math.random() * lines.length)]}.`;
    }
    const manDaysByTier = { primary: 1, secondary: 0.75, base: 0.5 };
    manDaysContributed = manDaysByTier[tier];
  }

  // Earthwork's Lost-day outcome contributes 0 man-days and needs its
  // own flavor line returned directly — it isn't a stage completion
  // and shouldn't fall through to the standard "work continues" text.
  // Minor/Partial (manDays > 0) still need to check for stage
  // completion below, same as any other day of progress.
  if (isEarthworkStage && manDaysContributed === 0) {
    return earlyReturnLine;
  }

  fort.daysRemaining -= manDaysContributed;

  // Stage complete — advance to the next one and carry over any
  // leftover man-days contributed this trip (e.g. a Seasoned worker
  // who finishes a stage with effort to spare starts the next stage
  // ahead, rather than that labor being wasted).
  let stageJustCompleted = null;
  if (fort.daysRemaining <= 0) {
    stageJustCompleted = stage;
    const overflow = -fort.daysRemaining; // how much past zero we went
    fort.stageIndex += 1;
    const nextStage = FORTIFICATION_STAGES[fort.stageIndex];
    fort.daysRemaining = nextStage ? nextStage.cost - overflow : 0;
    if (nextStage && fort.daysRemaining < 0) fort.daysRemaining = 0;
    fort.hasAnnouncedStart = false; // new stage — "just begun" can fire once more
  }

  if (stageJustCompleted) {
    const nextStage = FORTIFICATION_STAGES[fort.stageIndex];
    const nextLine = nextStage
      ? ` Work can now begin on the ${nextStage.name.toLowerCase()}.`
      : ` There is nothing left to build — the works are complete.`;
    return `${character.name} finished the work: ${stageJustCompleted.doneLabel}.${nextLine}`;
  }

  if (isEarthworkStage) return earlyReturnLine;

  return buildPalisadeFlavor(character, tier, stage, fort);
}

// Flavor text for a day of Build Palisade work that didn't complete a
// stage. Communicates remaining effort through character voice, never
// a number or percentage — per the locked "no progress bars, ever"
// principle. Buckets remaining man-days into rough qualitative bands
// per stage so text stays true regardless of how big the stage's total
// cost is.
//
// Updated 2026-07-21: takes the fort state object (not just
// daysRemaining) so it can read/set hasAnnouncedStart. "Work has only
// just begun" now fires once per stage — the first day worked while
// still above the 66% threshold — then falls through to the standard
// "coming along" phrasing for the rest of that band, instead of
// repeating every day the stage sits above 66% remaining.
function buildPalisadeFlavor(character, tier, stage, fort) {
  const daysRemaining = fort.daysRemaining;
  const fractionLeft = daysRemaining / stage.cost;

  let stageDescriptor;
  if (fractionLeft > 0.66) {
    if (!fort.hasAnnouncedStart) {
      stageDescriptor = `the ${stage.name.toLowerCase()} work has only just begun`;
      fort.hasAnnouncedStart = true;
    } else {
      stageDescriptor = `the ${stage.name.toLowerCase()} work continues`;
    }
  } else if (fractionLeft > 0.33) {
    stageDescriptor = `the ${stage.name.toLowerCase()} work is coming along, but there's a fair way to go`;
  } else {
    stageDescriptor = `the ${stage.name.toLowerCase()} work is nearly finished`;
  }

  // Only called for timber stages now — earthwork stages resolve
  // entirely through resolveEarthworkDay and return before reaching
  // here (see resolveBuildPalisade). No branch needed for earthwork.
  if (tier === "primary") {
    return `${character.name} squared the timbers and set them true, working steadily — ${stageDescriptor}.`;
  }
  if (tier === "secondary") {
    return `${character.name} made decent progress, though the line isn't as clean as a trained hand would leave it — ${stageDescriptor}.`;
  }
  return `${character.name} wrestled the logs into place, gaps and all, slow and uneven — ${stageDescriptor}.`;
}

// Updated 2026-07-21: game description now scales WITH the actual
// yield instead of being picked independently — previously `catch_`
// was rolled from the full list regardless of `rawYield`, so a
// "young boar" (should be a big haul) could show up next to "2
// portions" while "a brace of pheasant" (should be small) could show
// up next to "6 portions" — animal size and stated yield contradicted
// each other. GAME_BY_YIELD below buckets the catch description to
// match the actual number rolled.
//
// Also drops the redundant portion-count restatement — Hunt no
// longer says "N portions" in its own line, since Master Cook's output
// the same day already states the ration count derived from that raw
// food (see resolveCook). Saying the number twice in one day's log,
// once as "portions" and again as "rations," read as the game
// repeating itself rather than describing two different things.
// Hunt now just describes the catch; Master Cook is where the number lives.
const GAME_BY_YIELD = [
  { max: 1, options: ["a hare", "a handful of squirrels"] },
  { max: 3, options: ["a brace of pheasant", "a couple of rabbits"] },
  { max: 5, options: ["a young boar", "a good-sized doe"] },
  { max: Infinity, options: ["a full-grown stag", "a big boar, well fed"] }
];

function describeCatch(rawYield) {
  const bucket = GAME_BY_YIELD.find(b => rawYield <= b.max);
  const options = bucket.options;
  return options[Math.floor(Math.random() * options.length)];
}

// Hunt: High-skill weight (Veneur). Untrained hunting is genuinely
// unreliable — base tier whiffs often, reflecting real difficulty
// rather than a modest penalty. See design-rationale.md.
function resolveHunt(character) {
  const tier = getSkillTier(character, "Hunt");
  const ranges = {
    primary: [3, 7],
    secondary: [1, 4],
    base: [0, 2]
  };
  const [min, max] = rangeForTier(tier, ranges);

  const rawYield = rollYield(min, max);
  gameState.resources.rawFood += rawYield;

  if (rawYield === 0) {
    return `${character.name} tracked game for hours without a clean shot — nothing came of it.`;
  }

  // qualityTier is computed after the zero-check above, since
  // yieldQualityTier's "nothing" case is already handled by the
  // early return — flavor below only ever needs poor/average/great.
  const qualityTier = yieldQualityTier(rawYield, min, max);
  const catch_ = describeCatch(rawYield);

  const flavor = {
    poor: `${character.name} took ${catch_}, little else worth the effort.`,
    average: `${character.name} brought down ${catch_}.`,
    great: `${character.name} took ${catch_} — a strong day's hunting.`
  };
  return flavor[qualityTier] || `${character.name} brought down ${catch_}.`;
}

// Cook task: Low-skill, conversion-based weight (Master Cook). Per
// the locked Cook Conversion Table, the rate is a ROLLED RANGE per
// tier, not a fixed multiplier — a flat number is something a player
// would optimize around, which breaks "skill shifts odds, never
// guarantees outcomes." A Master Cook is usually good and can have a
// genuinely great day; a Base-tier cook is usually mediocre and can
// have a genuinely wasteful one. Converts raw food into rations and
// forage food into rations at 2:1; does both in the same day if
// available. See design-rationale.md.
const COOK_CONVERSION_RANGE = {
  primary: [1.3, 1.8],    // Master Cook — usually good, occasionally excellent
  secondary: [0.9, 1.1],  // reliable, roughly break-even
  base: [0.4, 0.6]        // inconsistent, meaningfully wasteful
};

function rollConversionRate(tier) {
  const [min, max] = COOK_CONVERSION_RANGE[tier];
  return min + Math.random() * (max - min);
}

function resolveCook(character) {
  const tier = getSkillTier(character, "Cook");
  const conversionRate = rollConversionRate(tier);

  const rawFoodAvailable = gameState.resources.rawFood;
  const forageFoodAvailable = gameState.resources.forageFood;

  if (rawFoodAvailable === 0 && forageFoodAvailable === 0) {
    return `${character.name} had nothing to cook and stood idle at the fire.`;
  }

  let rationsProduced = 0;
  const notes = [];

  if (rawFoodAvailable > 0) {
    const fromRaw = Math.floor(rawFoodAvailable * conversionRate);
    rationsProduced += fromRaw;
    gameState.resources.rawFood = 0;
    notes.push(`${fromRaw} from the day's meat`);
  }

  if (forageFoodAvailable > 0) {
    const fromForage = Math.floor(forageFoodAvailable / 2);
    rationsProduced += fromForage;
    gameState.resources.forageFood -= fromForage * 2; // leftover odd unit stays, still edible raw
    gameState.resources.forageFoodAge = 0; // whatever's left just got handled/reset
    if (fromForage > 0) notes.push(`${fromForage} preserved from foraged stores`);
  }

  gameState.resources.rations += rationsProduced;

  const detail = notes.join(" and ");
  if (tier === "primary") {
    return `${character.name} worked the fire all day — ${rationsProduced} rations set aside (${detail}).`;
  }
  if (tier === "secondary") {
    return `${character.name} kept the fire going and did a fair job of it — ${rationsProduced} rations set aside (${detail}).`;
  }
  return `${character.name} tended the fire, though some of it scorched or went to waste — ${rationsProduced} rations set aside (${detail}).`;
}

// Perimeter Watch: no resource output — tracks position for
// the scout wave mechanic (see resolveScoutWave) and now also
// grants a real skill tier (Man-at-Arms is primary here — see
// SECONDARY_PRIMARY_TASK_SKILLS). Tier doesn't change day-to-day
// text much since nothing happens without a raid, but a Man-at-Arms
// watcher reads as more competent even on a quiet day.
function resolvePerimeterWatch(character) {
  character.position = "perimeter";
  const tier = getSkillTier(character, "Perimeter Watch");
  if (tier === "primary") {
    return `${character.name} kept a soldier's watch at the perimeter, eyes on the treeline. No trouble today.`;
  }
  return `${character.name} stood watch at the perimeter. No trouble today.`;
}

// Forage: High-skill weight (Gatherer). Also has a chance of turning
// up more nearby trees, independent of tier — even an untrained
// forager can stumble onto a stand of trees; that's luck, not skill.
// Base tier's yield is deliberately weak and whiff-prone without a
// Gatherer present — per the locked weight model, Forage should not
// be reliable without one. See design-rationale.md.
function resolveForage(character) {
  const tier = getSkillTier(character, "Forage");
  const roll = Math.random();
  const treeFindChance = 0.25;

  if (roll < treeFindChance) {
    const foundTrees = 3 + Math.floor(Math.random() * 4); // 3-6 more trees
    gameState.environment.treesRemainingNearby += foundTrees;
    return `${character.name} ranged out foraging and stumbled onto a stand of ${foundTrees} more trees worth working.`;
  }

  const ranges = {
    primary: [3, 6],
    secondary: [1, 3],
    base: [0, 1]
  };
  const [min, max] = rangeForTier(tier, ranges);
  const foundFood = rollYield(min, max);
  const qualityTier = yieldQualityTier(foundFood, min, max);

  if (foundFood > 0) {
    gameState.resources.forageFood += foundFood;
    gameState.resources.forageFoodAge = 0; // fresh food resets the spoilage clock
  }

  const forageItems = ["wild garlic and roots", "berries and mushrooms", "nuts and dandelion greens", "elderberries and watercress"];
  const item = forageItems[Math.floor(Math.random() * forageItems.length)];

  const flavor = {
    nothing: `${character.name} searched the undergrowth all day and came back empty-handed.`,
    poor: `${character.name} found a handful of ${item} — ${foundFood} portions.`,
    average: `${character.name} brought back ${item}, ${foundFood} portions in all.`,
    great: `${character.name} found ${item} in real abundance — ${foundFood} portions.`
  };
  return flavor[qualityTier];
}

// Scout: Veneur and Man-at-Arms each estimate different stats (days vs.
// count) with different accuracy; both present on the same day is a
// "combo" that guarantees an accurate reading. Runs once per day
// (not per-character) — see resolveScoutForEnemiesForDay, called
// from runDay(). Full reasoning in design-rationale.md.
//
// NOTE: Scout's Veneur/Man-at-Arms accuracy split is its own existing
// mechanic and is intentionally NOT run through getSkillTier()/the
// new Primary/Secondary tiers in this pass — see chat notes. It
// still only checks character.skill directly (Primary), same as
// before.

// Rolls one estimate (count or days). Returns the true value if
// accurate, otherwise a plausible-but-wrong value (over or under).
function rollEstimate(trueValue, accuracyChance, maxSpread) {
  if (Math.random() < accuracyChance) {
    return { value: trueValue, accurate: true };
  }
  const error = 1 + Math.floor(Math.random() * maxSpread);
  const direction = Math.random() < 0.5 ? -1 : 1;
  const wrongValue = Math.max(1, trueValue + (error * direction));
  return { value: wrongValue, accurate: false };
}

// Resolves Scout for the whole day at once. Man-at-Arms and Veneur are
// both valid solo scouts now (see SECONDARY_PRIMARY_TASK_SKILLS) —
// neither requires the other. Sending both together is a bonus
// (guaranteed accurate read), not a requirement to get any read at
// all. This matters for a food-scarce game: a player who always
// needs their Veneur hunting shouldn't be locked out of a working
// Scout — Man-at-Arms alone covers it.
function resolveScoutForEnemiesForDay(scoutingCharacters) {
  if (scoutingCharacters.length === 0) return [];

  const daysUntilWave = gameState.nextWaveDay - gameState.day;
  const forecastCount = 3 + Math.floor(Math.random() * 3); // matches rollOutriderCount's range

  const hasHunter = scoutingCharacters.some(c => c.skill === "Veneur");
  const hasSoldier = scoutingCharacters.some(c => c.skill === "Man-at-Arms");
  const comboActive = hasHunter && hasSoldier;

  const entries = [];

  if (comboActive) {
    gameState.scoutWarning = {
      estimatedDays: daysUntilWave, daysAccurate: true,
      estimatedCount: forecastCount, countAccurate: true
    };
    entries.push(`A raiding party is out there, and this time there's no doubt about it — between tracking and trained instinct, the Veneur and Man-at-Arms together confirmed ${forecastCount} outriders, ${daysUntilWave} day(s) out. Sending both on the same scout was a good call.`);
    return entries;
  }

  // No combo — each scout on the task contributes their own estimate.
  // Flavor text describes what THIS specific roll actually landed on,
  // not a fixed hedge — so the log never contradicts the resource bar.
  scoutingCharacters.forEach(character => {
    const isHunter = character.skill === "Veneur";
    const isSoldier = character.skill === "Man-at-Arms";

    const daysAccuracy = isHunter ? 0.8 : (isSoldier ? 0.6 : 0.3);
    const countAccuracy = isSoldier ? 0.8 : (isHunter ? 0.45 : 0.3);
    // Man-at-Arms's day-estimate miss is capped at "off by one" (maxSpread
    // 1) rather than the wider miss everyone else risks (maxSpread 2)
    // — a soldier reading enemy movement judges timing closely even
    // when he's not dead-on. Everyone else keeps the wider miss.
    const daysMaxSpread = isSoldier ? 1 : 2;

    const daysEstimate = rollEstimate(daysUntilWave, daysAccuracy, daysMaxSpread);
    const countEstimate = rollEstimate(forecastCount, countAccuracy, 2);

    gameState.scoutWarning = {
      estimatedDays: daysEstimate.value, daysAccurate: daysEstimate.accurate,
      estimatedCount: countEstimate.value, countAccurate: countEstimate.accurate
    };

    // Each stat gets its own confident/uncertain phrasing, kept as
    // explicit pairs rather than patched strings — easier to read,
    // easier to extend later.
    const confidentDays = `confident it's ${daysEstimate.value} day(s) before they show`;
    const uncertainDays = `couldn't pin down how soon they'll arrive, but it won't be far off`;
    const confidentCount = `certain there are ${countEstimate.value} of them`;
    const uncertainCount = `couldn't get a solid count`;

    if (isHunter) {
      const days = daysEstimate.accurate ? confidentDays : uncertainDays;
      const count = countEstimate.accurate ? "though the exact number's hard to judge from sign alone" : "and the size of the group is anyone's guess";
      entries.push(`${character.name} found signs of a raiding party moving through the country — ${days}, ${count}.`);
    } else if (isSoldier) {
      const count = countEstimate.accurate ? confidentCount : uncertainCount;
      const days = daysEstimate.accurate ? "and it looks like it'll be soon" : "though he'd stake his read within a day either way";
      entries.push(`${character.name} spotted a raiding party and sized them up — ${count}, ${days}.`);
    } else {
      entries.push(`${character.name} scouted for signs of trouble but has no real training for this — whatever he saw, the read is little better than a guess.`);
    }
  });

  return entries;
}

// Routes a character to the correct resolver based on their task.
// Note: "Scout" is deliberately NOT routed through here —
// it's resolved once per day for all scouts at once, from runDay(),
// since the Veneur+Man-at-Arms combo needs to see the full day's assignments.
function resolveCharacterTask(character) {
  switch (character.currentTask) {
    case "Build Palisade": return resolveBuildPalisade(character);
    case "Hunt": return resolveHunt(character);
    case "Cook": return resolveCook(character);
    case "Perimeter Watch": return resolvePerimeterWatch(character);
    case "Woodcutting": return resolveWoodcutting(character);
    case "Forage": return resolveForage(character);
    case "Scout": return null; // handled separately, see resolveScoutForEnemiesForDay
    default: return `${character.name} had no task and did nothing today.`;
  }
}

// Forage food spoils if it sits unused for 2 days. Age resets to 0
// whenever fresh forage food is gathered or cooked into rations
// (see resolveForage and resolveCook). Runs once per day, before
// consumption, so spoiled food is never "eaten" first.
function applyForageSpoilage() {
  if (gameState.resources.forageFood === 0) return null;

  gameState.resources.forageFoodAge += 1;

  if (gameState.resources.forageFoodAge >= 2) {
    const lost = gameState.resources.forageFood;
    gameState.resources.forageFood = 0;
    gameState.resources.forageFoodAge = 0;
    return `The foraged food store went bad before it could be used — ${lost} portions lost to spoilage.`;
  }

  return null;
}

// Feeds settlers in order of longest-without-food first. Draws from
// forageFood before rations. Unfed settlers advance one hunger stage.
function applyDailyConsumption() {
  const eatingOrder = gameState.characters
    .filter(c => c.alive)
    .sort((a, b) => b.daysWithoutFood - a.daysWithoutFood);

  let fed = 0;
  let wentHungry = 0;

  eatingOrder.forEach(character => {
    if (gameState.resources.forageFood > 0) {
      gameState.resources.forageFood -= 1;
      character.daysWithoutFood = 0;
      fed += 1;
    } else if (gameState.resources.rations > 0) {
      gameState.resources.rations -= 1;
      character.daysWithoutFood = 0;
      fed += 1;
    } else {
      character.daysWithoutFood += 1;
      wentHungry += 1;
    }
  });

  if (wentHungry === 0) {
    return `Everyone ate today.`;
  }
  return `Food ran short — ${wentHungry} of the vanguard went without food today.`;
}

// 3 consecutive days without food is fatal. 1-2 days show as
// "hungry"/"starving" tags on the character card (see hungerStage).
function checkStarvation() {
  const notes = [];

  gameState.characters
    .filter(c => c.alive && c.daysWithoutFood >= 3)
    .forEach(character => {
      character.alive = false;
      notes.push(`${character.name} did not wake this morning. Three days without food was more than he could bear.`);
    });

  return notes;
}

// Returns a hunger stage label for display, or null if the
// character is fine and nothing needs to be shown.
function hungerStage(character) {
  if (character.daysWithoutFood >= 2) return "starving";
  if (character.daysWithoutFood >= 1) return "hungry";
  return null;
}

// ---------------------------------------------
// SCOUT WAVE
// A scheduled combat event (see nextWaveDay). Resolution depends
// on watch status and palisade progress. Kept separate from the
// daily task resolvers — an event, not a task outcome.
// ---------------------------------------------

// Returns true if ANY living character was assigned Perimeter Watch
// today, regardless of skill. Despite the old name, this was never
// Man-at-Arms-specific — kept as watchPresent() for clarity now that
// Man-at-Arms gets a real bonus ON TOP of this (see soldierOnWatch()
// below). Watch-by-anyone still grants the baseline protections
// (outdoor-worker warning, small fight-back bonus); Man-at-Arms-on-Watch
// grants the bigger fight-back number specifically.
function watchPresent() {
  return gameState.characters.some(
    c => c.alive && c.currentTask === "Perimeter Watch"
  );
}

// Returns true only if the watcher is Man-at-Arms-primary-tier —
// distinct from watchPresent() above.
function soldierOnWatch() {
  return gameState.characters.some(
    c => c.alive && c.currentTask === "Perimeter Watch"
      && getSkillTier(c, "Perimeter Watch") === "primary"
  );
}

// Rolls how many outriders show up (3 to 5).
function rollOutriderCount() {
  return 3 + Math.floor(Math.random() * 3); // 3 to 5
}

// Returns how many outriders the vanguard drove off. Weapons cap
// the damage dealt; whoever's on Watch adds a bonus, bigger if
// that watcher is Man-at-Arms-primary-tier. Weapons no longer have any
// chance of being lost from use — they're durable equipment (matches
// the stated intent in design-rationale.md that was previously
// contradicted by a 20%-per-use loss roll). The ONLY way weapons
// now leave the camp is theft during a raid where the camp was
// caught vulnerable — see resolveResourceRisk.
function resolveFightBack(outriderCount, anyWatcher, soldierWatching) {
  const weapons = gameState.resources.weapons;
  if (weapons === 0) {
    return 0; // nothing to fight back with — the camp can only endure
  }

  // Man-at-Arms-on-Watch: +3. Anyone else on Watch: +1. No watcher: +0.
  const watchBonus = soldierWatching ? 3 : (anyWatcher ? 1 : 0);
  const weaponsAvailable = Math.min(weapons, outriderCount);
  const driven = Math.min(outriderCount, weaponsAvailable + watchBonus);

  return driven;
}

// Base hit chance for a character, before palisade mitigation
// (see palisadeMitigation). Highest for the watcher; scales down
// as more outriders are driven off.
//
// Updated 2026-07-21: now takes soldierWatching, so a Man-at-Arms's
// mechanical edge shows up in personal risk too, not just in
// resolveFightBack's group-level driven-off count. Two spots use it:
//   - The watcher's own risk: a Man-at-Arms standing watch is still the
//     one facing outriders directly (same exposure), but his training
//     means he's meaningfully less likely to actually be hit than an
//     untrained watcher standing the same post.
//   - A warned outdoor worker's risk: called back by a Man-at-Arms's
//     watch specifically is a sharper warning (he reads the land/
//     movement better — same skill that makes his Scout read tighter)
//     than being called back by a non-Man-at-Arms watcher.
function baseHitChance(character, watcherPresent, outridersRemaining, originalCount, soldierWatching) {
  const onWatch = character.currentTask === "Perimeter Watch";
  const pressureRatio = outridersRemaining / originalCount; // fewer attackers left = less danger

  let chance;
  if (onWatch) {
    chance = soldierWatching ? 0.35 : 0.5; // trained watcher, same exposure, better odds
  } else if (watcherPresent) {
    chance = soldierWatching ? 0.03 : 0.05; // warned-by-soldier reads sharper than warned-by-anyone
  } else {
    chance = 0.25;
  }

  return chance * pressureRatio;
}

// How far along the Fortification track the camp is, as a 0-1 fraction
// of total man-days paid off out of the full 50. This is an internal
// number only — never shown to the player (see renderResources) — used
// purely to drive raid mitigation math, same role the old flat percent
// played. NOTE: combat/raid mitigation is otherwise out of scope for
// this session; this function is kept working as-is, just re-pointed
// at the new staged track instead of the old flat percent.
function fortificationProgressFraction() {
  const TOTAL_MAN_DAYS = FORTIFICATION_STAGES.reduce((sum, s) => sum + s.cost, 0); // 50
  const fort = gameState.fortification;

  let daysPaid = 0;
  for (let i = 0; i < fort.stageIndex; i++) {
    daysPaid += FORTIFICATION_STAGES[i].cost;
  }
  const currentStage = FORTIFICATION_STAGES[fort.stageIndex];
  if (currentStage) {
    daysPaid += currentStage.cost - fort.daysRemaining;
  } else {
    daysPaid = TOTAL_MAN_DAYS; // track fully complete
  }

  return Math.min(1, daysPaid / TOTAL_MAN_DAYS);
}

// Palisade progress reduces hit chance (up to 50% at full wall).
function palisadeMitigation(baseChance) {
  const reduction = fortificationProgressFraction() * 0.5; // up to 50% reduction at full wall
  return Math.max(0, baseChance - (baseChance * reduction));
}

// If the camp is vulnerable (no watcher, low palisade), outriders
// loot resources on the way out, in priority order (see lootOrder).
// ALWAYS returns a line now, every raid — theft (or its absence) was
// previously silent whenever the camp wasn't "vulnerable" or had
// nothing left to take, which made it impossible for the player to
// tell "nothing was stolen" from "I just didn't notice the line."
// Weapons can now ONLY be lost this way (see resolveFightBack) — this
// function carries real weight it didn't before.
function resolveResourceRisk(anyWatcher) {
  const campVulnerable = !anyWatcher && fortificationProgressFraction() < 0.30;

  if (!campVulnerable) {
    return "The camp's stores went untouched — nothing was taken in the raid.";
  }

  const lootBudget = 2 + Math.floor(Math.random() * 3); // 2-4 units taken total
  let remaining = lootBudget;
  const takenNotes = [];

  const lootOrder = [
    { key: "weapons", label: "weapons" },
    { key: "rations", label: "rations" },
    { key: "forageFood", label: "portions of foraged food" },
    { key: "rawFood", label: "portions of raw food" }
  ];

  lootOrder.forEach(resource => {
    if (remaining <= 0) return;
    const available = gameState.resources[resource.key];
    const taken = Math.min(available, remaining);
    if (taken > 0) {
      gameState.resources[resource.key] -= taken;
      remaining -= taken;
      takenNotes.push(`${taken} ${resource.label}`);
    }
  });

  if (takenNotes.length === 0) {
    return "Outriders rifled through the camp but found nothing left worth taking.";
  }
  return `In the chaos, outriders made off with ${takenNotes.join(", ")}.`;
}

// Tasks that take a character outside the camp's immediate footprint.
// A manned Watch (anyone, not just Man-at-Arms) warns these characters to
// fall back before a raid lands — they don't get the "caught in the
// open with nothing to defend himself" auto-kill, and roll at the
// unwatched-but-in-camp hit chance instead of full open-ground risk.
// Perimeter Watch itself is not in this list — the watcher is the one
// person who's already braced, not someone who needs warning.
const OUTDOOR_TASKS = ["Hunt", "Forage", "Scout", "Woodcutting"];

// Resolves the scout wave: outriders arrive, the vanguard fights
// back if armed, casualties and resource losses are applied, and
// the whole encounter is logged like a report reaching the player.
function resolveScoutWave() {
  const entries = [];
  const anyWatcher = watchPresent();
  const soldierWatching = soldierOnWatch();
  const outriderCount = rollOutriderCount();

  entries.push(`${outriderCount} outriders were spotted moving through the treeline as the sun dropped.`);

  if (soldierWatching) {
    entries.push("The soldier on watch caught sight of them early and had the camp braced before they closed the distance.");
  } else if (anyWatcher) {
    entries.push("The watch caught sight of them early, giving the camp a chance to brace.");
  } else {
    entries.push("No one was watching the perimeter — they closed in unseen.");
  }

  const driven = resolveFightBack(outriderCount, anyWatcher, soldierWatching);
  // Updated 2026-07-21: no longer floors outridersRemaining at 1. The
  // old Math.max(1, ...) meant that driving off ALL attackers still
  // left 1 "remaining" internally for pressureRatio's math — which
  // silently contradicted the log line saying every attacker was
  // driven off. That's the root of the "5 outriders approached, only
  // 4 driven off, what happened to the 5th?" bug: the 5th wasn't
  // unaccounted for in the text, but the internal math was quietly
  // treating it as still out there. outridersRemaining can now
  // legitimately reach 0, and pressureRatio (outridersRemaining /
  // originalCount) correctly zeroes out remaining danger to anyone
  // not already resolved above — no attackers left means no attackers
  // left, full stop.
  const outridersRemaining = Math.max(0, outriderCount - driven);
  const allDrivenOff = driven >= outriderCount;

  if (allDrivenOff) {
    entries.push(`The vanguard fought back and drove off all ${driven} of them — the raid was repelled outright.`);
  } else if (driven > 0) {
    entries.push(`The vanguard fought back and drove off ${driven} of them.`);
  } else if (gameState.resources.weapons === 0) {
    entries.push("With no weapons on hand, the camp could do nothing but endure the raid.");
  }

  let warnedAnyone = false;

  gameState.characters
    .filter(c => c.alive)
    .forEach(character => {
      const isOutdoors = OUTDOOR_TASKS.includes(character.currentTask);
      // Warned: was outside camp, but a manned Watch (any watcher)
      // called them back before the raid landed. They still face
      // some risk — running back in the dark isn't free — but they
      // are never an automatic kill, and their odds match an
      // unwatched-in-camp character rather than someone caught fully
      // in the open.
      const warned = isOutdoors && anyWatcher;
      // Caught fully in the open: was outside camp AND no one was
      // watching to call them back.
      const caughtInOpen = isOutdoors && !anyWatcher;

      if (warned) warnedAnyone = true;

      // TODO: checks the shared weapons pool, not per-character
      // ownership. See "Known Prototype Shortcuts" in design-rationale.md.
      const noWeaponsAtAll = gameState.resources.weapons === 0;

      if (caughtInOpen && noWeaponsAtAll) {
        character.alive = false;
        entries.push(`${character.name} was caught in the open with nothing to defend himself — he did not survive the night.`);
        return;
      }

      const chance = palisadeMitigation(
        baseHitChance(character, anyWatcher, outridersRemaining, outriderCount, soldierWatching)
      );
      const roll = Math.random();

      if (roll < chance) {
        character.alive = false;
        const cause = caughtInOpen
          ? `${character.name} was caught in the open and did not survive the night.`
          : `${character.name} didn't make it back in time and was caught at the edge of camp.`;
        entries.push(cause);
      }
    });

  if (warnedAnyone) {
    entries.push("The call to fall back reached the fields and treeline in time — those out working the land made it back inside the camp before the worst of it.");
  }

  // Loot outcome always reports, positive or negative, and always
  // sits right here — same slot every wave — so the player can find
  // it without hunting through casualty text. See resolveResourceRisk.
  entries.push(resolveResourceRisk(anyWatcher));

  const survivors = gameState.characters.filter(c => c.alive).length;
  entries.push(`When morning came, ${survivors} of the vanguard remained.`);

  return entries;
}
// Runs one full day: tasks resolve (Scout handled separately as a
// group), then consumption/starvation, then a wave if scheduled,
// then win/loss conditions.
function runDay() {
  const entries = [];

  const scoutingCharacters = gameState.characters.filter(
    c => c.alive && c.currentTask === "Scout"
  );

  gameState.characters
    .filter(c => c.alive && c.currentTask !== "Scout")
    .forEach(character => {
      entries.push(resolveCharacterTask(character));
    });

  entries.push(...resolveScoutForEnemiesForDay(scoutingCharacters));

  const spoilageNote = applyForageSpoilage();
  if (spoilageNote) entries.push(spoilageNote);

  entries.push(applyDailyConsumption());

  const starvationNotes = checkStarvation();
  entries.push(...starvationNotes);

  if (gameState.day === gameState.nextWaveDay) {
    entries.push(...resolveScoutWave());
    gameState.nextWaveDay = rollNextWaveDay(gameState.day);
    gameState.scoutWarning = null; // any warning was for this wave; clear it
  }

  gameState.log.push({ day: gameState.day, entries: entries });

  checkGameOver(entries);

  gameState.day += 1;
}

// Checks whether the game has ended — victory if the palisade is
// fully built, defeat if everyone has died (combat or starvation).
// Appends a closing log line if either condition is met.
function checkGameOver(entries) {
  const survivors = gameState.characters.filter(c => c.alive).length;

  if (survivors === 0) {
    gameState.gameOver = true;
    gameState.outcome = "defeat";
    entries.push("The vanguard is no more. There is no one left to hold this ground.");
    return;
  }

  if (gameState.fortification.stageIndex >= FORTIFICATION_STAGES.length) {
    gameState.gameOver = true;
    gameState.outcome = "victory";
    entries.push("The works stand complete, watchtower and all. The camp is secure — the vanguard has held.");
  }
}

// One-line status for the resource summary bar. No numbers, no percent
// — a qualitative read on which stage is current and roughly how far
// into it the camp is, same banding logic as buildPalisadeFlavor().
function fortificationStatusLine() {
  const fort = gameState.fortification;
  const stage = FORTIFICATION_STAGES[fort.stageIndex];

  if (!stage) return "complete — the works stand finished";

  const fractionLeft = fort.daysRemaining / stage.cost;
  let progressWord;
  if (fractionLeft >= 1) {
    progressWord = "not yet begun";
  } else if (fractionLeft > 0.66) {
    progressWord = "just started";
  } else if (fractionLeft > 0.33) {
    progressWord = "underway";
  } else {
    progressWord = "nearly finished";
  }

  return `${stage.name} (${progressWord})`;
}

// Shows the current resource numbers at the top of the page.
// Read-only view into gameState — never modifies it.
function renderResources() {
  const container = document.getElementById("resourceSummary");
  const r = gameState.resources;
  const e = gameState.environment;

  let warningLine = "";
  if (gameState.scoutWarning) {
    const w = gameState.scoutWarning;
    const countText = w.countAccurate ? `${w.estimatedCount} outriders` : "an uncertain number of outriders";
    const daysText = w.daysAccurate ? `${w.estimatedDays} day(s) out` : "an uncertain distance out";
    warningLine = `<div>⚠ A raiding party is coming: ${countText}, ${daysText}</div>`;
  }

  container.innerHTML = `
    <div>Day: <span>${gameState.day}</span></div>
    <div>Rations: <span>${r.rations}</span></div>
    <div>Raw Food: <span>${r.rawFood}</span></div>
    <div>Forage Food: <span>${r.forageFood}</span></div>
    <div>Wood: <span>${r.wood}</span></div>
    <div>Weapons: <span>${r.weapons}</span></div>
    <div>Trees Left: <span>${e.treesRemainingNearby}</span></div>
    <div>Fortification: <span>${fortificationStatusLine()}</span></div>
    ${warningLine}
  `;
}

// Shows the full day-by-day log, most recent day first.
function renderLog() {
  const container = document.getElementById("dayLog");
  container.innerHTML = "";

  [...gameState.log].reverse().forEach(dayRecord => {
    const entryDiv = document.createElement("div");
    entryDiv.className = "day-entry";
    entryDiv.innerHTML = `
      <div class="day-title">Day ${dayRecord.day}</div>
      <ul>${dayRecord.entries.map(line => `<li>${line}</li>`).join("")}</ul>
    `;
    container.appendChild(entryDiv);
  });
}

// Clears every character's task so the player has to
// reassign for the next day. Keeps assignment deliberate
// rather than carrying over automatically.
function clearAllTasks() {
  gameState.characters.filter(c => c.alive).forEach(c => c.currentTask = null);
}

// Called when the player clicks Start Day. Runs the simulation,
// then refreshes every display and resets assignments for the next day.
function startDay() {
  runDay();
  clearAllTasks();

  renderResources();
  renderLog();
  renderRoster();
  updateStartDayAvailability();
  renderGameOverIfNeeded();
}

// Shows a clear victory/defeat banner once the game has ended,
// and disables further play so the log stands as the final record.
function renderGameOverIfNeeded() {
  if (!gameState.gameOver) return;

  const banner = document.getElementById("gameOverBanner");
  const outcomeText = gameState.outcome === "victory"
    ? "VICTORY — The palisade is complete. The vanguard held the ground."
    : "DEFEAT — The vanguard has fallen.";
  const bannerClass = gameState.outcome === "victory" ? "game-over victory" : "game-over defeat";

  banner.innerHTML = `${outcomeText}<br><button id="resetBtn">Start a New Vanguard</button>`;
  banner.className = bannerClass;
  banner.style.display = "block";

  document.getElementById("resetBtn").addEventListener("click", () => location.reload());
  document.getElementById("startDayBtn").disabled = true;
}


// ---------------------------------------------
// START
// The game now begins on the selection screen. The actual
// game (resources, roster, day loop) only initializes once
// the player confirms their 5 chosen men in confirmVanguard().
// ---------------------------------------------
candidatePool = generateCandidatePool(CANDIDATE_POOL_SIZE);
renderCandidatePool();

document.getElementById("rerollBtn").addEventListener("click", rerollCandidates);
document.getElementById("confirmVanguardBtn").addEventListener("click", confirmVanguard);
document.getElementById("startDayBtn").addEventListener("click", startDay);

</script>
</body>
