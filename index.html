<!--
  Barbarians — Prototype
  Version: 0.5.4.0
  Author: Mason Dutton
  Last updated: 2026-07-31

  Full changelog is kept separately (not in this file); see
  barbarians-changelog.md, attached to the project.

  Single-file HTML/CSS/JS prototype. No build step, no dependencies —
  open directly in a browser or serve as a static site (e.g. GitHub Pages).
  This is Phase 1 (The Vanguard) only: character generation, vanguard
  selection, daily action assignment, and outrider raid mechanics.

  Comments in this file explain WHAT the code does. For WHY specific
  numbers/rules were chosen, see design-rationale.md (repo root).
  For the full game vision and locked decisions, see the project's
  design docs in /docs/. Token reference: /docs/tokens.md.
  Component reference: /docs/components.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbarians — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral+SC:wght@400;600;700&family=Spectral:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  /* ---------------------------------------------
     DESIGN TOKENS — LEGACY (game screen, dark theme)
     Original tokens kept intact for the game screen.
     New parchment tokens below cover the selection screen.
     Full reference: /docs/tokens.md in the repo.
     --------------------------------------------- */
  :root {
    /* Backgrounds — darkest to lightest */
    --color-bg-page: #1b1b1b;
    --color-bg-panel: #262626;
    --color-bg-log-entry: #202020;
    --color-bg-candidate-selected: #33301f;

    /* Text */
    --color-text-primary: #e8e0d0;
    --color-text-muted: #bdbdbd;
    --color-text-disabled: #999;
    --color-text-footer: #666;

    /* Accent — bronze/gold */
    --color-accent-gold: #8a6d3b;
    --color-accent-gold-light: #c9a86a;
    --color-accent-gold-muted: #8a7a54;

    /* Borders / dividers */
    --color-border-default: #555;
    --color-border-subtle: #333;

    /* Status — hunger tags */
    --color-status-hungry-bg: #6b5a1f;
    --color-status-hungry-text: #e6d6a6;
    --color-status-starving-bg: #6b2f1f;
    --color-status-starving-text: #e6b6a6;
    --color-status-deceased: #6b1f1f;
    --color-status-deceased-text: #a05050;

    /* Status — game over banners */
    --color-victory-bg: #2f4a2f;
    --color-victory-text: #b6e6b6;
    --color-victory-border: #5a8a5a;
    --color-defeat-bg: #4a2f2f;
    --color-defeat-text: #e6b6b6;
    --color-defeat-border: #8a5a5a;

    /* Status — misc accents */
    --color-supplies-text: #7a9e7a;

    /* Fonts — legacy game screen */
    --font-body: Georgia, serif;

    /* -----------------------------------------
       DESIGN TOKENS — PARCHMENT SYSTEM
       Selection screen and future parchment surfaces.
       Source of truth: /docs/tokens.md
       ----------------------------------------- */

    /* Parchment surfaces */
    --color-parchment:        #eee5d2;
    --color-parchment-mid:    #d8ccb4;
    --color-parchment-deep:   #c8b89a;

    /* Card surfaces */
    --color-card-bg:          #f5ede0;
    --color-card-portrait-bg: #d8ccb4;

    /* Ink — text on parchment */
    --color-ink-primary:      #2a1f10;
    --color-ink-secondary:    #3a2f1e;
    --color-ink-role:         #7a5c2e;
    --color-ink-ornament:     #b8a07a;
    --color-ink-muted:        #9a8060;

    /* Accent — selected / danger */
    --color-selected:         #8b3a2f;
    --color-selected-glow:    rgba(139,58,47,0.2);

    /* Status */
    --color-supplies-parchment: #5a7a4a;
    --color-weapon-parchment:   #4f6470;  /* slate — weapon label on selection card */

    /* Typography */
    --font-display:   'Spectral SC', Georgia, serif;
    --font-body-new:  'Spectral', Georgia, serif;
    --font-numeric:   'Trebuchet MS', Arial, sans-serif;

    /* Type sizes */
    --text-xs:   10px;
    --text-sm:   11px;
    --text-base: 12px;
    --text-md:   13px;
    --text-lg:   15px;
    --text-xl:   18px;

    /* Leading */
    --leading-tight: 1.2;
    --leading-base:  1.65;

    /* Tracking */
    --tracking-wide:   0.1em;
    --tracking-wider:  0.14em;
    --tracking-widest: 0.2em;

    /* Card geometry */
    --card-radius:          10px;
    --card-border-well:     1px solid #c8b89a;
    --card-border-selected: 1px solid #8b3a2f;
    --card-shadow-selected: 0 0 0 2px rgba(139,58,47,0.2);
    --card-padding:         12px;

    /* Portrait zones — selection screen */
    --portrait-height-full: 170px;
    --portrait-fade-height: 80px;

    /* Layout gaps */
    --gap-xs: 4px;
    --gap-sm: 8px;
    --gap-md: 12px;
    --gap-lg: 16px;

    /* Component shorthands */
    --divider-ink: linear-gradient(to right, transparent, rgba(200,184,154,0.7), transparent);
    --portrait-fade: linear-gradient(to bottom, rgba(238,229,210,0) 0%, rgba(238,229,210,0.6) 50%, #eee5d2 88%);

    /* Transitions */
    --transition-card:   150ms ease;
    --transition-screen: 300ms ease-in-out;
    --transition-tray:   200ms ease-out;

    /* Card geometry — game screen */
    --card-height-collapsed: 46px;
    --card-right-width:   48px;
    --action-slot-size:   32px;
    --action-slot-radius: 6px;
    --action-slot-empty-shadow: inset 1px 2px 4px rgba(50,20,5,0.09);

    /* Action slot backgrounds */
    --color-slot-assigned-bg: rgba(138,106,58,0.13);
    --color-slot-empty-bg:    #e8dbc6;

    /* Character decay arc — card backgrounds */
    --color-card-hungry-bg:       #ddd8cc;
    --color-card-starving-bg:     #c4beb4;
    --color-card-dead-bg:         #c0bcb4;
    --color-card-hurt-bg:         #ede0cc;
    --color-card-sorely-hurt-bg:  #e8d0bc;

    /* Character decay arc — card borders */
    --color-card-hungry-border:       #9a9080;
    --color-card-starving-border:     #706860;
    --color-card-dead-border:         #888880;
    --color-card-hurt-border:         #b89060;
    --color-card-sorely-hurt-border:  #a06040;

    /* Character decay arc — state word colors */
    --color-state-hungry:      #7a6848;
    --color-state-starving:    #4a3e30;
    --color-state-dead:        #555555;
    --color-state-hurt:        #8a5a20;
    --color-state-sorely-hurt: #7a2e10;

    /* Start Day button */
    --btn-start-radius: 8px;
    --btn-start-border: 1.5px solid var(--color-selected);

    /* Modals */
    --modal-radius:   12px;
    --modal-width:    290px;
    --modal-scrim:    rgba(17,13,8,0.6);
    --modal-padding:  22px 20px 18px;

    /* Site card */
    --site-art-height: 110px;

    /* Resource count text-shadow — on page parchment surface */
    --resource-count-shadow: 0 0 4px #eee5d2, 0 0 2px #eee5d2;
    /* Resource count text-shadow — on card-bg surface */
    --resource-count-shadow-card: 0 0 4px #f5ede0, 0 0 2px #f5ede0;

    /* Journal screen */
    --color-journal-bg:     #110d08;
    --color-journal-header: #c8902a;
    --color-journal-rule:   #7a4a18;
    --color-journal-body:   #d4b87a;
    --color-journal-names:  #e8c890;
    --color-journal-return: #5a3e1a;

    /* Typography — added sizes */
    --text-2xl: 22px;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-body);
    max-width: 700px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 {
    border-bottom: 1px solid var(--color-border-default);
    padding-bottom: 8px;
  }


  .game-over {
    margin-bottom: 20px;
    padding: 14px;
    font-weight: bold;
    font-size: 1.1em;
    text-align: center;
  }
  .game-over.victory {
    background: var(--color-victory-bg);
    color: var(--color-victory-text);
    border: 1px solid var(--color-victory-border);
  }
  .game-over.defeat {
    background: var(--color-defeat-bg);
    color: var(--color-defeat-text);
    border: 1px solid var(--color-defeat-border);
  }
  #resetBtn {
    margin-top: 10px;
    padding: 10px 16px;
    background: var(--color-accent-gold);
    color: var(--color-bg-page);
    border: none;
    font-family: var(--font-body);
    font-weight: bold;
    cursor: pointer;
  }

  /* ---------------------------------------------
     SELECTION SCREEN — parchment skin
     Component spec: /docs/components.md §1
     --------------------------------------------- */

  /* Page shell for the selection screen — parchment background,
     centered, readable at desktop and mobile widths. */
  #selectionScreen {
    background: var(--color-parchment);
    min-height: 100vh;
    padding: 0 16px 48px;
    box-sizing: border-box;
    font-family: var(--font-display);
    position: relative;
  }

  /* Version tag — pinned top-right, out of the way */
  #selectionScreen .sel-version {
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: var(--font-display);
    font-size: 7px;
    color: var(--color-ink-primary);
    letter-spacing: var(--tracking-wide);
    opacity: 0.6;
    margin: 0;
  }

  /* ---- Header block ---- */
  .sel-header {
    text-align: center;
    padding: 28px 16px 16px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* Main title */
  #selectionScreen .sel-title {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 700;
    color: var(--color-ink-primary);
    letter-spacing: 0.06em;
    margin: 0 0 16px;
    line-height: 1;
  }

  /* Ornamental rule under the title */
  .sel-rule {
    height: 1px;
    background: var(--divider-ink);
    border: none;
    margin: 0 auto 10px;
    max-width: 220px;
  }

  /* Instruction line */
  #selectionInstructions {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-lg);
    color: var(--color-ink-muted);
    text-align: center;
    margin: 0;
  }

  /* 2-column card grid. Gaps collapse on narrow screens (see mobile). */
  #candidatePool {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--gap-md);
    max-width: 680px;
    margin: 0 auto;
  }

  /* ---- Candidate card ---- */
  .candidate {
    background: var(--color-card-bg);
    border: var(--card-border-well);
    border-radius: var(--card-radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--transition-card), box-shadow var(--transition-card);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .candidate.selected {
    border: var(--card-border-selected);
  }



  /* ---- Portrait zone ---- */
  /* Full-figure portrait at top of selection card.
     Falls back to the inline SVG silhouette if no image src is set. */
  .candidate-portrait-zone {
    position: relative;
    height: var(--portrait-height-full);
    background: var(--color-card-portrait-bg);
    overflow: hidden;
    flex-shrink: 0;
  }
  .candidate-portrait-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  /* Silhouette placeholder — shown when no portrait image exists.
     Inline SVG centered in the portrait zone. */
  .candidate-portrait-zone .portrait-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .candidate-portrait-zone .portrait-placeholder svg {
    width: 72px;
    height: 72px;
    opacity: 0.28;
  }
  /* Gradient fade — overlays the bottom of the portrait into the card body */
  .candidate-portrait-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--portrait-fade-height);
    background: var(--portrait-fade);
    pointer-events: none;
  }

  /* ---- Card body ---- */
  .candidate-body {
    padding: var(--card-padding);
    display: flex;
    flex-direction: column;
    gap: var(--gap-xs);
    flex: 1;
  }

  /* Name */
  .candidate .cand-name {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--color-ink-primary);
    letter-spacing: var(--tracking-wide);
    margin: 0;
    line-height: var(--leading-tight);
  }

  /* Role label */
  .candidate .cand-role {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    font-weight: 400;
    color: var(--color-ink-role);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    margin: 0;
  }

  /* Ink rule divider */
  .cand-divider {
    height: 1px;
    background: var(--divider-ink);
    border: none;
    margin: 4px 0;
  }

  /* Flavor / backstory text */
  .candidate .cand-flavor {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-base);
    color: var(--color-ink-secondary);
    line-height: var(--leading-base);
    margin: 0;
  }



  /* Card footer — supplies left, weapon right, same row */
  .candidate .cand-footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: auto;
  }
  .candidate .cand-supplies {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-supplies-parchment);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    margin: 0;
  }
  .candidate .cand-weapon {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-weapon-parchment);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    margin: 0;
  }

  /* ---- Selection screen action row ---- */
  .sel-actions {
    max-width: 680px;
    margin: 10px auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap-md);
    flex-wrap: wrap;
  }

  /* Reroll and confirm buttons share structure; confirm is primary. */
  .sel-btn {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 150ms ease;
  }
  .sel-btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }
  .sel-btn-secondary {
    background: transparent;
    border: 1.5px solid var(--color-parchment-deep);
    color: var(--color-ink-muted);
  }
  .sel-btn-primary {
    background: transparent;
    border: 1.5px solid var(--color-selected);
    color: var(--color-selected);
  }
  .sel-btn-primary:not(:disabled):hover {
    background: rgba(139,58,47,0.06);
  }
  .sel-btn-secondary:not(:disabled):hover {
    background: rgba(200,184,154,0.18);
  }


  /* Version tag — legacy element, shown only on the game screen.
     The selection screen renders its own title/version inside #selectionScreen. */
  #versionTag {
    margin-top: -8px;
    margin-bottom: 24px;
    color: var(--color-text-footer);
    font-size: 0.75em;
    font-family: var(--font-body);
    text-align: center;
  }
  /* Hide the legacy page-level h1 and version tag on both the selection
     screen and the game screen — neither has use for them. */
  body:has(#selectionScreen:not([style*="display: none"])) > h1,
  body:has(#selectionScreen:not([style*="display: none"])) > #versionTag,
  body:has(#gameScreen:not([style*="display: none"])) > h1,
  body:has(#gameScreen:not([style*="display: none"])) > #versionTag {
    display: none;
  }

  /* Neutralise body margin/padding on the game screen so fixed elements
     (header, button) sit flush against the viewport edges. */
  body:has(#gameScreen:not([style*="display: none"])) {
    background: var(--color-parchment);
    margin: 0 auto;
    padding: 0;
  }

  /* ---------------------------------------------
     GAME SCREEN — parchment skin
     Component spec: /docs/components.md §2–11
     --------------------------------------------- */

  /* Game screen shell — parchment background, needs bottom padding
     for the fixed Start Day button so content isn't hidden under it. */
  #gameScreen {
    background: var(--color-parchment);
    min-height: 100vh;
    font-family: var(--font-display);
    position: relative;
    padding-bottom: 56px; /* clears the fixed Start Day button */
  }

  /* ---- Game Header — sticky top (status bar + resource strip) ---- */
  #gameHeader {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--color-parchment);
  }

  /* ---- Status Bar (§5) ---- */
  #statusBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 8px;
    gap: var(--gap-sm);
  }
  /* Left cluster — title + separator + day */
  .sb-left {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-shrink: 0;
  }
  #statusBar .sb-title {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    font-weight: 700;
    color: var(--color-ink-primary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
  }
  .sb-sep {
    color: var(--color-ink-ornament);
    font-size: var(--text-xs);
    line-height: 1;
  }
  #statusBar .sb-day {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    font-weight: 400;
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
  }
  #statusBar .sb-threat {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-lg);
    color: #8b4a2f;
    flex: 1;
    text-align: center;
  }
  #statusBar .sb-version {
    font-family: var(--font-display);
    font-size: 7px;
    color: var(--color-ink-primary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    opacity: 0.6;
    flex-shrink: 0;
  }
  /* Ink rule below status bar and below resource strip */
  .game-rule {
    height: 1px;
    background: var(--divider-ink);
    border: none;
    margin: 0;
  }

  /* ---- Resource Strip stub (§6) ---- */
  #resourceStrip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 8px 14px 10px;
    background: var(--color-parchment);
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
  }
  #resourceStrip .res-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #resourceStrip .res-count {
    font-family: var(--font-numeric);
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--color-ink-primary);
    font-variant-numeric: lining-nums tabular-nums;
  }

  /* ---- Site Card stub (§7) ---- */
  /* Placeholder — fortification images not yet generated.
     Art zone shows parchment fill + stage name label.
     Full implementation lands when images are ready. */
  #siteCard {
    margin: 10px 14px;
    background: var(--color-card-bg);
    border: var(--card-border-well);
    border-radius: var(--card-radius);
    overflow: hidden;
  }
  .site-art-zone {
    height: var(--site-art-height);
    background: var(--color-card-portrait-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .site-art-label {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    opacity: 0.6;
  }
  .site-stage-name {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    padding: 5px 12px;
  }

  /* ---- Character Cards — Game Screen (§2, §3) ---- */
  #roster {
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: var(--gap-sm);
    margin-top: 10px;
  }

  /* Base card — collapsed, horizontal layout */
  .char-card {
    background: var(--color-card-bg);
    border: var(--card-border-well);
    border-radius: var(--card-radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--transition-card), box-shadow var(--transition-card);
    position: relative;
  }

  /* Collapsed row — portrait + identity + action slot */
  .char-card-row {
    display: flex;
    align-items: stretch;
    min-height: var(--card-height-collapsed);
  }

  /* Face-crop portrait (46×46px) */
  .char-face {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    background: var(--color-card-portrait-bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
    margin: 0 0 0 0;
  }
  .char-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  /* Silhouette fallback in face zone */
  .char-face .face-placeholder svg {
    width: 28px;
    height: 28px;
    opacity: 0.28;
  }

  /* Identity block — name / role / state word */
  .char-identity {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0; /* prevents overflow from long names */
  }
  .char-name {
    font-family: var(--font-display);
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--color-ink-primary);
    letter-spacing: var(--tracking-wide);
    line-height: var(--leading-tight);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-role {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    font-weight: 400;
    color: var(--color-ink-role);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    line-height: var(--leading-tight);
  }
  .char-state-word {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-xs);
    line-height: var(--leading-tight);
  }

  /* Right column — action slot (48px wide) */
  .char-action-col {
    width: var(--card-right-width);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;
  }

  /* Action slot */
  .action-slot {
    width: var(--action-slot-size);
    height: var(--action-slot-size);
    border-radius: var(--action-slot-radius);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--transition-card);
  }
  .action-slot.empty {
    background: var(--color-slot-empty-bg);
    box-shadow: var(--action-slot-empty-shadow);
  }
  .action-slot.assigned {
    background: var(--color-slot-assigned-bg);
  }
  /* Placeholder inner square — stands in for the real action icon */
  .action-slot-icon-placeholder {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: rgba(122,92,46,0.45);
  }
  /* Assigned action label inside slot — small text abbreviation */
  .action-slot-label {
    font-family: var(--font-display);
    font-size: 7px;
    color: var(--color-ink-role);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.1;
    padding: 2px;
  }

  /* Expanded flavor row — slides in below collapsed row */
  .char-flavor-row {
    border-top: 1px solid;
    border-image: var(--divider-ink) 1;
    padding: 5px 10px 9px 10px;
    display: none; /* toggled by JS */
  }
  .char-card.expanded .char-flavor-row {
    display: block;
  }
  .char-flavor-text {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-base);
    color: var(--color-ink-secondary);
    line-height: var(--leading-base);
    margin: 0;
  }


  /* Hunger/decay state classes — applied to entire .char-card */
  .char-card.hungry {
    background: var(--color-card-hungry-bg);
    border-color: var(--color-card-hungry-border);
    filter: saturate(0.55) brightness(0.95);
  }
  .char-card.starving {
    background: var(--color-card-starving-bg);
    border-color: var(--color-card-starving-border);
    filter: saturate(0.2) brightness(0.88);
  }
  .char-card.dead {
    background: var(--color-card-dead-bg);
    border-color: var(--color-card-dead-border);
    filter: grayscale(1) brightness(0.85);
    opacity: 0.5;
    cursor: default;
  }

  /* Injury state classes — amber/rust tint, distinct from hunger desaturation */
  .char-card.hurt {
    background: var(--color-card-hurt-bg);
    border-color: var(--color-card-hurt-border);
  }
  .char-card.sorely-hurt {
    background: var(--color-card-sorely-hurt-bg);
    border-color: var(--color-card-sorely-hurt-border);
  }

  /* Locked action slot — Sorely Hurt characters cannot be assigned */
  .action-slot.locked {
    background: var(--color-slot-empty-bg);
    opacity: 0.38;
    cursor: not-allowed;
  }
  .action-slot-lock-icon {
    width: 14px;
    height: 14px;
    opacity: 0.4;
  }

  /* ---- Action Tray (§4) ---- */
  /* Fixed bottom sheet — sits above Start Day button when open.
     Hidden by default; JS adds .tray-open to body when active. */
  #actionTray {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 700px;
    background: var(--color-parchment);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -2px 16px rgba(30,20,5,0.18);
    transition: transform var(--transition-tray);
    z-index: 100;
    padding-bottom: 16px;
  }
  #actionTray.open {
    transform: translateX(-50%) translateY(0);
  }

  /* Handle bar and top ink rule */
  .tray-handle-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10px;
    gap: 6px;
  }
  .tray-handle {
    width: 36px;
    height: 3px;
    background: var(--color-parchment-deep);
    border-radius: 2px;
    opacity: 0.7;
  }
  .tray-ink-rule {
    width: 100%;
    height: 1px;
    background: var(--divider-ink);
  }

  /* Tray header */
  .tray-header {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    color: var(--color-ink-muted);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    padding: 8px 16px 4px;
  }

  /* Action rows */
  .tray-action-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: 8px;
    margin: 0 8px;
    cursor: pointer;
    transition: background 100ms ease;
  }
  .tray-action-row:active {
    background: rgba(200,184,154,0.22);
  }
  .tray-action-row.tray-selected .tray-action-name {
    color: var(--color-accent-slate);
  }

  /* Icon box — placeholder until real action icons land */
  .tray-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: rgba(138,106,58,0.10);
    border: 1px dashed rgba(122,92,46,0.3); /* dev placeholder border */
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tray-icon-inner {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: rgba(122,92,46,0.45);
  }

  /* Action name */
  .tray-action-name {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    color: var(--color-ink-primary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
  }

  /* Group divider between action groups */
  .tray-group-rule {
    height: 1px;
    background: var(--divider-ink);
    margin: 4px 8px;
  }

  /* No scrim — outside-tray taps handled by document listener in JS
     so character action slots remain tappable while the tray is open. */

  /* ---- Start Day Button — pinned bottom (§10) ---- */
  #startDayBtn {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 700px;
    padding: 14px 18px;
    background: var(--color-parchment);
    border: none;
    border-top: 1px solid;
    border-image: linear-gradient(to right, transparent, #c8b89a, transparent) 1;
    font-family: var(--font-display);
    font-size: var(--text-sm);
    font-weight: 400;
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    cursor: pointer;
    z-index: 50;
    transition: color 150ms ease;
  }
  #startDayBtn:not(:disabled) {
    color: var(--color-selected);
  }
  #startDayBtn:disabled {
    color: var(--color-ink-ornament);
    cursor: not-allowed;
  }
  #assignmentStatus {
    display: none; /* replaced by disabled state on button */
  }

  /* ---- Journal Screen (§11) ---- */
  #journalScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--color-journal-bg);
    z-index: 200;
    padding: 40px 24px 32px;
    overflow-y: auto;
    cursor: pointer;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity var(--transition-screen);
  }
  #journalScreen.visible {
    opacity: 1;
  }
  .journal-day-header {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: 600;
    color: var(--color-journal-header);
    margin: 0 0 6px;
    letter-spacing: var(--tracking-wide);
  }
  .journal-rule {
    height: 1px;
    background: linear-gradient(to right, var(--color-journal-rule), transparent);
    border: none;
    margin: 0 0 20px;
  }
  .journal-entry-text {
    font-family: var(--font-body-new);
    font-style: italic;
    font-size: var(--text-xl);
    color: var(--color-journal-body);
    line-height: var(--leading-loose, 1.9);
    margin: 0 0 32px;
  }
  .journal-entry-text .journal-name {
    color: var(--color-journal-names);
    font-style: normal;
  }
  .journal-return {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--color-journal-return);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    margin-top: 16px;
  }

  /* Color variable for slate blue action name (used in tray) */
  :root { --color-accent-slate: #4f6470; }

  /* ---------------------------------------------
     MOBILE RESPONSIVENESS
     Narrow viewports: candidate cards go full-width and stack
     (instead of a multi-column flex-wrap grid that shrinks
     illegibly), buttons/selects get bigger tap targets, and
     side-by-side layout collapses to single column.
     --------------------------------------------- */
  @media (max-width: 600px) {
    body {
      margin: 16px auto;
      font-size: 1.05em;
    }
    h1 {
      font-size: 1.6em;
    }

    /* Selection screen — single column on narrow viewports */
    #candidatePool {
      grid-template-columns: 1fr;
    }
    .sel-actions {
      flex-direction: column;
      align-items: center;
    }
    .sel-btn {
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    /* Game screen */
    #roster {
      padding: 0 8px;
    }
    #siteCard {
      margin: 8px;
    }
    #resourceStrip {
      padding: 8px;
    }
    .journal-entry-text {
      font-size: var(--text-lg);
    }
    .journal-day-header {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<h1>Barbarians</h1>
<div id="versionTag">v0.5.4.0</div>

<div id="selectionScreen">
  <p class="sel-version">v0.5.4.0</p>
  <div class="sel-header">

  <div class="sel-actions">

    <button id="confirmVanguardBtn" class="sel-btn sel-btn-primary" disabled>Confirm Vanguard</button>
  </div>
  <div id="candidatePool"></div>
</div>

<div id="gameScreen" style="display: none;">
  <!-- Sticky header: title + day counter + resources -->
  <div id="gameHeader">
    <div id="statusBar">
      <div class="sb-left">
        <span class="sb-title">Barbarians</span>
        <span class="sb-sep">·</span>
        <span class="sb-day"></span>
      </div>
      <span class="sb-threat"></span>
      <span class="sb-version">v0.5.4.0</span>
    </div>
    <hr class="game-rule">
    <div id="resourceStrip"></div>
    <hr class="game-rule">
  </div>

  <!-- Site Card (stub — images pending art generation) -->
  <div id="siteCard">
    <div class="site-art-zone">
      <span class="site-art-label">Bailey Grounds</span>
    </div>
    <hr class="game-rule">
    <div class="site-stage-name" id="siteStageNameLine"></div>
  </div>

  <!-- Game Over Banner -->
  <div id="gameOverBanner" style="display: none;"></div>

  <!-- Character Cards -->
  <div id="roster"></div>

  <!-- Assignment status (hidden — button state communicates this now) -->
  <div id="assignmentStatus"></div>

  <!-- Start Day — fixed to bottom via CSS -->
  <button id="startDayBtn" disabled>Begin the Day</button>
</div>

<!-- Action Tray — bottom sheet, shared across all character cards -->
<div id="actionTray">
  <div class="tray-handle-zone">
    <div class="tray-handle"></div>
    <div class="tray-ink-rule"></div>
  </div>
  <div class="tray-header" id="trayHeader">Assign</div>
  <div id="trayActionList"></div>
</div>

<!-- Journal Screen — full-screen dark, fires after each day resolves -->
<div id="journalScreen">
  <div class="journal-day-header" id="journalDayHeader"></div>
  <hr class="journal-rule">
  <div class="journal-entry-text" id="journalEntryText"></div>
  <div class="journal-return">Dawn</div>
</div>

<script>

// Rolls the starting tree count near the camp (8 to 10).
function rollStartingTrees() {
  return 8 + Math.floor(Math.random() * 3); // 8 to 10
}

// ---------------------------------------------
// THREAT SYSTEM
// Hidden accumulating value. Player never sees the number.
// Raids fire when Threat crosses THREAT_RAID_THRESHOLD.
// Post-raid: partial reset, baseline creeps upward each cycle.
// ---------------------------------------------
const THREAT_RAID_THRESHOLD = 30;

// Per-action Threat adds. Fixed adds are flat; outdoor worker adds
// are rolled across a range so the player cannot game a predictable
// curve. Tier-governed actions (Hunt/Forage/Scout) are handled
// in accumulateThreat() using the assigned character's skill tier.
const THREAT_FIXED = {
  "Fell timber":    2,  // axes are loud — skill doesn't make you quieter
  "Delve fosse":    1,  // visible earthwork
  "Build Palisade": 1,  // visible construction (includes all fortification stages)
};

// Roll a random integer between min and max inclusive.
function rollRange(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

// Threat add per character per day for Hunt (Stalk beasts),
// governed by their Veneur tier.
function huntThreatAdd(tier) {
  if (tier === "Seasoned")  return rollRange(0, 1);
  if (tier === "Practiced") return rollRange(1, 2);
  if (tier === "Base")      return rollRange(2, 3);
  return rollRange(3, 4); // Poor
}

// Threat add for Forage (Gather mast) — one band lower than Hunt.
function forageThreatAdd(tier) {
  if (tier === "Seasoned")  return 0;
  if (tier === "Practiced") return rollRange(0, 1);
  if (tier === "Base")      return rollRange(1, 2);
  return rollRange(2, 3); // Poor
}

// Accumulates Threat for one day based on actions assigned.
// Returns the total added (for journal use if needed later).
// Scout detection is handled separately in resolveScoutForEnemiesForDay.
function accumulateThreat() {
  // Passive daily increment — the Welsh are always searching.
  let added = rollRange(1, 2);

  gameState.characters
    .filter(c => c.alive)
    .forEach(character => {
      const action = character.currentAction;
      if (!action) return;

      if (action === "Stalk beasts") {
        const tier = getSkillTier(character, "Stalk beasts");
        added += huntThreatAdd(tier);
      } else if (action === "Gather mast") {
        const tier = getSkillTier(character, "Gather mast");
        added += forageThreatAdd(tier);
      } else if (THREAT_FIXED[action] !== undefined) {
        added += THREAT_FIXED[action];
      }
      // Cook provisions, Keep ward, Spy out, unassigned: +0
    });

  gameState.threat += added;
  return added;
}

// Called after each raid. Resets Threat to a creeping floor
// (not zero) so each cycle accelerates slightly.
// Floor sequence: 8 → 10 → 12 (capped at 12).
function resetThreatAfterRaid() {
  const floor = Math.min(12, 8 + (gameState.raidCount * 2));
  gameState.threat = floor;
  gameState.raidCount += 1;
}

// Caravan arrives on a randomly rolled day between 25 and 40 (inclusive).
// Rolled once at game start and stored in gameState. Surviving to that
// day is the win condition — fortification state at arrival is irrelevant
// to victory but affects what kind of camp the caravan finds.
const CARAVAN_DAY_MIN = 25;
const CARAVAN_DAY_MAX = 40;
function rollCaravanArrivalDay() {
  return CARAVAN_DAY_MIN + Math.floor(Math.random() * (CARAVAN_DAY_MAX - CARAVAN_DAY_MIN + 1));
}

// ---------------------------------------------
// GAME STATE
// This object is the single source of truth.
// Every system reads from and writes to this.
// ---------------------------------------------
const gameState = {

  day: 1,

  resources: {
    rations: 0,     // set by whichever Cooks the player picks — see applyStartingSupplies()
    rawFood: 0,     // hunted meat — needs a Master Cook before it's safe/wise to eat
    forageFood: 0,  // foraged food — edible directly, no cooking needed, but spoils fast
    forageFoodAge: 0, // days since the current forage food stock was gathered — spoils at 2
    wood: 0,        // set by whichever Carpenters the player picks
    simples: 0      // medicinal herbs; byproduct of Gather mast; auto-applied to Hurt characters
  },

  // Fortification track — six stages, man-day costs per the design doc.
  // stageIndex points into FORTIFICATION_STAGES below; daysRemaining is
  // how many man-days are left to pay off the CURRENT stage only (not
  // the whole track). Rampart/Watchtower are intentionally out of easy
  // reach in a normal Phase 1 run — don't rebalance that away.
  //
  // hasAnnouncedStart: whether buildPalisadeFlavor has already said
  // "work has only just begun" for the CURRENT stage. Prevents that
  // line from repeating every single day a stage sits above the 66%
  // remaining threshold — it should fire once, the first day work
  // starts on a stage, then fall through to standard "coming along"
  // phrasing for the rest of that band. Reset to false whenever
  // stageIndex advances (see resolveBuildPalisade).
  fortification: {
    stageIndex: 0,
    daysRemaining: 3, // Bailey Grounds costs 3 — see FORTIFICATION_STAGES
    hasAnnouncedStart: false
  },

  characters: [], // filled in by generateSettlers()

  environment: {
    treesRemainingNearby: rollStartingTrees(), // randomized, see rollStartingTrees()
    safeForagingRange: "normal", // "extended" if player later approves risk
    groundQuality: "rocky" // slows the farmer
  },

  log: [
    // one entry per day, e.g.:
    // { day: 1, entries: ["Thomas felled two trees near camp.", "Rations held steady."] }
  ],

  pendingDecision: null,
  // when a decision is surfaced, something like:
  // { id: "rangeTrees", prompt: "...", options: ["rangeFurther", "buildSmaller"] }

  gameOver: false,
  outcome: null, // "victory" (caravan arrived) or "defeat" (wiped out / starved) once gameOver is true
  fortificationComplete: false, // true when all stages done mid-run; does NOT end the game

  caravanArrivalDay: rollCaravanArrivalDay(), // rolled once at init; win condition

  // Threat system — replaces flat nextWaveDay roller (H2).
  // threat: hidden accumulator; player never sees this number.
  // raidCount: how many raids have fired this run (drives post-raid reset floor).
  // raidIsAmbush: true when the incoming raid is forced Ambush
  //   (either no Watch manned, or scout was detected by the Welsh).
  // scoutWarning: intel from Spy out — { estimatedDays, estimatedCount,
  //   daysAccurate, countAccurate }. Cleared after each raid fires.
  // scoutDetected: true when a scout was seen by the Welsh this day —
  //   forces next raid to Ambush regardless of Watch.
  threat: 0,
  raidCount: 0,
  raidIsAmbush: false,
  scoutWarning: null,
  scoutDetected: false

};


// ---------------------------------------------
// DATA POOLS
// Names, skills, and backstory fragments used
// to generate settlers. Kept separate from the
// generation logic so they're easy to expand later.
// ---------------------------------------------

// Names for the vanguard roster (male-only — see design-rationale.md).
const NAME_POOL = [
  "Thomas", "Aelfric", "Godwin", "Osric", "Wulfstan",
  "Alwyn", "Cedric", "Baldric", "Leofric", "Eadric",
  "Roger", "Walter", "Hubert", "Warin", "Gervase"
];

// One sentence of specific backstory per skill.
// Each skill has a few options so repeats don't feel identical.
const BACKSTORY_POOL = {
  Carpenter: [
    "a Suffolk carpenter, second son of a tradesman who has never been this far from home.",
    "trained under a York guild master, still carries his late father's chisel.",
    "left an apprenticeship unfinished when the roads north grew too dangerous to travel."
  ],
  Veneur: [
    "grew up poaching the king's deer and never once got caught.",
    "spent more nights sleeping under trees than under a roof, and prefers it that way.",
    "learned to track from a father who was better with animals than with people."
  ],
  "Master Cook": [
    "ran a tavern kitchen for a decade before the harvest failures closed it.",
    "was taught to stretch a meal for twelve on rations meant for six.",
    "still has burn scars from a fire that took a family's bakery, not this one."
  ],
  "Man-at-Arms": [
    "survived a border skirmish that killed most of his unit.",
    "was a household guard for a lord who no longer has a household.",
    "has killed before and does not talk about it unless asked twice."
  ],
  Gatherer: [
    "learned which roots won't kill you from a grandmother who buried three husbands and outlived them all.",
    "spent a hungry childhood combing hedgerows and never lost the habit.",
    "can name every plant in a treeline by moonlight alone."
  ],
  Hewer: [
    "has swung an axe since he was tall enough to lift one.",
    "worked a charcoal camp deep in the Weald before the lord's men came through.",
    "reads a tree's grain the way a priest reads scripture."
  ],
  Fossier: [
    "dug drainage ditches for three different manors and never once complained about the mud.",
    "has calluses a Carpenter would envy and no patience for fine work.",
    "believes there is no ground that can't be moved with enough time and a strong back."
  ],
  Farmer: [
    "worked land that belonged to three different lords in one lifetime.",
    "knows soil the way some people know scripture.",
    "buried two children before turning twenty and rarely speaks of either."
  ],
  Outrider: [
    "was sent ahead of columns more times than he can count, and came back every one.",
    "knows the Welsh Marches better than he knows his own village — the ground is his trade.",
    "moves through country like water through stone, and prefers it that way."
  ]
};

// Embedded hint sentences — one per role per tier (Practiced / Poor).
// Written as character observation in natural prose. These get appended
// to the flavor paragraph as a second sentence — no separate line,
// no tier labels, no direct statement of skill level. A careful reader
// will notice; a skimmer won't. Keyed by role name, then tier.
const HINT_POOL = {
  Carpenter: {
    Practiced: [
      "He works timber with a confidence that suggests it is not entirely unfamiliar ground.",
      "He has been around enough construction that the shapes of the work come naturally to him.",
      "More than once he has watched a frame go up and remembered more than he expected to."
    ],
    Poor: [
      "He has never been good with his hands — careful and willing, but the wood rarely does what he intends.",
      "Joinery has always defeated him; he can haul and hold, but the finer shaping escapes him.",
      "Put him near a saw and the results are serviceable, but not much more than that."
    ]
  },
  Veneur: {
    Practiced: [
      "He can follow a trail when he needs to, and usually comes back with something to show for it.",
      "He is no hunter by trade, but he reads the treeline with a patience that occasionally bears fruit.",
      "He does not claim to hunt, but he has fed himself off the land before and knows roughly how."
    ],
    Poor: [
      "He is loud in the wood — game hears him long before he sees it.",
      "He has tried his hand at the chase and come back empty more times than he admits.",
      "Patience in the field is not among his gifts; he startles what he means to stalk."
    ]
  },
  "Master Cook": {
    Practiced: [
      "He has kept a fire and managed a pot without disaster more than most men his age.",
      "He learned enough at his mother's hearth to stretch a meal when nothing better is on hand.",
      "He can turn raw provisions into something edible, if not always something memorable."
    ],
    Poor: [
      "He has burned more meals than he can count and seems no closer to understanding why.",
      "He does not belong near a fire with anything that needs to taste like food.",
      "Cooking is a mystery to him — he can boil water, and little else reliably."
    ]
  },
  "Man-at-Arms": {
    Practiced: [
      "He carries himself like a man who has stood his ground before, even if not for a living.",
      "There is something in the way he watches a perimeter that suggests he has done it before.",
      "He has been close enough to violence to know what to do when it arrives."
    ],
    Poor: [
      "He is brave enough, but he tenses at the wrong moments — the kind of man who freezes when stillness is needed.",
      "His nerve has been tested and found wanting; he does not disgrace himself, but he does not hold firm either.",

// Picks one hint sentence for the given role and tier.
// Returns null if no pool entry exists (graceful fallback).
function pickHint(role, tier) {
  const pool = HINT_POOL[role] && HINT_POOL[role][tier];
  if (!pool || pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Active vanguard skill pool — 8 live roles as of H2. Outrider
// unlocked alongside Threat system (H2). Woodward remains tabled
// (blocked on Founding Sequence). Farmer exists in BACKSTORY_POOL
// but is excluded here. Laborer is retired outright — see design-rationale.md.
const ALL_SKILLS = ["Carpenter", "Veneur", "Master Cook", "Man-at-Arms", "Gatherer", "Hewer", "Fossier", "Outrider"];

// The actions a settler can be assigned to for the day.
// No action is skill-gated — any settler can attempt any action.
// Skill only affects how well they do it (see resolve* functions).
// "Tend wounds" is a consequential action — Poor tier carries worsening risk (see resolveTendWounds).
const ACTION_POOL = ["Fell timber", "Build Palisade", "Stalk beasts", "Cook provisions", "Keep ward", "Gather mast", "Spy out", "Tend wounds"];

// Player-facing label for the Build Palisade action in the assignment
// dropdown. "Build Palisade" stays as the internal action id (it's what

function actionDisplayLabel(action) {

// Flat per-attempt chance that a day of Fortification labor is lost
// entirely to bad luck (rot, weather, bad ground) instead of
// contributing man-days. Quick placeholder — same chance at every
// stage/tier for now. To be refined (per-stage odds, skill mitigation,
// etc.) in a design chat; not a locked number.
const FORTIFICATION_FAILURE_CHANCE = 0.1;


// ---------------------------------------------
// CHARACTER GENERATION
// ---------------------------------------------

// Picks 5 unique names from the pool so no two settlers share a name.
function pickUniqueNames(count) {
  const shuffled = [...NAME_POOL].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Rolls one tier for a non-headline role. Probabilities are role-
// agnostic — scales automatically as ALL_SKILLS grows.
// 50% Base / 30% Practiced / 20% Poor.
function rollTier() {
  const r = Math.random();
  if (r < 0.50) return "Base";
  if (r < 0.80) return "Practiced";
  return "Poor";
}

// Builds the full tier map for a character. The headline role is always
// Seasoned. Among the remaining roles, exactly 1 is guaranteed Practiced
// and 1 is guaranteed Poor — the rest roll freely via rollTier().
// This ensures every character always has at least one hint of each kind
// to surface, while still allowing more hidden Practiced/Poor beyond the
// guaranteed ones. Scales automatically as ALL_SKILLS grows.
function generateCharacterTiers(headlineRole) {
  const tiers = { [headlineRole]: "Seasoned" };
  const others = ALL_SKILLS.filter(r => r !== headlineRole);

  // Shuffle the non-headline roles so guaranteed slots are random picks.
  const shuffled = [...others].sort(() => Math.random() - 0.5);

  // First two slots: one guaranteed Practiced, one guaranteed Poor.
  tiers[shuffled[0]] = "Practiced";
  tiers[shuffled[1]] = "Poor";

  // Remaining roles roll freely — may produce additional Practiced/Poor.
  for (let i = 2; i < shuffled.length; i++) {
    tiers[shuffled[i]] = rollTier();
  }

  return tiers;
}

// Picks one role at random from ALL_SKILLS to be the character's
// headline (Seasoned) role.
function rollHeadlineRole() {
  return ALL_SKILLS[Math.floor(Math.random() * ALL_SKILLS.length)];
}

// Picks one backstory sentence matching the given skill.
function pickBackstory(skill) {
  const options = BACKSTORY_POOL[skill];
  const index = Math.floor(Math.random() * options.length);
  return options[index];
}

// Rolls the starting supplies a candidate brings with them, tied to
// their skill. See design-rationale.md for why this is per-candidate.
// Gatherer/Hewer/Fossier get modest ranges of their own now that
// Laborer (the old two-resource generalist) is retired.
function rollStartingSupplies(skill) {
  const supplyRanges = {
    "Master Cook": { rations: [3, 6] },
    Veneur: { rawFood: [2, 5] },
    Carpenter: { wood: [2, 5] },
    "Man-at-Arms": { rations: [1, 3] },
    Gatherer: { forageFood: [2, 4] },
    Hewer: { wood: [1, 3] },
    Fossier: { rations: [1, 3] },
    Outrider: { rations: [1, 2] }
  };

  const ranges = supplyRanges[skill] || {};
  const supplies = {};
  for (const resource in ranges) {
    const [min, max] = ranges[resource];
    supplies[resource] = min + Math.floor(Math.random() * (max - min + 1));
  }
  return supplies;
}

// Builds one settler object. Each settler has a headline role (their
// Seasoned tier — shown on the card) and a full tiers map covering
// every role in ALL_SKILLS. The tiers map is the authoritative source
// for all skill resolution; character.skill is kept as a convenience
// alias for the headline role so card rendering and backstory/supply
// lookups don't need to change until 1e.
function createSettler(name) {
  const headlineRole = rollHeadlineRole();
  const tiers = generateCharacterTiers(headlineRole);
  // Pick one Practiced and one Poor to surface as hints in text.
  // At least one of each is guaranteed by generateCharacterTiers.
  // Additional ones beyond the guaranteed pair stay hidden — intended variance.
  const practicedRoles = ALL_SKILLS.filter(r => tiers[r] === "Practiced");
  const poorRoles      = ALL_SKILLS.filter(r => tiers[r] === "Poor");
  const practicedHint  = practicedRoles[Math.floor(Math.random() * practicedRoles.length)] || null;
  const poorHint       = poorRoles[Math.floor(Math.random() * poorRoles.length)] || null;

  // Pick hint sentences once at creation — stored so render never re-rolls them.
  const practicedSentence = practicedHint ? pickHint(practicedHint, "Practiced") : null;
  const poorSentence      = poorHint      ? pickHint(poorHint, "Poor")           : null;


  // Personal weapon — governed by Stalk beasts tier (keyed as "Veneur"
  // in the tiers map — see SKILL_FOR_ACTION). Seasoned or Practiced → Bow.
  // Base or Poor → Spear. Man-at-Arms always Sword regardless.
  const stalkTier = tiers["Veneur"];
  const weapon = headlineRole === "Man-at-Arms"
    ? "sword+saex"
    : (stalkTier === "Seasoned" || stalkTier === "Practiced")
      ? "bow+saex"
      : "spear+saex";

  return {
    id: name.toLowerCase(),
    name: name,
    skill: headlineRole,         // alias for headline role — card render & lookups
    tiers,                       // full role→tier map, authoritative for all resolution
    practicedHint,               // one Practiced role surfaced in text (may be null)
    poorHint,                    // one Poor role surfaced in text (may be null)
    practicedSentence,           // pre-rolled hint sentence — static for this character's lifetime
    poorSentence,                // pre-rolled hint sentence — static for this character's lifetime
    backstory: pickBackstory(headlineRole),
    alive: true,
    currentAction: null,
    position: "campsite",
    suppliesBrought: rollStartingSupplies(headlineRole),
    daysWithoutFood: 0,
    weapon,                      // personal weapon — "sword+saex" or "spear+saex"
    // Injury arc — null = healthy; "hurt" = working but risky; "sorelyHurt" = cannot act
    injuryState: null,
    daysSinceTending: 0,         // Sorely Hurt death clock: 3 days untended → death
    tendingDaysAccumulated: 0    // days of Tend wounds received; 2 → step down one injury tier
  };
}

// Builds the full starting roster of five settlers
// and returns it as an array, ready to drop into gameState.characters.
function generateSettlers() {
  const names = pickUniqueNames(5);
  return names.map(createSettler);
}


// ---------------------------------------------
// VANGUARD SELECTION
// Before the day loop starts, the player is shown a pool of
// candidate men and picks exactly VANGUARD_SIZE to form the vanguard
// (currently equal to the live role count in ALL_SKILLS).
// A limited number of rerolls lets the player regenerate
// whichever candidates they haven't already picked.
// ---------------------------------------------

const CANDIDATE_POOL_SIZE = 8;
const MAX_REROLLS = 3;
// Vanguard size is hardcoded — it's the number of men the player
// fields, not derived from the skill pool. ALL_SKILLS may grow as
// new roles unlock; VANGUARD_SIZE stays 5 unless a design decision
// changes the vanguard headcount explicitly.
const VANGUARD_SIZE = 5;

let candidatePool = [];   // the current list of choosable men
let selectedIds = [];     // ids of candidates the player has picked
let rerollsRemaining = MAX_REROLLS;

// Builds a fresh pool of candidate men with two enforced constraints:
//
// 1. Unique full tier profiles — no two candidates may share an identical
//    role→tier map across all roles (checked via JSON.stringify).
//
// 2. Headline role cap — no single role may appear as the headline
//    (Seasoned) role more than MAX_SAME_HEADLINE times. With 7 roles and
//    8 cards, one role will always appear twice; this cap prevents the
//    3+ clustering that makes pools feel samey. Rerolls the headline
//    role (via createSettler) until the cap is satisfied.
//
// Both constraints loop with an attempt ceiling to avoid infinite loops
// in degenerate edge cases (e.g. very small role pools).
const MAX_SAME_HEADLINE = 2;

function generateCandidatePool(count) {
  const names = pickUniqueNames(count);
  const pool = [];
  const seenProfiles = new Set();
  const headlineCounts = {};

  for (const name of names) {
    let candidate;
    let attempts = 0;
    do {
      candidate = createSettler(name);
      const profileKey = JSON.stringify(candidate.tiers);
      const headlineOk = (headlineCounts[candidate.skill] || 0) < MAX_SAME_HEADLINE;
      const profileOk  = !seenProfiles.has(profileKey);
      if (headlineOk && profileOk) break;
      attempts++;
    } while (attempts < 30);

    seenProfiles.add(JSON.stringify(candidate.tiers));
    headlineCounts[candidate.skill] = (headlineCounts[candidate.skill] || 0) + 1;
    pool.push(candidate);
  }
  return pool;
}

// Renders the candidate pool as clickable cards.
// Turns a candidate's suppliesBrought object into a short readable
// line for their card, e.g. "4 rations"
function formatSupplies(supplies) {
  const labels = {
    rations: "rations",
    rawFood: "raw food",
    forageFood: "forage food",
    wood: "wood"
  };
  const parts = Object.keys(supplies).map(key => `${supplies[key]} ${labels[key]}`);
  return parts.join(", ");
}

// Silhouette SVG — generic standing figure used as portrait placeholder
// whenever a character has no portrait image assigned. Defined once here,
// embedded inline inside each portrait zone that needs it. Any character
// with a real portrait image will never see this — it only shows when
// candidate.portraitSrc is null/undefined.
const SILHOUETTE_SVG = `<svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg" fill="#3a2f1e">
  <circle cx="32" cy="14" r="11"/>
  <path d="M12 72 C12 50 20 42 32 40 C44 42 52 50 52 72 Z"/>
</svg>`;

// Builds the portrait zone HTML. Uses a real <img> if portraitSrc is set;
// falls back to the silhouette SVG placeholder otherwise.
function portraitZoneHTML(portraitSrc) {
  const inner = portraitSrc
    ? `<img src="${portraitSrc}" alt="">`
    : `<div class="portrait-placeholder">${SILHOUETTE_SVG}</div>`;
  return `
    <div class="candidate-portrait-zone">
      ${inner}
      <div class="candidate-portrait-fade"></div>
    </div>
  `;
}

// Human-readable weapon label for display.
function weaponDisplayLabel(weapon) {
  if (weapon === "sword+saex") return "Sword";
  if (weapon === "bow+saex")   return "Bow";
  return "Spear";
}

function renderCandidatePool() {
  const container = document.getElementById("candidatePool");
  container.innerHTML = "";

  candidatePool.forEach(candidate => {
    const isSelected = selectedIds.includes(candidate.id);
    const card = document.createElement("div");
    card.className = isSelected ? "candidate selected" : "candidate";

    // Hint sentences are pre-rolled at character creation and stored on the object —
    // reading them here keeps flavor text static across selection/deselection re-renders.
    const hintSuffix = [candidate.practicedSentence, candidate.poorSentence].filter(Boolean).join(" ");
    const flavorText = `${candidate.name}, ${candidate.backstory}${hintSuffix ? " " + hintSuffix : ""}`;

    card.innerHTML = `
      ${portraitZoneHTML(candidate.portraitSrc || null)}
      <div class="candidate-body">
        <p class="cand-name">${candidate.name}</p>
        <p class="cand-role">${candidate.skill}</p>
        <hr class="cand-divider">
        <p class="cand-flavor">${flavorText}</p>
        <div class="cand-footer">
          <p class="cand-supplies">${formatSupplies(candidate.suppliesBrought)}</p>
          <p class="cand-weapon">${weaponDisplayLabel(candidate.weapon)}</p>
        </div>
      </div>
    `;
    card.addEventListener("click", () => toggleCandidateSelection(candidate.id));
    container.appendChild(card);
  });

  document.getElementById("selectionInstructions").textContent =
    `Choose 5 men — ${selectedIds.length} of ${VANGUARD_SIZE} selected.`;

  const rerollBtn = document.getElementById("rerollBtn");
  if (rerollsRemaining === MAX_REROLLS) {
    rerollBtn.textContent = "Reroll Characters";
  } else {
    rerollBtn.textContent = rerollsRemaining === 1
      ? `1 Reroll Remaining`
      : `${rerollsRemaining} Rerolls Remaining`;
  }
  rerollBtn.disabled = rerollsRemaining === 0;

  document.getElementById("confirmVanguardBtn").disabled = selectedIds.length !== VANGUARD_SIZE;
}

// Adds or removes a candidate from the selection when clicked.
// Selection is capped at VANGUARD_SIZE — clicking past the cap does
// nothing until the player deselects one first.
function toggleCandidateSelection(candidateId) {
  if (selectedIds.includes(candidateId)) {
    selectedIds = selectedIds.filter(id => id !== candidateId);
  } else if (selectedIds.length < VANGUARD_SIZE) {
    selectedIds.push(candidateId);
  }
  renderCandidatePool();
}

// Rerolls only the candidates the player has NOT selected —
// picked men stay locked in. Costs one of the limited rerolls.
function rerollCandidates() {
  if (rerollsRemaining === 0) return;

  const keptCandidates = candidatePool.filter(c => selectedIds.includes(c.id));
  const rerollCount = CANDIDATE_POOL_SIZE - keptCandidates.length;

  const usedNames = keptCandidates.map(c => c.name);
  const freshCandidates = generateFreshCandidates(rerollCount, usedNames);

  candidatePool = [...keptCandidates, ...freshCandidates];
  rerollsRemaining -= 1;

  renderCandidatePool();
}

// Generates new candidates while avoiding name collisions with kept
// candidates, and respecting the same headline-role cap as the initial
// pool. Counts existing headline roles from the kept candidates so the
// cap applies across the whole pool, not just the fresh batch.
function generateFreshCandidates(count, excludeNames) {
  const keptCandidates = candidatePool.filter(c => selectedIds.includes(c.id));
  const headlineCounts = {};
  keptCandidates.forEach(c => {
    headlineCounts[c.skill] = (headlineCounts[c.skill] || 0) + 1;
  });

  const availableNames = NAME_POOL.filter(n => !excludeNames.includes(n));
  const shuffled = [...availableNames].sort(() => Math.random() - 0.5);
  const fresh = [];

  for (const name of shuffled.slice(0, count)) {
    let candidate;
    let attempts = 0;
    do {
      candidate = createSettler(name);
      attempts++;
    } while ((headlineCounts[candidate.skill] || 0) >= MAX_SAME_HEADLINE && attempts < 30);

    headlineCounts[candidate.skill] = (headlineCounts[candidate.skill] || 0) + 1;
    fresh.push(candidate);
  }
  return fresh;
}

// Called when the player confirms their chosen vanguard (VANGUARD_SIZE men).
// Moves the selected candidates into gameState, adds up what they
// brought with them into the starting resource pool, and starts the game.
function confirmVanguard() {
  const chosen = candidatePool.filter(c => selectedIds.includes(c.id));
  gameState.characters = chosen;

  applyStartingSupplies(chosen);

  document.getElementById("selectionScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  renderResources();
  renderRoster();
  updateStartDayAvailability();
}

// Sums up what the chosen vanguard brought with them and adds it
// to the starting resource pool. Replaces the old fixed starting
// amounts — what you bring now depends entirely on who you picked.
function applyStartingSupplies(chosenCharacters) {
  chosenCharacters.forEach(character => {
    const supplies = character.suppliesBrought;
    for (const resource in supplies) {
      gameState.resources[resource] += supplies[resource];
    }
  });
}


// ---------------------------------------------
// DISPLAY
// Rendering is kept separate from simulation logic.
// These functions only read gameState — they never modify it.
// ---------------------------------------------

// Maps a character state name to its CSS color variable value.
// Used inline on the state word span. Injury states use a separate
// amber/rust palette so they're visually distinct from hunger desaturation.
const STATE_WORD_COLORS = {
  hungry:      "var(--color-state-hungry)",
  starving:    "var(--color-state-starving)",
  hurt:        "var(--color-state-hurt)",
  sorelyHurt:  "var(--color-state-sorely-hurt)"
};

// Builds the face-crop portrait zone for a game screen card.
// Uses a real img if portraitSrc is set; falls back to silhouette.
function faceCropHTML(portraitSrc) {
  const inner = portraitSrc
    ? `<img src="${portraitSrc}" alt="">`
    : `<div class="face-placeholder">${SILHOUETTE_SVG}</div>`;
  return `<div class="char-face">${inner}</div>`;
}

// Builds the action slot for a character.
// Empty = tappable well; assigned = shows abbreviated action label.
// Locked = Sorely Hurt character cannot be assigned any action.
function actionSlotHTML(character) {
  if (character.injuryState === "sorelyHurt") {
    return `
      <div class="action-slot locked" data-character-id="${character.id}" title="Cannot act — sorely hurt">
        <svg class="action-slot-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>`;
  }
  if (!character.currentAction) {
    return `
      <div class="action-slot empty" data-character-id="${character.id}" title="Assign action">
        <div class="action-slot-icon-placeholder"></div>
      </div>`;
  }
  // Abbreviate the action label to fit the 32px slot — first word only.
  const label = actionDisplayLabel(character.currentAction).split(" ")[0];
  return `
    <div class="action-slot assigned" data-character-id="${character.id}">
      <div class="action-slot-label">${label}</div>
    </div>`;
}

// Renders the full roster into #roster using the new parchment card system.
// Each card is collapsed by default; tapping the card body toggles expansion.
// Tapping the action slot opens the Action Tray for that character.
function renderRoster() {
  const container = document.getElementById("roster");
  container.innerHTML = "";

  gameState.characters.forEach(character => {
    const card = document.createElement("div");
    const hunger = hungerStage(character);
    const injury = character.injuryState; // "hurt", "sorelyHurt", or null

    let cardClasses = "char-card";
    if (!character.alive) {
      cardClasses += " dead";
    } else {
      // Injury and hunger can co-exist; injury class takes visual precedence
      // (rendered after hunger so it overrides the border/bg if both present)
      if (hunger) cardClasses += ` ${hunger}`;
      if (injury === "hurt") cardClasses += " hurt";
      if (injury === "sorelyHurt") cardClasses += " sorely-hurt";
    }
    card.className = cardClasses;
    card.dataset.characterId = character.id;

    if (character.alive) {
      // Build state word — injury takes precedence over hunger in display
      // since "sorely hurt" is the more actionable piece of information.
      let stateWordHTML = "";
      if (injury) {
        const displayLabel = injury === "sorelyHurt" ? "sorely hurt" : "hurt";
        stateWordHTML = `<span class="char-state-word" style="color:${STATE_WORD_COLORS[injury] || '#555'}">${displayLabel}</span>`;
      } else if (hunger) {
        stateWordHTML = `<span class="char-state-word" style="color:${STATE_WORD_COLORS[hunger] || '#555'}">${hunger}</span>`;
      }

      // Hint sentences are pre-rolled at character creation — read stored values here.
      const hintSuffix = [character.practicedSentence, character.poorSentence].filter(Boolean).join(" ");
      const flavorText = `${character.name}, ${character.backstory}${hintSuffix ? " " + hintSuffix : ""}`;

      card.innerHTML = `
        <div class="char-card-row">
          ${faceCropHTML(character.portraitSrc || null)}
          <div class="char-identity">
            <span class="char-name">${character.name}</span>
            <span class="char-role">${character.skill}</span>
            ${stateWordHTML}
          </div>
          <div class="char-action-col">
            ${actionSlotHTML(character)}
          </div>
        </div>
        <div class="char-flavor-row">
          <p class="char-flavor-text">${flavorText}</p>
        </div>
      `;

      // Tap card body → toggle expansion (not the action slot)
      card.querySelector(".char-card-row").addEventListener("click", e => {
        if (e.target.closest(".char-action-col")) return; // let slot handle it
        card.classList.toggle("expanded");
      });

      // Tap action slot → open tray for this character (unless locked = Sorely Hurt)
      card.querySelector(".action-slot").addEventListener("click", e => {
        e.stopPropagation();
        if (character.injuryState === "sorelyHurt") return; // locked — no tray
        openActionTray(character.id);
      });

    } else {
      // Dead card — identity only, no action slot, no expansion
      card.innerHTML = `
        <div class="char-card-row">
          ${faceCropHTML(character.portraitSrc || null)}
          <div class="char-identity" style="flex:1">
            <span class="char-name">${character.name}</span>
            <span class="char-state-word" style="color:var(--color-state-dead)">dead</span>
          </div>
        </div>
      `;
    }

    container.appendChild(card);
  });
}

// Enables the Start Day button only once every living, assignable vanguard
// member has an action. Sorely Hurt characters cannot be assigned and are
// excluded from this check — their locked slot doesn't block the day.
function updateStartDayAvailability() {
  const button = document.getElementById("startDayBtn");
  const unassignedCount = gameState.characters.filter(
    c => c.alive && c.injuryState !== "sorelyHurt" && !c.currentAction
  ).length;
  button.disabled = unassignedCount > 0;
}

// ---------------------------------------------
// ACTION TRAY
// Bottom sheet that lets the player assign an action to a character.
// One tray instance is shared across all characters — context switches
// when the player taps a different character's slot while the tray is open.
// ---------------------------------------------

let activeTrayCharacterId = null; // which character's slot opened the tray

// Groups for the action tray, in display order.
// Each group is an array of action ids from ACTION_POOL.
// Group dividers render between groups; no labels shown.
// "Tend wounds" appears only when at least one other living character is Sorely Hurt or Hurt —
// filtered in buildTrayRows so it doesn't clutter the tray on healthy runs.
const ACTION_TRAY_GROUPS = [
  ["Cook provisions", "Stalk beasts", "Gather mast"],     // Provisions
  ["Build Palisade", "Fell timber"],                       // Fortification & Timber
  ["Keep ward", "Spy out"],                                // Watch & Recon
  ["Tend wounds"]                                          // Care — shown only when relevant
];

// Builds the action tray row list for a specific character.
// Reflects all available actions; selected action gets slate color.
// "Tend wounds" only appears when at least one other living character is
// Hurt or Sorely Hurt — avoids cluttering the tray when no one needs care.
function buildTrayRows(character) {
  const tray = document.getElementById("trayActionList");
  tray.innerHTML = "";

  // Is anyone (besides this character) in need of tending?
  const anyoneNeedsTending = gameState.characters.some(
    c => c.alive && c.id !== character.id && c.injuryState !== null
  );

  let groupsRendered = 0;
  ACTION_TRAY_GROUPS.forEach((group) => {
    // Filter out Tend wounds if no one needs it
    const filteredGroup = group.filter(action => {
      if (action === "Tend wounds") return anyoneNeedsTending;
      return true;
    });
    if (filteredGroup.length === 0) return;

    if (groupsRendered > 0) {
      const rule = document.createElement("div");
      rule.className = "tray-group-rule";
      tray.appendChild(rule);
    }

    filteredGroup.forEach(action => {
      const isSelected = character.currentAction === action;
      const row = document.createElement("div");
      row.className = "tray-action-row" + (isSelected ? " tray-selected" : "");
      row.innerHTML = `
        <div class="tray-icon-box"><div class="tray-icon-inner"></div></div>
        <span class="tray-action-name">${actionDisplayLabel(action)}</span>
      `;
      row.addEventListener("click", () => {
        assignActionFromTray(character.id, action);
      });
      tray.appendChild(row);
    });

    groupsRendered++;
  });
}

// Opens the action tray for the given character.
// If already open for a different character, context-switches without closing.
function openActionTray(characterId) {
  const character = gameState.characters.find(c => c.id === characterId);
  if (!character || !character.alive) return;

  // If tapping the same slot that's already open, close instead.
  if (activeTrayCharacterId === characterId && document.getElementById("actionTray").classList.contains("open")) {
    closeActionTray();
    return;
  }

  activeTrayCharacterId = characterId;
  document.getElementById("trayHeader").textContent = `Assign ${character.name}`;
  buildTrayRows(character);
  document.getElementById("actionTray").classList.add("open");
}

// Closes the tray and clears active context.
function closeActionTray() {
  document.getElementById("actionTray").classList.remove("open");
  activeTrayCharacterId = null;
}

// Called when the player taps an action row in the tray.
// Assigns the action to the character, auto-closes tray, re-renders.
function assignActionFromTray(characterId, action) {
  const character = gameState.characters.find(c => c.id === characterId);
  if (!character) return;

  character.currentAction = action;
  closeActionTray();
  renderRoster();
  updateStartDayAvailability();
}

// ---------------------------------------------
// DAY SIMULATION
// Each function here resolves ONE task for ONE character
// and returns a log line describing what happened.
// None of these touch the DOM — display reads gameState after.
// ---------------------------------------------

// Maps each skill-gated action to the role that's considered a match
// for it. Used by getSkillTier() to determine which tier applies.
// Build Palisade's skill is resolved per-stage instead (see
// FORTIFICATION_STAGES), so it has no flat entry here.
const SKILL_FOR_ACTION = {
  "Fell timber":    "Hewer",
  "Stalk beasts":   "Veneur",
  "Cook provisions":"Master Cook",
  "Gather mast":    "Gatherer",
  "Spy out":        "Veneur",   // Outrider is tabled, see design doc
  "Tend wounds":    "Gatherer"  // Gatherer = primary; any character can attempt, Poor tier carries risk
};

// Actions where a SECOND role also qualifies as primary-band, alongside
// whatever SKILL_FOR_ACTION says (or, for Keep ward, as the only
// primary role — Keep ward has no SKILL_FOR_ACTION entry at all).
const SECONDARY_PRIMARY_ACTION_SKILLS = {
  "Keep ward": "Man-at-Arms",
  "Spy out":   "Man-at-Arms"
};

// ---------------------------------------------
// SKILL TIER RESOLUTION
//
// Reads a character's tier for the relevant role from character.tiers,
// then maps the four stored values (Seasoned/Practiced/Base/Poor) to
// the three mechanical bands the resolvers use:
//
//   Seasoned  → "primary"   (best yield/odds)
//   Practiced → "secondary" (moderate)
//   Base      → "base"      (untrained — competent floor, not blocked)
//   Poor      → "poor"      (below floor — real penalty)
//
// Each resolver (resolveHunt, resolveCook, etc.) defines what each
// band means for its own task — getSkillTier only answers which band
// applies, not how big the gap is.
//
// Tasks with two qualifying roles (Scout, Perimeter Watch) take the
// better of the two tier readings — a Man-at-Arms on Scout duty uses
// whichever of Veneur or Man-at-Arms gives him the higher band.
// ---------------------------------------------

// Maps stored tier strings to mechanical band strings.
const TIER_TO_BAND = {
  "Seasoned":  "primary",
  "Practiced": "secondary",
  "Base":      "base",
  "Poor":      "poor"
};

// Returns the better of two mechanical bands.
function betterBand(a, b) {
  const order = ["primary", "secondary", "base", "poor"];
  return order.indexOf(a) <= order.indexOf(b) ? a : b;
}

function getSkillTier(character, action) {
  // Build Palisade: primary skill changes per Fortification stage.
  const matchingSkill = action === "Build Palisade"
    ? currentFortificationSkill()
    : SKILL_FOR_ACTION[action];
  const altSkill = SECONDARY_PRIMARY_ACTION_SKILLS[action] || null;

  if (!matchingSkill && !altSkill) return "base";

  const mainBand = matchingSkill && character.tiers[matchingSkill]
    ? TIER_TO_BAND[character.tiers[matchingSkill]]
    : "base";
  const altBand = altSkill && character.tiers[altSkill]
    ? TIER_TO_BAND[character.tiers[altSkill]]
    : "base";

  return matchingSkill && altSkill
    ? betterBand(mainBand, altBand)
    : matchingSkill ? mainBand : altBand;
}

// Which skill is "primary" for whichever Fortification stage is
// currently active. Returns null once the whole track is complete
// (no stage left to match against).
function currentFortificationSkill() {
  const stage = FORTIFICATION_STAGES[gameState.fortification.stageIndex];
  return stage ? stage.skill : null;
}

// ---------------------------------------------
// YIELD ROLLING
// Shared helpers for tasks that produce a resource in a range
// rather than a fixed amount. See design-rationale.md.
// ---------------------------------------------

// Rolls a yield within [min, max] inclusive.
function rollYield(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

// Picks a flavor-text quality tier based on where the roll landed
// in its possible range, so the player gets a sense of "that went
// badly" or "that went great" rather than just a number.
function yieldQualityTier(amount, min, max) {
  if (amount === 0) return "nothing";
  const range = max - min || 1;
  const position = (amount - min) / range; // 0 to 1
  if (position < 0.34) return "poor";
  if (position < 0.7) return "average";
  return "great";
}

// Picks the [min, max] yield range for a character on a given task,
// based on their skill tier (primary/secondary/base). Each task
// resolver defines its own three ranges and calls this to select
// the right one — keeps the three-tier logic in one place instead
// of repeated per task.
function rangeForTier(tier, ranges) {
  return ranges[tier];
}


// Woodcutting: High-skill weight (Hewer). A Hewer reliably gets good
// wood from a tree; anyone else genuinely struggles to fell and work
// one cleanly. Poor tier can waste the tree almost entirely.
function resolveWoodcutting(character) {
  const tier = getSkillTier(character, "Fell timber");
  const ranges = {
    primary:   [4, 7],
    secondary: [2, 4],
    base:      [0, 2],
    poor:      [0, 1]   // likely to ruin or waste most of the tree
  };
  const [min, max] = rangeForTier(tier, ranges);

  if (gameState.environment.treesRemainingNearby === 0) {
    return `${character.name} searched nearby but found no trees left standing — the camp will need to scout further afield.`;
  }

  const logs = rollYield(min, max);
  const qualityTier = yieldQualityTier(logs, min, max);
  gameState.environment.treesRemainingNearby -= 1;
  gameState.resources.wood += logs;

  if (tier === "poor" && logs === 0) {
    return `${character.name} felled a tree but made a ruin of the work — the wood split wrong and nothing came of it.`;
  }
  const flavor = {
    nothing: `${character.name} felled a tree but the wood was rotten through — nothing usable came of it.`,
    poor: `${character.name} felled a tree and managed only ${logs} rough logs from it.`,
    average: `${character.name} felled a tree and worked it into ${logs} logs.`,
    great: `${character.name} felled a tree and made unusually good use of it — ${logs} solid logs.`
  };
  return flavor[qualityTier];
}

// Build Palisade: man-day accounting against the Fortification track's
// locked stage costs (see FORTIFICATION_STAGES). Skill tier changes how
// many man-days a character contributes in a day — it does not roll
// Earthwork stages (Bailey Grounds, Motte Ditch): no-skill weight per
// the locked model — "anyone can dig a ditch." A Fossier's presence
// doesn't raise yield the way a Carpenter's does on timber stages; it
// lowers the odds and severity of a rough day. Three-outcome severity
// band per day of work, rather than one flat pass/fail roll:
//   - Minor: full man-day contributed, flavor only.
//   - Partial: half man-day contributed — real but reduced progress.
//   - Lost day: 0 man-days — the day is a genuine loss (wood, if any,
//     was already spent by the caller before this runs).
// Fossier (primary) sits mostly in Minor, rarely Partial, almost
// never Lost. No Fossier (base) sees meaningfully more Partial/Lost,
// but Lost stays the rare tail — a tax, never a blocker, per the
// locked "no-skill tasks are competent-by-default" principle.
