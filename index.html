<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Barbarians v0.2.3.0 — Expandable die-face cards; portrait modal; backstory on face tap -->
<title>Barbarians</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral+SC:wght@400;600;700&family=Spectral:ital,wght@0,400;0,700;1,400;1,700&display=swap');

/* ═══════════════════════════════════════
   TOKENS — production parchment system
═══════════════════════════════════════ */
:root {
  --color-parchment:        #eee5d2;
  --color-parchment-mid:    #d8ccb4;
  --color-parchment-deep:   #c8b89a;
  --color-card-bg:          #f5ede0;
  --color-card-portrait-bg: #d8ccb4;

  --color-ink-primary:   #2a1f10;
  --color-ink-secondary: #3a2f1e;
  --color-ink-role:      #7a5c2e;
  --color-ink-ornament:  #b8a07a;
  --color-ink-muted:     #9a8060;

  --color-selected:      #8b3a2f;
  --color-threat:        #8b3a2f;
  --color-selected-glow: rgba(139,58,47,0.2);

  --color-supplies-parchment: #5a7a4a;
  --color-weapon-parchment:   #4f6470;
  --color-accent-slate:       #4f6470;
  --color-accent-ochre:       #8b6914;
  --color-accent-ochre-bg:    rgba(139,105,20,0.12);
  --color-accent-verdigris:   #4a7a6a;
  --color-accent-verdigris-bg: rgba(74,122,106,0.15);

  --font-display:  'Spectral SC', Georgia, serif;
  --font-body:     'Spectral', Georgia, serif;
  --font-numeric:  'Trebuchet MS', Arial, sans-serif;

  --text-xs:   11px;
  --text-sm:   12px;
  --text-base: 13px;
  --text-md:   14px;
  --text-lg:   16px;

  --leading-tight: 1.2;
  --leading-base:  1.65;

  --tracking-wide:   0.1em;
  --tracking-wider:  0.14em;
  --tracking-widest: 0.2em;

  --card-radius:          10px;
  --card-border-well:     1px solid #c8b89a;
  --card-border-selected: 1px solid #8b3a2f;
  --card-shadow-selected: 0 0 0 2px rgba(139,58,47,0.2);
  --card-padding:         12px;
  --card-height-collapsed: 64px;
  --card-right-width:      64px;
  --action-slot-size:      52px;
  --action-slot-radius:    6px;
  --action-slot-empty-shadow: inset 1px 2px 4px rgba(50,20,5,0.09);
  --color-slot-assigned-bg: rgba(138,106,58,0.13);
  --color-slot-empty-bg:    #e8dbc6;

  --portrait-height-full:  170px;
  --portrait-fade-height:  80px;

  --gap-xs: 4px;
  --gap-sm: 8px;
  --gap-md: 12px;
  --gap-lg: 16px;

  --divider-ink:   linear-gradient(to right, transparent, rgba(200,184,154,0.7), transparent);
  --portrait-fade: linear-gradient(to bottom, rgba(238,229,210,0) 0%, rgba(238,229,210,0.6) 50%, #eee5d2 88%);

  --transition-card:  150ms ease;
  --transition-tray:  200ms ease-out;
  --transition-screen: 300ms ease-in-out;

  /* (die chip tokens removed — skill chips use action-slot sizing directly) */
}

/* ═══════════════════════════════════════
   RESET / BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--color-parchment);
  font-family: var(--font-body);
  color: var(--color-ink-secondary);
}

/* ═══════════════════════════════════════
   SCREEN MANAGEMENT
═══════════════════════════════════════ */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; height: 100%; }

/* ═══════════════════════════════════════
   SKILL CHIPS
   Same aesthetic as assigned action slot:
   rgba(138,106,58,0.13) bg, 6px radius, 32×32.
   Content: skill name + pips stacked, no SVG.
═══════════════════════════════════════ */

/* Horizontal strip — always visible in game card row */
/* ── Collapsed card row — no skills visible ── */
.char-card-row {
  display: flex;
  align-items: stretch;
  height: 52px;
}

/* ── Expanded die strip ── */
.char-die-row {
  display: none;
  padding: 8px 10px 10px;
  gap: 6px;
  border-top: 1px solid var(--color-parchment-deep);
  background: rgba(0,0,0,0.018);
  flex-wrap: wrap;
}
.char-card.expanded .char-die-row { display: flex; }

/* ── Die chip ── */
.die-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.die-face {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--color-card-bg);
  border: 1px solid var(--color-parchment-deep);
  box-shadow: inset 0 1px 3px rgba(50,30,5,0.10), 0 1px 2px rgba(255,255,255,0.7);
  position: relative;
  flex-shrink: 0;
}
/* 9-position pip grid — col: l/c/r  row: t/m/b
   Inset 22% from each edge so pips never crowd the corners */
.die-pip {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--color-accent-slate);
  box-shadow: inset 0 1px 1px rgba(0,0,0,0.25);
  transform: translate(-50%, -50%);
}
.die-pip.l { left: 28%; } .die-pip.c { left: 50%; } .die-pip.r { left: 72%; }
.die-pip.t { top: 28%; }  .die-pip.m { top: 50%; }  .die-pip.b { top: 72%; }

.die-label {
  font-family: var(--font-display);
  font-size: 6.5px;
  letter-spacing: 0.06em;
  color: var(--color-accent-slate);
  text-transform: uppercase;
  text-align: center;
  line-height: 1;
  white-space: nowrap;
}

/* Die grid for selection card — 3×2 grid of real die faces */
.die-grid {
  display: grid;
  grid-template-columns: repeat(3, 36px);
  gap: 8px;
  justify-content: center;
  padding: 4px 0;
}

/* Skill chip — used by selection screen die grid */
.skill-chip {
  border-radius: 6px;
  background: var(--color-slot-assigned-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 3px 3px;
}
.skill-chip-name {
  font-family: var(--font-display);
  font-size: 7.5px;
  letter-spacing: 0.04em;
  color: var(--color-accent-slate);
  text-transform: uppercase;
  text-align: center;
  line-height: 1;
  white-space: nowrap;
}
.skill-pips {
  display: flex;
  gap: 2.5px;
  align-items: center;
  justify-content: center;
}
.skill-pip { width: 4px; height: 4px; border-radius: 50%; background: rgba(79,100,112,0.22); }
.skill-pip.on { background: var(--color-accent-slate); }

/* ── Portrait modal ── */
.portrait-modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,18,6,0.55);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.portrait-modal-backdrop.open { display: flex; }

.portrait-modal-card {
  width: min(75vw, calc(75vh * 0.667));
  height: min(75vh, calc(75vw * 1.5));
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--color-parchment-deep);
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(20,10,2,0.45);
}
.portrait-modal-face {
  flex: 0 0 55%;
  background: var(--color-card-portrait-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--color-parchment-deep);
}
.portrait-modal-face svg { width: 140px; height: 140px; opacity: 0.28; }

.portrait-modal-text {
  flex: 1;
  background: var(--color-card-bg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
.portrait-modal-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--color-ink-primary);
  letter-spacing: var(--tracking-wide);
}
.portrait-modal-role {
  font-family: var(--font-display);
  font-size: 11px;
  color: var(--color-ink-role);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wider);
  margin-bottom: 4px;
}
.portrait-modal-backstory {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 14px;
  color: var(--color-ink-secondary);
  line-height: 1.65;
}

/* ═══════════════════════════════════════
   SHARED — INK RULE
═══════════════════════════════════════ */
.game-rule {
  height: 1px;
  background: var(--divider-ink);
  border: none;
  margin: 0;
}

/* ═══════════════════════════════════════
   SELECTION SCREEN
═══════════════════════════════════════ */
#selectionScreen {
  overflow: hidden;
  background: var(--color-parchment);
}

.sel-header {
  flex-shrink: 0;
  text-align: center;
  padding: 22px 16px 12px;
}

.sel-title {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--color-ink-primary);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  line-height: 1;
}

.sel-rule {
  height: 1px;
  background: var(--divider-ink);
  border: none;
  margin: 0 auto 8px;
  max-width: 200px;
}

.sel-instruction {
  font-family: var(--font-body);
  font-style: italic;
  font-size: var(--text-lg);
  color: var(--color-ink-muted);
  margin: 0;
}

.sel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px;
}

.candidate-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--gap-md);
  max-width: 680px;
  margin: 0 auto;
}

/* ── Candidate card ── */
.cand-card {
  background: var(--color-card-bg);
  border: var(--card-border-well);
  border-radius: var(--card-radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--transition-card), box-shadow var(--transition-card);
  display: flex;
  flex-direction: column;
  user-select: none;
}

.cand-card:hover { border-color: var(--color-parchment-deep); }

.cand-card.selected {
  border: var(--card-border-selected);
  box-shadow: var(--card-shadow-selected);
}

.cand-portrait-zone {
  position: relative;
  height: var(--portrait-height-full);
  background: var(--color-card-portrait-bg);
  overflow: hidden;
  flex-shrink: 0;
}

.portrait-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}

.portrait-placeholder svg { width: 72px; height: 72px; opacity: 0.28; }

.portrait-fade {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: var(--portrait-fade-height);
  background: var(--portrait-fade);
  pointer-events: none;
}

.cand-body {
  padding: var(--card-padding);
  display: flex;
  flex-direction: column;
  gap: var(--gap-xs);
  flex: 1;
}

.cand-name {
  font-family: var(--font-display);
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--color-ink-primary);
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.cand-role {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  color: var(--color-ink-role);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wider);
}

.cand-divider {
  height: 1px;
  background: var(--divider-ink);
  border: none;
  margin: 4px 0;
}

.cand-flavor {
  font-family: var(--font-body);
  font-style: italic;
  font-size: var(--text-base);
  color: var(--color-ink-secondary);
  line-height: var(--leading-base);
  flex: 1;
}

.cand-footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: var(--gap-xs);
}

.cand-supplies {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  color: var(--color-supplies-parchment);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.cand-weapon {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  color: var(--color-selected);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

/* Selection footer */
.sel-footer {
  flex-shrink: 0;
  border-top: 1px solid var(--color-parchment-deep);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap-md);
  background: var(--color-parchment);
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

.sel-btn {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 150ms ease;
}

.sel-btn:disabled { opacity: 0.38; cursor: not-allowed; }

.sel-btn-secondary {
  background: transparent;
  border: 1.5px solid var(--color-parchment-deep);
  color: var(--color-ink-muted);
}

.sel-btn-secondary:not(:disabled):hover { background: rgba(200,184,154,0.18); }

.sel-btn-primary {
  background: transparent;
  border: 1.5px solid var(--color-selected);
  color: var(--color-selected);
}

.sel-btn-primary:not(:disabled):hover { background: rgba(139,58,47,0.06); }

/* ═══════════════════════════════════════
   GAME SCREEN — two-tab layout
═══════════════════════════════════════ */
#gameScreen {
  overflow: hidden;
  background: var(--color-parchment);
}

/* Sticky game header — always visible above tabs */
#gameHeader {
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--color-parchment);
  z-index: 40;
}

/* Tab content area — fills space between header and tab bar */
#tabContent {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Individual tab panes */
.tab-pane {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
.tab-pane.active {
  display: flex;
}

/* Men tab — column: roster scrolls, button pins to bottom */
#tabMen {
  /* flex column inherited from .tab-pane, just needs overflow:hidden so roster scrolls */
  overflow: hidden;
}

/* Journal tab — full height scrollable */
#tabJournal {
  overflow-y: auto;
  padding: 0 14px;
  padding-bottom: 16px;
}

/* ── Tab bar ── */
#tabBar {
  flex-shrink: 0;
  display: flex;
  border-top: 1px solid var(--color-parchment-deep);
  background: var(--color-parchment);
  padding-bottom: env(safe-area-inset-bottom, 12px);
}

.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 4px 8px;
  background: none;
  border: none;
  cursor: pointer;
  gap: 3px;
  -webkit-tap-highlight-color: transparent;
}

.tab-btn-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--color-ink-ornament);
  transition: color 120ms ease;
}

.tab-btn.active .tab-btn-label {
  color: var(--color-ink-primary);
}

.tab-btn-pip {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: transparent;
  transition: background 120ms ease;
}

.tab-btn.active .tab-btn-pip {
  background: var(--color-selected);
}

/* Status bar */
#statusBar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px 8px;
  gap: var(--gap-sm);
}

.sb-left {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-shrink: 0;
}

.sb-title {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-ink-primary);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}

.sb-version {
  font-family: var(--font-display);
  font-size: 7px;
  color: var(--color-ink-primary);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
  opacity: 0.5;
}

/* Resource strip */
#siteCard {
  background: var(--color-card-bg);
  border: var(--card-border-well);
  border-radius: var(--card-radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#siteMeta {
  flex: 1;
  padding: 16px 14px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 80px;
}

#siteState {
  font-family: var(--font-display);
  font-size: var(--text-lg, 1.1rem);
  color: var(--color-ink-primary);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  text-align: center;
}

/* Projects area — site development and structures */
#siteProjects {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.site-section-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-ornament);
  margin-top: 4px;
  align-self: center;
}

.site-projects-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  width: 100%;
}

.site-project {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 10px;
  background: var(--color-parchment);
  border: 1px solid var(--color-parchment-deep);
  border-radius: 6px;
  min-width: 80px;
}

.site-project-name {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-role);
}

.site-project-status {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-style: italic;
  text-align: center;
}

.building-chip {
  font-family: var(--font-display);
  font-size: var(--text-xs);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-role);
  background: transparent;
  border: 1px solid var(--color-ink-ornament);
  border-radius: 4px;
  padding: 3px 9px;
  position: relative;
  cursor: default;
}

/* Tooltip on building chips */
.building-chip[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-ink-primary);
  color: var(--color-parchment);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0;
  white-space: nowrap;
  padding: 5px 8px;
  border-radius: 4px;
  pointer-events: none;
  z-index: 50;
}
.building-chip[data-tip]:hover::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--color-ink-primary);
  pointer-events: none;
  z-index: 50;
}

/* Site card row — site card + optional structures card side by side */
#siteCardRow {
  display: flex;
  gap: 8px;
  margin: 0 14px;
  align-items: stretch;
}

#siteCard {
  flex: 1;
  min-width: 0;
}

/* Structures card — appears once first structure is built */
#structuresCard {
  background: var(--color-card-bg);
  border: var(--card-border-well);
  border-radius: var(--card-radius);
  padding: 10px 12px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

#structuresCard.visible {
  display: flex;
}

.structures-card-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-ornament);
}

#structuresList {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
  font-family: var(--font-display);
  font-size: var(--text-xs);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-accent-slate);
  text-align: center;
  padding: 4px 0 2px;
}

/* Fortification stage dots */
#siteStage {
  display: flex;
  flex-direction: row;
  gap: 14px;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin: 6px 0 4px;
}

.stage-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
  background: var(--color-parchment-deep);
  border: 1px solid var(--color-ink-ornament);
}

.stage-dot.in-progress {
  background: var(--color-parchment-deep);
  border-color: var(--color-accent-slate);
}

.stage-dot.on {
  background: var(--color-accent-slate);
  border-color: var(--color-accent-slate);
}

/* ═══════════════════════════════════════
   RESOURCE LEDGER CARD
═══════════════════════════════════════ */
#resourceLedger {
  background: var(--color-card-bg);
  border: var(--card-border-well);
  border-radius: var(--card-radius);
  margin: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;

  overflow-wrap: normal;
}



@media (max-width: 600px) {
  .candidate-grid { grid-template-columns: 1fr; }
}

<body>

<!-- SELECTION SCREEN -->

<script>
/* ICONS removed — skill chips use text labels only (SVG icons in future pass) */

const SILHOUETTE = `<svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg" fill="#3a2f1e"><circle cx="32" cy="14" r="11"/><path d="M12 72 C12 50 20 42 32 40 C44 42 52 50 52 72 Z"/></svg>`;

/* ─────────────────────────────────────────────
   NAME POOL — Norman and Anglo-Saxon names, period-appropriate.
   Shuffled each page load; assigned to candidates in order, no repeats.
───────────────────────────────────────────── */
const NAME_POOL = [
  // Norman
  'Robert','Roger','Walter','William','Hubert','Ranulf','Gilbert','Hugh',
  'Ralph','Geoffrey','Richard','Henry','Simon','Odo','Fulk','Eustace',
  // Anglo-Saxon
  'Edmund','Aelfric','Wulfstan','Leofric','Osric','Godwin','Aldric',
  'Cynric','Eadric','Brictric','Siward','Ulf','Grimr','Alwin','Dunstan',
];

function shuffledNames() {
  const pool = [...NAME_POOL];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool;
}


/* ─────────────────────────────────────────────
   CANDIDATE GENERATOR
   Each call produces 8 unique candidates, one per role.
   Faces: sig skill (level 4) + Labor (1–2) + 4 random skills (1–3).
   No two candidates share an identical face set within a generation.
───────────────────────────────────────────── */
const ALL_SKILLS = ['Hunt','Gather','Cook','Forestry','Carpentry','Labor','Earthworks','Fight','Craft'];

const ROLE_DEFS = [
  { role: 'Veneur',      sig: 'Hunt',       weapon: 'Bow',   supplies: { rations: 3 },
    backstory: 'Grew up reading the forest floor before he could read a page.' },
  { role: 'Fossier',     sig: 'Earthworks', weapon: 'Spear', supplies: { rations: 4 },
    backstory: 'Has moved more earth than most men see in a lifetime.' },
  { role: 'Woodward',    sig: 'Forestry',   weapon: 'Spear',
    backstory: "Reads a tree's grain the way a priest reads scripture." },
  { role: 'Man-at-Arms', sig: 'Fight',      weapon: 'Sword', supplies: { rations: 3 }, laborMin: 2,
    backstory: 'Survived a border skirmish that killed most of his unit.' },
  { role: 'Carpenter',   sig: 'Carpentry',  weapon: 'Spear',
    backstory: 'Left an apprenticeship unfinished when the roads north grew too dangerous.' },
  { role: 'Gatherer',    sig: 'Gather',     weapon: 'Spear', supplies: { rations: 3 },
    backstory: "Knows which roots won't kill you and which ones are merely unpleasant." },
  // { role: 'Outrider', sig: 'Hunt', weapon: 'Spear', supplies: { rations: 3 },  // Not yet in game
  //   backstory: 'Sent ahead of columns more times than he can count, and came back every one.' },
];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// Convert integer to Roman numeral (supports 1–6 for die levels).
function toRoman(n) {
  const map = [[6,'VI'],[5,'V'],[4,'IV'],[3,'III'],[2,'II'],[1,'I']];
  for (const [v, r] of map) { if (n >= v) return r; }
  return 'I';
}

// Overall character level = floor(average of all face pip levels).
// Gives the player a single-glance power reading without surfacing individual skill numbers.
function characterLevel(faces) {
  if (!faces || faces.length === 0) return 1;
  const sum = faces.reduce((s, f) => s + f.level, 0);
  return Math.max(1, Math.floor(sum / faces.length));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateFaces(sigSkill, laborMin = 1) {
  const laborLevel = rand(laborMin, 2);
  // Pool: all skills except sig and Labor
  const pool = ALL_SKILLS.filter(s => s !== sigSkill && s !== 'Labor');
  const picked = shuffle(pool).slice(0, 4);
  return [
    { skill: sigSkill, level: 4 },
    { skill: 'Labor',  level: laborLevel },
    ...picked.map(s => ({ skill: s, level: rand(1, 3) })),
  ];
}

function facesKey(faces) {
  return faces.map(f => `${f.skill}:${f.level}`).sort().join('|');
}

// Randomize supplies per candidate — type weighted by role, amount varies.
// Weapons stay role-fixed; supplies are the candidate's personal kit.
function randomSupplies() {
  return { rations: rand(2, 5) };
}

function generateCandidates() {
  const seen = new Set();       // face-set uniqueness
  const roleCounts = {};        // max 2 of any role

  // Build a shuffled pool allowing up to 2 of each role (16 slots), pick 8
  let pool = [...ROLE_DEFS, ...ROLE_DEFS]; // each role twice
  pool = shuffle(pool);

  const picked = [];
  for (const def of pool) {
    if (picked.length === 8) break;
    roleCounts[def.role] = (roleCounts[def.role] || 0);
    if (roleCounts[def.role] >= 2) continue;

    let faces, key, attempts = 0;
    do {
      faces = generateFaces(def.sig, def.laborMin || 1);
      key = facesKey(faces);
      attempts++;
    } while (seen.has(key) && attempts < 20);
    seen.add(key);
    roleCounts[def.role]++;
    picked.push({ ...def, faces, supplies: randomSupplies() });
  }

  const shuffledN = shuffledNames();
  return picked.map((def, i) => ({
    name: shuffledN[i], role: def.role, weapon: def.weapon,
    supplies: def.supplies, backstory: def.backstory, faces: def.faces,
  }));
}

// Live candidate list — regenerated on load and reroll.
let ALL_CANDIDATES = generateCandidates();

  rawFoodLog: [],

  seenResources: new Set(),  // resources shown at least once

  events: {

// Single skill chip — name + pips, no SVG icon
// Real d6 pip layouts — [col, row] pairs mapping to CSS classes l/c/r × t/m/b
const DIE_FACE_PIPS = {
  1: [['c','m']],
  2: [['r','t'],['l','b']],
  3: [['r','t'],['c','m'],['l','b']],
  4: [['l','t'],['r','t'],['l','b'],['r','b']],
  5: [['l','t'],['r','t'],['c','m'],['l','b'],['r','b']],
  6: [['l','t'],['r','t'],['l','m'],['r','m'],['l','b'],['r','b']],
};

// Abbreviated skill labels for die chips
const SKILL_ABBREV = {
  'Labor':            'Labor',
  'Stalk beasts':     'Stalk',
  'Cook provisions':  'Cook',
  'Gather mast':      'Gather',
  'Keep ward':        'Watch',
  'Fell timber':      'Fell',
  'Buck timber':      'Buck',
  'Rive palls':       'Rive',
  'Set palls':        'Set',
  'Dig fosse':        'Fosse',
  'Build palisade':   'Build',
  'Tend wounds':      'Tend',
  'Spy out':          'Scout',
};

function dieFaceHTML(face) {
  const tier = Math.min(Math.max(Math.round(face.level), 1), 6);
  const pips = (DIE_FACE_PIPS[tier] || DIE_FACE_PIPS[1])
    .map(([col, row]) => `<div class="die-pip ${col} ${row}"></div>`)
    .join('');
  const label = SKILL_ABBREV[face.skill] || face.skill.split(' ')[0];
  return `<div class="die-chip">
    <div class="die-face">${pips}</div>
    <span class="die-label">${label}</span>
  </div>`;
}

// Expanded die strip for game roster cards
function dieFaceStripHTML(faces) {
  return `<div class="char-die-row">${sortFaces(faces).map(dieFaceHTML).join('')}</div>`;
}

// Sort faces: Labor last, rest by level desc, ties alphabetical
function sortFaces(faces) {
  return [...faces].sort((a, b) => {
    if (a.skill === 'Labor' && b.skill !== 'Labor') return 1;
    if (b.skill === 'Labor' && a.skill !== 'Labor') return -1;
    if (b.level !== a.level) return b.level - a.level;
    return a.skill.localeCompare(b.skill);
  });
}

// Skill chip for selection screen die grid (unchanged)
function skillChipHTML(face) {
  let pips = '<div class="skill-pips">';
  for (let i = 0; i < face.level; i++) pips += `<span class="skill-pip on"></span>`;
  pips += '</div>';
  return `<div class="skill-chip">
    <span class="skill-chip-name">${face.skill}</span>
    ${pips}
  </div>`;
}

// 3×2 grid for selection cards — real die face formations
function dieGridHTML(faces) {
  return `<div class="die-grid">${sortFaces(faces).map(dieFaceHTML).join('')}</div>`;
}

function formatSupplies(supplies) {
  const labels = { rations: 'rations', rawFood: 'raw food', forageFood: 'forage', timber: 'timber', logs: 'logs', palls: 'palls' };
  return Object.entries(supplies).map(([k, v]) => `${v} ${labels[k]}`).join(', ');
}


const RESOURCE_LABELS = {
  rations:    'Rations',
  rawFood:    'Raw Food',
  forageFood: 'Forage',
  quarry:     'Quarry',
  simples:    'Simples',
  timber:     'Timber',
  logs:       'Logs',
  palls:      'Palls',
};

// Wood sub-resources — displayed as a grouped cluster under a "Wood" header
const WOOD_RESOURCES = ['timber', 'logs', 'palls'];

// Qualitative progress band — used by renderSiteCard for project status
function qualBand(progress, total) {
  const frac = progress / total;
  if (frac < 0.4)  return 'Much work remains';
  if (frac < 0.75) return 'Work continues';
  return 'Nearly done';
}

const STORES_RESOURCES = ['simples'];

// Category definitions: order controls display order in ledger
const LEDGER_CATEGORIES = [
  { key: 'victuals', label: 'Victuals', resources: ['rawFood', 'forageFood', 'rations'] },
  { key: 'wood',     label: 'Wood',     resources: WOOD_RESOURCES },
  { key: 'stores',   label: 'Stores',   resources: STORES_RESOURCES },
];

function renderResourceLedger(deltas = {}) {
  const gs = gameState;

  // Snapshot seen state BEFORE updating — used for fresh-ink detection
  const wasSeen = new Set(gs.seenResources);

  // Update seenResources — centralised here
  if (gs.quarry && gs.quarry.length > 0) gs.seenResources.add('quarry');
  WOOD_RESOURCES.forEach(k => { if (gs.resources[k] > 0 || deltas[k]) gs.seenResources.add(k); });
  ['rations','rawFood','forageFood'].forEach(k => {
    if (gs.resources[k] > 0 || deltas[k]) gs.seenResources.add(k);
  });
  STORES_RESOURCES.forEach(k => { if (gs.resources[k] > 0 || deltas[k]) gs.seenResources.add(k); });

  // Build current quarry tally
  const currentTally = {};
  (gs.quarry || []).forEach(q => { currentTally[q.name] = (currentTally[q.name] || 0) + 1; });
  const prevTally = gs.prevQuarryTally || {};

  // Helper: one standard resource row
  function rowHTML(k) {
    const v = gs.resources[k] || 0;
    const d = deltas[k] || 0;
    const isNew = !wasSeen.has(k); // fresh ink if first appearance this session
    const freshClass = isNew ? ' fresh' : '';
    const deltaHTML = d !== 0
      ? `<span class="ldg-delta">${d > 0 ? '+' : ''}${d}</span>`
      : '';
    return `<div class="ldg-row">
      <span class="ldg-name${freshClass}">${RESOURCE_LABELS[k] || k}</span>
      <div class="ldg-dots"></div>
      <div class="ldg-tail">
        <span class="ldg-num${freshClass}">${v}</span>${deltaHTML}
      </div>
    </div>`;
  }

  // Quarry parent row + drawer
  function quarryHTML() {
    const total = gs.quarry ? gs.quarry.length : 0;
    const qd = deltas['quarry'] || 0;
    const deltaHTML = qd !== 0
      ? `<span class="ldg-delta">${qd > 0 ? '+' : ''}${qd}</span>`
      : '';
    const openClass = gs.quarryOpen ? ' open' : '';
    const chevronStyle = gs.quarryOpen ? '' : ' style="transform:rotate(-90deg)"';

    // Animal sub-rows — only animals currently in quarry
    const animalRows = Object.entries(currentTally).map(([name, cnt]) => {
      const prevCnt = prevTally[name] || 0;
      // Fresh if: new animal (not in prev) or count changed
      const animalFresh = prevCnt === 0 || cnt !== prevCnt;
      const freshClass = animalFresh ? ' fresh' : '';
      const multHTML = cnt > 1
        ? `<span class="ldg-animal-mult${freshClass}">×${cnt}</span>`
        : '';
      return `<div class="ldg-animal-row">
        <span class="ldg-animal-name${freshClass}">${name}</span>${multHTML}
      </div>`;
    }).join('');

    return `<div class="ldg-quarry-toggle" onclick="toggleLedgerQuarry()">
      <span class="ldg-quarry-name">Quarry</span>
      <div class="ldg-dots"></div>
      <div class="ldg-tail">
        <span class="ldg-quarry-num">${total}</span>${deltaHTML}
        <span class="ldg-chevron"${chevronStyle}>▾</span>
      </div>
    </div>
    <div class="ldg-quarry-drawer${openClass}">
      <div class="ldg-quarry-indent">${animalRows}</div>
    </div>`;
  }

  // Build category columns — only render a category if it has at least one seen resource
  // (or quarry for Victuals)
  let html = '';
  for (const cat of LEDGER_CATEGORIES) {
    const quarryInVictuals = cat.key === 'victuals' && gs.seenResources.has('quarry');
    const seenInCat = cat.resources.filter(k => gs.seenResources.has(k));
    if (!quarryInVictuals && seenInCat.length === 0) continue;

    let rows = '';
    if (cat.key === 'victuals') {
      if (quarryInVictuals) rows += quarryHTML();
      rows += seenInCat.map(rowHTML).join('');
    } else {
      rows = seenInCat.map(rowHTML).join('');
    }

    html += `<div class="ldg-cat">
      <div class="ldg-cat-head">${cat.label}</div>
      ${rows}
    </div>`;
  }

  document.querySelector('#resourceLedger .ledger-inner').innerHTML = html;

  // Save tally for next render's fresh-ink comparison
  gs.prevQuarryTally = { ...currentTally };
}

function toggleLedgerQuarry() {
  gameState.quarryOpen = !gameState.quarryOpen;
  renderResourceLedger();
}

function renderSiteCard(deltas = {}) {
  const gs = gameState;

  renderResourceLedger(deltas);

  // Site state label
  let stateLabel = 'Forest Meadow';
  if (gs.buildings.palisade)           stateLabel = 'Bailey';
  else if (gs.buildings.fosseComplete) stateLabel = 'Fortified Camp';
  else if (gs.buildings.hearth)        stateLabel = 'Encampment';
  else if (gs.buildings.groundCleared) stateLabel = 'Campground';
  document.getElementById('siteState').textContent = stateLabel;

  // Fortification stage indicator — 6 stages.
  // Each pip: 'on' = complete, 'in-progress' = work begun but not done, '' = not started.
  // Stages: 1=Ground cleared, 2=Fosse dug, 3=Fosse complete, 4=Palisade designed, 5=Palls set, 6=Palisade done.
  const stageComplete = [
    gs.buildings.groundCleared,
    gs.buildings.fosseComplete,
    gs.buildings.fosseComplete,   // stage 3 = fosse done (same flag, fosse is 2 steps)
    gs.events.palisadeDesigned,
    gs.buildings.palisade,
    gs.buildings.palisade,
  ];
  const stageInProgress = [
    !gs.buildings.groundCleared && (gs.buildings.groundProgress || 0) > 0,
    gs.events.fosseDesigned && !gs.buildings.fosseComplete && (gs.buildings.fosseProgress || 0) > 0,
    false,  // stage 3 shares fosse completion
    gs.buildings.fosseComplete && !gs.events.palisadeDesigned,
    gs.events.palisadeDesigned && !gs.buildings.palisade && (gs.buildings.palisadeProgress || 0) > 0,
    false,
  ];
  const stageDots = `<div style="display:flex;flex-direction:row;gap:14px;justify-content:center;align-items:center;margin:6px 0 4px;">` +
    Array.from({ length: 6 }, (_, i) => {
      const cls = stageComplete[i] ? 'on' : stageInProgress[i] ? 'in-progress' : '';
      return `<div class="stage-dot ${cls}"></div>`;
    }).join('') +
    `</div>`;
  document.getElementById('siteStage').innerHTML = stageDots;

  // Active projects — Hearth is a structure (not fortification track), shown separately.
  // Fosse shows from design event onward (including "not yet begun" state).
  const PROJECTS = [
    {
      label: 'Clearing ground',
      show: !gs.buildings.groundCleared && (gs.buildings.groundProgress || 0) > 0,
      status: qualBand(gs.buildings.groundProgress || 0, 3),
    },
    {
      label: 'Fosse',
      show: gs.events.fosseDesigned && !gs.buildings.fosseComplete,
      status: (gs.buildings.fosseProgress || 0) === 0
        ? 'Work not yet begun'
        : qualBand(gs.buildings.fosseProgress || 0, 6),
    },
    {
      label: 'Palisade',
      show: gs.events.palisadeDesigned && !gs.buildings.palisade && (gs.buildings.palisadeProgress || 0) > 0,
      status: qualBand(gs.buildings.palisadeProgress || 0, 8),
    },
  ];

  const visibleProjects = PROJECTS.filter(p => p.show);

  // Structures — only completed ones, only Hearth and Palisade (Fosse handled separately below)
  const structures = [];
  if (gs.buildings.hearth)   structures.push({ label: 'Hearth', tip: 'Cook cap +2 · Forage cooks 1.5×' });
  if (gs.buildings.palisade) structures.push({ label: 'Palisade' });

  // Build siteProjects HTML: Site Development only (no Structures section here)
  let projectsHTML = '';
  if (visibleProjects.length > 0) {
    projectsHTML += '<div class="site-section-label">Site Development</div>';
    projectsHTML += '<div class="site-projects-row">';
    projectsHTML += visibleProjects.map(p => `
      <div class="site-project">
        <span class="site-project-name">${p.label}</span>
        <span class="site-project-status">${p.status}</span>
      </div>`).join('');
    projectsHTML += '</div>';
  }
  document.getElementById('siteProjects').innerHTML = projectsHTML;

  // Fosse enhancement — plain text label below site name, only when complete
  const fosseEl = document.getElementById('fosseEnhancement');
  if (fosseEl) {
    if (gs.buildings.fosseComplete) {
      fosseEl.textContent = '⁜ Fosse cut';
      fosseEl.style.display = '';
    } else {
      fosseEl.style.display = 'none';
    }
  }

  // Structures card — visible once any structure is built
  const structuresCard = document.getElementById('structuresCard');
  const structuresList = document.getElementById('structuresList');
  if (structuresCard && structuresList) {
    if (structures.length > 0) {
      structuresCard.classList.add('visible');
      structuresList.innerHTML = structures.map(s => {
        const tip = s.tip ? ` data-tip="${s.tip}"` : '';
        return `<span class="building-chip"${tip}>${s.label}</span>`;
      }).join('');
    } else {
      structuresCard.classList.remove('visible');
      structuresList.innerHTML = '';
    }
  }
}

let selected = new Set();
let rerolls = 3;

function renderSelection() {
  document.getElementById('candidateGrid').innerHTML =
    ALL_CANDIDATES.map(c => `
      <div class="cand-card${selected.has(c.name) ? ' selected' : ''}" data-name="${c.name}">
        <div class="cand-portrait-zone">
          <div class="portrait-placeholder">${SILHOUETTE}</div>
          <div class="portrait-fade"></div>
        </div>
        <div class="cand-body">
          <p class="cand-name">${c.name}</p>
          <p class="cand-role">${c.role} <span class="char-level">${toRoman(characterLevel(c.faces))}</span></p>
          <hr class="cand-divider">
          <p class="cand-flavor">${c.backstory}</p>
          ${dieGridHTML(c.faces)}
          <div class="cand-footer">
            <span class="cand-supplies">${formatSupplies(c.supplies)}</span>
            <span class="cand-weapon">${c.weapon}</span>
          </div>
        </div>
      </div>`).join('');

  document.getElementById('candidateGrid').querySelectorAll('.cand-card').forEach(el => {
    el.addEventListener('click', () => {
      const n = el.dataset.name;
      selected.has(n) ? selected.delete(n) : selected.size < 5 && selected.add(n);
      renderSelection();
    });
  });

  document.getElementById('selInstruction').textContent =
    `Choose 5 men — ${selected.size} of 5 selected.`;
  document.getElementById('confirmBtn').disabled = selected.size !== 5;
}

document.getElementById('rerollBtn').addEventListener('click', () => {
  if (rerolls <= 0) return;
  rerolls--;

  // Keep selected candidates; replace unselected slots with fresh ones
  const kept = ALL_CANDIDATES.filter(c => selected.has(c.name));
  const needed = 8 - kept.length;

  // Build exclusion set: roles/face-keys already in kept
  const keptRoleCounts = {};
  const keptKeys = new Set();
  kept.forEach(c => {
    keptRoleCounts[c.role] = (keptRoleCounts[c.role] || 0) + 1;
    keptKeys.add(facesKey(c.faces));
  });

  // Generate replacements respecting role cap and uniqueness
  let pool = shuffle([...ROLE_DEFS, ...ROLE_DEFS]);
  const replacements = [];
  const roleCounts = { ...keptRoleCounts };
  const seenKeys = new Set(keptKeys);
  const names = shuffledNames();
  let nameIdx = 0;

  for (const def of pool) {
    if (replacements.length >= needed) break;
    if ((roleCounts[def.role] || 0) >= 2) continue;
    let faces, key, attempts = 0;
    do {
      faces = generateFaces(def.sig, def.laborMin || 1);
      key = facesKey(faces);
      attempts++;
    } while (seenKeys.has(key) && attempts < 20);
    seenKeys.add(key);
    roleCounts[def.role] = (roleCounts[def.role] || 0) + 1;
    // Skip names already used by kept candidates
    while (kept.some(c => c.name === names[nameIdx])) nameIdx++;
    replacements.push({
      name: names[nameIdx++], role: def.role, weapon: def.weapon,
      supplies: randomSupplies(), backstory: def.backstory, faces,
    });
  }

  ALL_CANDIDATES = [...kept, ...replacements];
  const btn = document.getElementById('rerollBtn');
  btn.textContent = rerolls === 0 ? 'No Rerolls Remaining'
    : rerolls === 1 ? '1 Reroll Remaining'
    : `${rerolls} Rerolls Remaining`;
  btn.disabled = rerolls === 0;
  renderSelection();
});

function actionSlotHTML(char) {
  if (!char.currentAction) {
    return `<div class="action-slot empty" data-id="${char.name}">
      <div class="action-slot-icon-placeholder"></div>
    </div>`;
  }

  return `<div class="action-slot assigned" data-id="${char.name}">
    <div class="action-slot-label">${label}</div>
  </div>`;
}

function renderRoster() {
  const container = document.getElementById('roster');
  container.innerHTML = '';

  gameState.characters.forEach(char => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.dataset.name = char.name;

    card.innerHTML = `
      <div class="char-card-row">
        <div class="char-face">${SILHOUETTE}</div>
        <div class="char-identity">
          <span class="char-name">${char.name}</span>
          <span class="char-role">${char.role} <span class="char-level">${toRoman(characterLevel(char.faces))}</span></span>
          ${char.hungerState ? `<span class="hunger-${char.hungerState}">${char.hungerState}</span>` : ''}
        </div>
        <div class="char-action-col">
          ${actionSlotHTML(char)}
        </div>

    // Tap face → open portrait modal
    card.querySelector('.char-face').addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('portraitModalFace').innerHTML = SILHOUETTE;
      document.getElementById('portraitModalName').textContent = char.name;
      document.getElementById('portraitModalRole').textContent = char.role;
      document.getElementById('portraitModalBackstory').textContent = char.backstory;
      document.getElementById('portraitModal').classList.add('open');
    });

    // Tap card row (not face, not action) → expand/collapse die faces
    card.querySelector('.char-card-row').addEventListener('click', e => {
      if (e.target.closest('.char-action-col')) return;
      if (e.target.closest('.char-face')) return;
      card.classList.toggle('expanded');
    });

    // Tap action slot → assign or reassign
    card.querySelector('.action-slot').addEventListener('click', e => {
      e.stopPropagation();
      if (char.currentAction) {
        char.currentAction = null;
        renderRoster();
        updateStartDay();
        renderSiteCard({});
        openActionTray(char.name);
      } else {
        openActionTray(char.name);
      }
    });

    container.appendChild(card);
  });
}

function updateStartDay() {
  const unassigned = gameState.characters.filter(c => !c.currentAction).length;
  document.getElementById('startDayBtn').classList.toggle('ready', unassigned === 0);
}

     - showWhen(gs) is true OR it is downstream of a shown step (grayed)
   A step is GRAYED (visible but unclickable) when:
     - shown in chain (at least one prior step has been seen) AND
     - inputReady(gs) returns false
   A step disappears entirely when:
     - requires(gs) returns false (completed one-time events/buildings)
   pip: color class for the icon pip (standard/slate/ochre/moss/oxblood)
───────────────────────────────────────────── */

          inputReady: gs => gs.resources.rawFood > 0 || gs.resources.forageFood > 0 },
      ],
      // Gather chain
      [
        { id: 'Gather mast', label: 'Gather mast', iconText: 'Gather', skill: 'Gather', minLevel: 1,
          inputReady: () => true },
      ],
    ],
  },
  {
    id: 'forestry',
    label: 'Forestry',
    chains: [
      [
        { id: 'Fell timber', label: 'Fell timber', iconText: 'Fell', skill: 'Forestry', minLevel: 1,

// Flat list of all action defs for resolver lookups (id, skill, minLevel, solo, requires)
const ACTION_DEFS = INDUSTRIES.flatMap(ind => ind.chains.flat());

// Convenience: look up a def by id
function getActionDef(id) {
  return ACTION_DEFS.find(d => d.id === id);
}

// Returns true if character can perform this action (skill gate + solo gate).
// Does NOT check requires() — that is handled separately in tray rendering.
function charCanDo(char, def) {
  if (def.role && char.role !== def.role) return false;
  const face = char.faces.find(f => f.skill === def.skill);
  if (!face || face.level < def.minLevel) return false;
  if (def.solo) {
    const alreadyAssigned = gameState.characters.some(
      c => c.name !== char.name && c.currentAction === def.id
    );
    if (alreadyAssigned) return false;
  }
  return true;
}

// Flat list of action ids the character can actually be assigned to (for auto-assign).
function getAvailableActions(char) {
  return ACTION_DEFS.filter(def => {
    if (!charCanDo(char, def)) return false;
    if (def.requires && !def.requires(gameState)) return false;
    if (!def.inputReady(gameState)) return false;
    return true;
  });
}

let activeTrayChar = null;

function openActionTray(charName) {
  const char = gameState.characters.find(c => c.name === charName);
  if (!char) return;

  const tray = document.getElementById('actionTray');
  if (activeTrayChar === charName && tray.classList.contains('open')) {
    closeTray(); return;
  }

  activeTrayChar = charName;

  // Quick-assign if exactly one fully-ready action exists
  const ready = getAvailableActions(char);
  if (ready.length === 1) {
    char.currentAction = ready[0].id;
    closeTray(); renderRoster(); updateStartDay(); renderSiteCard({});
    return;
  }

  document.getElementById('trayHeader').textContent = `Assign — ${char.name}`;
  const list = document.getElementById('trayActionList');
  list.innerHTML = '';

  let anyIndustryShown = false;

  INDUSTRIES.forEach(industry => {
    // Build pipeline nodes for each chain in this industry
    // A chain contributes nodes if at least one step is visible to this char
    const chainNodes = industry.chains.map(chain => {
      const nodes = [];
      let chainUnlocked = false; // becomes true once first visible step found

      chain.forEach(def => {
        // requires() false → step is permanently gone (completed/N/A)
        if (def.requires && !def.requires(gameState)) return;

        const canDo = charCanDo(char, def);
        if (!canDo) return; // character lacks the skill entirely — not shown

        // Discoverability gate — only show if previously seen
        if (!gameState.seenActions.has(def.id)) return;

        // Step is visible. Mark chain as unlocked.
        chainUnlocked = true;

        const inputOk = def.inputReady(gameState);
        const isSelected = char.currentAction === def.id;

        nodes.push({ def, inputOk, isSelected });
      });

      return chainUnlocked ? nodes : [];
    }).filter(n => n.length > 0);

    if (chainNodes.length === 0) return; // nothing in this industry for this char

    anyIndustryShown = true;

    const section = document.createElement('div');
    section.className = 'tray-industry';

    const lbl = document.createElement('div');
    lbl.className = 'tray-industry-label';
    lbl.textContent = industry.label;
    section.appendChild(lbl);

    chainNodes.forEach((nodes, ci) => {
      if (ci > 0) {
        // Separator between parallel chains in same industry
        const sep = document.createElement('div');
        sep.style.cssText = 'height:6px;';
        section.appendChild(sep);
      }

      const pipeline = document.createElement('div');
      pipeline.className = 'tray-pipeline';

      nodes.forEach((nodeData, ni) => {
        const { def, inputOk, isSelected } = nodeData;

        if (ni > 0) {
          const arrow = document.createElement('div');
          arrow.className = 'tray-pipe-arrow';
          arrow.textContent = '›';
          pipeline.appendChild(arrow);
        }

        const node = document.createElement('div');
        const dimmed = !inputOk;
        node.className = 'tray-node'
          + (isSelected ? ' tray-node-selected' : '')
          + (dimmed ? ' tray-node-dimmed' : '');

        node.innerHTML = `
          <div class="tray-node-icon${def.isBuilding ? ' icon-building' : ''}">
            <span class="tray-node-icon-text">${def.label}</span>
          </div>`;

        if (!dimmed) {
          node.addEventListener('click', () => {
            char.currentAction = def.id;
            closeTray(); renderRoster(); updateStartDay(); renderSiteCard({});
          });
        }

        pipeline.appendChild(node);
      });

      section.appendChild(pipeline);
    });

    list.appendChild(section);
  });

  if (!anyIndustryShown) {
    const msg = document.createElement('div');
    msg.style.cssText = 'padding:14px 16px; font-family:var(--font-body); font-style:italic; font-size:var(--text-sm); color:var(--color-ink-muted);';
    msg.textContent = 'No actions available yet.';
    list.appendChild(msg);
  }

  tray.classList.add('open');
}

function closeTray() {
  document.getElementById('actionTray').classList.remove('open');
  activeTrayChar = null;
}

// Close tray on outside tap (but not on action slot taps — those context-switch)
document.addEventListener('click', e => {
  if (!e.target.closest('#actionTray') && !e.target.closest('.char-action-col')) {
    closeTray();
  }
});

/* ─────────────────────────────────────────────
   SEEN ACTIONS — discoverability gate
   An action becomes "seen" the first time its requires() gate is true
   AND at least one character in the vanguard has the required skill/level.
   Once seen it stays seen permanently (persists through gate closing).
───────────────────────────────────────────── */
function updateSeenActions() {
  const gs = gameState;
  ACTION_DEFS.forEach(def => {
    if (gs.seenActions.has(def.id)) return; // already discovered
    // requires gate — if false, not yet discoverable
    if (def.requires && !def.requires(gs)) return;
    // inputReady gate — inputs must be present for first discovery
    if (!def.inputReady(gs)) return;
    // Check at least one character can perform it (skill gate)
    const anyCanDo = gs.characters.some(c => {
      const face = c.faces.find(f => f.skill === def.skill);
      return face && face.level >= def.minLevel;
    });
    if (anyCanDo) gs.seenActions.add(def.id);
  });
}

/* ─────────────────────────────────────────────
   START GAME
───────────────────────────────────────────── */
function startGame() {
  const vanguard = ALL_CANDIDATES.filter(c => selected.has(c.name));
  gameState.characters = vanguard.map(c => ({ ...c, currentAction: null, daysSinceEating: 0 }));

  // Sum starting resources from supplies
  vanguard.forEach(c => {
    Object.entries(c.supplies).forEach(([k, v]) => {
      gameState.resources[k] = (gameState.resources[k] || 0) + v;
    });
  });

  document.getElementById('selectionScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');

  // Rations always visible from game start (starting resource)
  gameState.seenResources.add('rations');

  // Seed seenActions — mark any action whose requires() is currently true
  // (or has no requires gate) as discovered for any character who can do it
  updateSeenActions();

  document.getElementById('journalDayLabel').textContent = 'Day 0';
  renderSiteCard();
  renderRoster();
  updateStartDay();
  // Ensure Men tab is active and button is visible on game start
  switchTab('tabMen');
}

document.getElementById('confirmBtn').addEventListener('click', startGame);

/* ─────────────────────────────────────────────
   TAB SYSTEM
───────────────────────────────────────────── */
function switchTab(tabId) {
  // Panes
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  // Buttons
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabId);
  });
  // Begin the Day button — visible only on Men tab
  const btn = document.getElementById('startDayBtn');
  if (tabId === 'tabMen') {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// Portrait modal — tap outside card to dismiss
document.getElementById('portraitModal').addEventListener('click', e => {

    document.getElementById('portraitModal').classList.remove('open');
  }
});

/* ─────────────────────────────────────────────
   D6 ROLL ENGINE
   Each character is a d6. Roll lands on 1–6 (row).
   The face level for the relevant skill is the column (1–6).
   Every action resolver: look up TABLES[action][roll][level-1].
───────────────────────────────────────────── */

// Roll the d6 — returns 1–6 regardless of skill levels.
function rollCharacterDie() {
  return Math.floor(Math.random() * 6) + 1;
}

// Get the level (1–6) of a named skill on a character's die.
// Returns 0 if the skill isn't on the die — action cannot be performed.
function getSkillLevel(character, skillName) {
  const face = character.faces.find(f => f.skill === skillName);
  return face ? face.level : 0;
}

/* ─────────────────────────────────────────────

  UNMAKE_PRIZE: {

  RIVE: {
